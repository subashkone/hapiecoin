<title>Adjustment Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b0d10;--card:#12151a;--card2:#171b21;--border:#242a33;--fg:#e6e8eb;--muted:#8b93a1;--amber:#f0a92c;--amber-bg:rgba(240,169,44,.12);--up:#39b37a;--up-bg:rgba(57,179,122,.14);--down:#e05c5c;--down-bg:rgba(224,92,92,.14);--curve:#5b8def;--font:Inter,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--font)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.micro{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--card)}
.top b{font-size:15px}.top .amber{color:var(--amber)}
.pill{display:inline-block;border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.pill.paper{border-color:var(--muted)}.pill.live{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.flow{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.flow .st{border:1px solid var(--border);border-radius:14px;padding:2px 10px;font-size:11.5px;color:var(--muted)}
.flow .st.on{border-color:var(--amber);color:var(--fg);background:var(--amber-bg)}.flow .st.done{color:var(--up);border-color:var(--up)}
.flow .arrow{color:var(--muted)}
.approach{margin-left:auto;display:flex;gap:4px;align-items:center}
.approach button{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:5px 12px;font:12.5px var(--font);cursor:pointer}
.approach button.on{color:var(--fg);border-color:var(--amber);background:var(--amber-bg)}
.chooser{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.chooser .opt{border:1px solid var(--border);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--card)}
.chooser .opt.on{border-color:var(--amber);background:var(--amber-bg)}
.chooser .opt b{display:block;margin-bottom:3px}.chooser .opt span{color:var(--muted);font-size:12px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100vh - 92px)}
.pane{min-width:0;border-right:1px solid var(--border)}.pane:last-child{border-right:0}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--border)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 10px;font:13px var(--font);cursor:pointer}
.tabs button.on{color:var(--fg);border-bottom-color:var(--amber)}.tabs .right{margin-left:auto}
.body{padding:12px}
.card{border:1px solid var(--border);background:var(--card);border-radius:6px;padding:10px 12px;margin-bottom:10px}
.card.sel{border-color:var(--curve)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--border);color:var(--fg);border-radius:5px;padding:5px 11px;font:12.5px var(--font);cursor:pointer}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:600}
.btn.warn{color:var(--amber);border-color:var(--amber)}.btn.danger{color:var(--down);border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.legchip{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--muted)}
.legchip.adj{border-style:dashed;color:var(--fg)}
.pos{color:var(--up)}.neg{color:var(--down)}
.side{font-family:var(--mono);font-size:10.5px;border-radius:3px;padding:1px 6px}
.side.buy{background:var(--up-bg);color:var(--up)}.side.sell{background:var(--down-bg);color:var(--down)}
table{border-collapse:collapse;width:100%}th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--border);white-space:nowrap}td.r,th.r{text-align:right}
.bs{display:inline-block;width:20px;height:20px;line-height:18px;text-align:center;border:1px solid var(--border);border-radius:3px;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--muted);user-select:none}
.bs.b:hover,.bs.b.on{color:var(--up);border-color:var(--up);background:var(--up-bg)}.bs.s:hover,.bs.s.on{color:var(--down);border-color:var(--down);background:var(--down-bg)}
.strike{font-family:var(--mono);font-weight:600;background:var(--card2)}
.chainwrap{max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:6px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.tile{border:1px solid var(--border);background:var(--card);border-radius:6px;padding:8px 10px;min-width:0}
.tile .v{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:2px}
.tile .d{font-family:var(--mono);font-size:11px;margin-top:2px;color:var(--muted)}
.tile .d .arr{color:var(--muted);margin:0 4px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--fg);vertical-align:middle;margin-right:5px}
.legend i.ghost{border-top-style:dashed;border-top-color:var(--muted)}
canvas{width:100%;height:240px;display:block;background:var(--card);border:1px solid var(--border);border-radius:6px}
.slider{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
input[type=range]{accent-color:var(--amber);flex:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
.overlay.open{display:flex}
.dialog{background:var(--card);border:1px solid var(--border);border-radius:8px;width:min(920px,94vw);max-height:90vh;overflow:auto;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dialog h3{margin:0 0 4px;font-size:16px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--card2);border:1px solid var(--up);color:var(--fg);padding:10px 14px;border-radius:6px;display:none;z-index:30;font-size:12.5px}
.toast.show{display:block}
.note{border:1px dashed var(--border);border-radius:6px;padding:8px 10px;color:var(--muted);font-size:12px}
.hl{outline:2px solid var(--amber);outline-offset:2px;border-radius:5px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.lock{color:var(--muted);font-family:var(--mono);font-size:10.5px}
.ticket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ticket .tile .v{font-size:15px}
.verdict{border-left:3px solid var(--up);background:var(--up-bg);padding:8px 10px;border-radius:4px;font-size:12px}
.verdict.bad{border-left-color:var(--down);background:var(--down-bg)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:3px;padding:0 4px;color:var(--muted)}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.pane{border-right:0;border-bottom:1px solid var(--border)}.strip{grid-template-columns:repeat(2,1fr)}.ticket{grid-template-columns:repeat(2,1fr)}}
</style>

<div class="top"><span class="amber">⚠</span><b>HapieCoin</b><span>Analyse</span><span class="pill">BTC</span><span class="micro">Futures · BTCUSD</span><span class="num" style="font-size:15px">79,557.2</span><span class="micro">▲ 24h</span><span style="margin-left:auto" class="micro"><span class="pos">●</span> feed live · 1 ms</span><span class="pill">₹ INR</span></div>

  <div class="pane" id="left">
    <div class="tabs"><button data-lt="chain">Chain</button><button data-lt="builder" id="tabBuilder">Builder <span class="pill" id="builderCount">2</span></button><button data-lt="paper" class="on">Paper <span class="pill">3</span></button><button data-lt="live">Live</button><button data-lt="journal">Journal</button><span class="right micro" style="align-self:center;padding-right:8px">lot · basis mark</span></div>

    <div class="tabs" id="rtabs"><span id="paneSource" class="micro" style="align-self:center;padding:0 8px"></span><button data-rt="payoff" class="on">Payoff</button><button data-rt="greeks">Greeks</button><button data-rt="ladder">Ladder</button><span class="right"></span><button id="backBuilder" class="btn" style="display:none;margin:5px 8px">Cancel adjustment</button></div>
    <div class="body" id="rightBody"></div>

</div>

<script>
// ---------- mock data: a losing Long Call Butterfly on BTC, spot above the wings ----------
const SPOT = 79557.2, LOT = 0.001, INR = 84.2, IV = 0.40, T_YEARS = 1.2 / 365; // ~1.2 days to the 09 Sep 12:00 UTC settle
const S = { id: "STRAT_UYMQYLDVKTOU", name: "Long Call Butterfly", status: "paper", asset: "BTC", legs: [
  { id: "l1", side: "buy", type: "C", strike: 77800, lots: 100, entry: 837.8, mark: 1874.3 },
  { id: "l2", side: "sell", type: "C", strike: 78200, lots: 200, entry: 603.8, mark: 1475.5 },
  { id: "l3", side: "buy", type: "C", strike: 78600, lots: 100, entry: 425.9, mark: 1076.8 },
]};
const CHAIN = [77200, 77400, 77600, 77800, 78000, 78200, 78400, 78600, 78800, 79000, 79200, 79400, 79600, 79800, 80000, 80200, 80400, 80600].map((k) => {
  const c = Math.max(SPOT - k, 0) + 120 * Math.exp(-Math.abs(SPOT - k) / 700) + 40; const p = Math.max(k - SPOT, 0) + 120 * Math.exp(-Math.abs(SPOT - k) / 700) + 40;
  return { strike: k, cMark: Math.round(c * 10) / 10, pMark: Math.round(p * 10) / 10, cIv: (62 - (k - 77200) / 100).toFixed(1), pIv: (55 - (k - 77200) / 120).toFixed(1), cOi: Math.round(3 + Math.random() * 30) + "K", pOi: Math.round(60 + Math.random() * 200) + "K" };
});
let approach = "A", mode = "paper", step = 1, adjusting = false, picks = [], leftTab = "paper", rightTab = "payoff", targetPct = 0, confirmed = false, showBefore = true;

// ---------- maths (mock: intrinsic at expiry + a smoothed "today" curve; Black-76 greeks) ----------
const N = (x) => 0.5 * (1 + erf(x / Math.SQRT2)); function erf(x) { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }
function greeksOf(leg, spot) { const T = T_YEARS, s = IV * Math.sqrt(T), d1 = (Math.log(spot / leg.strike) + 0.5 * s * s) / s, d2 = d1 - s, nd1 = Math.exp(-0.5 * d1 * d1) / Math.sqrt(2 * Math.PI); const call = leg.type === "C"; const delta = call ? N(d1) : N(d1) - 1; const gamma = nd1 / (spot * s); const theta = -(spot * nd1 * IV) / (2 * Math.sqrt(T)) / 365; const vega = spot * nd1 * Math.sqrt(T) / 100; const q = leg.lots * LOT * (leg.side === "buy" ? 1 : -1); return { delta: delta * q, gamma: gamma * q, theta: theta * q, vega: vega * q }; }
function pnlAt(legs, price, cost) { let v = 0; for (const l of legs) { const intr = l.type === "C" ? Math.max(price - l.strike, 0) : Math.max(l.strike - price, 0); const sign = l.side === "buy" ? 1 : -1; v += sign * (intr - (cost === "entry" ? l.entry : l.mark)) * l.lots * LOT; } return v * INR; }
function analyse(legs) { const lo = SPOT * 0.94, hi = SPOT * 1.06, pts = []; for (let i = 0; i <= 160; i++) { const p = lo + (hi - lo) * i / 160; pts.push({ p, exp: pnlAt(legs.map((l) => ({ ...l })), p, "cost") }); }
  // existing legs carry their entry premium; proposed legs their live mark (cost basis per leg)
  const withBasis = legs.map((l) => ({ ...l, basis: l.basis ?? l.entry }));
  const at = (p) => withBasis.reduce((v, l) => v + (l.side === "buy" ? 1 : -1) * ((l.type === "C" ? Math.max(p - l.strike, 0) : Math.max(l.strike - p, 0)) - l.basis) * l.lots * LOT, 0) * INR;
  const series = pts.map((x) => ({ p: x.p, exp: at(x.p) }));
  const smooth = series.map((x, i) => { let s = 0, w = 0; for (let k = -12; k <= 12; k++) { const j = Math.min(160, Math.max(0, i + k)); const ww = Math.exp(-k * k / 40); s += series[j].exp * ww; w += ww; } return s / w; });
  const maxP = Math.max(...series.map((x) => x.exp)), maxL = Math.min(...series.map((x) => x.exp));
  const unboundedUp = withBasis.reduce((n, l) => n + (l.type === "C" ? (l.side === "buy" ? 1 : -1) * l.lots : 0), 0) > 0, unboundedDn = withBasis.reduce((n, l) => n + (l.type === "C" ? (l.side === "buy" ? 1 : -1) * l.lots : 0), 0) < 0;
  const be = []; for (let i = 1; i < series.length; i++) if ((series[i - 1].exp < 0) !== (series[i].exp < 0)) be.push(Math.round(series[i].p));
  const sig = SPOT * IV * Math.sqrt(T_YEARS); let pop = 0, tot = 0; for (const x of series) { const w = Math.exp(-0.5 * ((x.p - SPOT) / sig) ** 2); tot += w; if (x.exp > 0) pop += w; }
  const g = withBasis.reduce((a, l) => { const gg = greeksOf(l, SPOT); return { delta: a.delta + gg.delta, gamma: a.gamma + gg.gamma, theta: a.theta + gg.theta, vega: a.vega + gg.vega }; }, { delta: 0, gamma: 0, theta: 0, vega: 0 });
  return { series, smooth, maxProfit: unboundedUp ? Infinity : maxP, maxLoss: unboundedDn ? -Infinity : maxL, breakevens: be, pop: pop / tot, greeks: g, margin: unboundedDn ? null : -maxL };
}
const openLegs = () => S.legs.map((l) => ({ ...l, basis: l.entry }));
const draftLegs = () => picks.map((p) => ({ id: p.key, side: p.side, type: p.type, strike: p.strike, lots: p.lots, entry: p.mark, mark: p.mark, basis: p.mark, adj: true }));
const fmtInr = (v) => v === Infinity ? "Unlimited" : v === -Infinity ? "Unlimited" : (v < 0 ? "−₹" : "+₹") + Math.abs(Math.round(v)).toLocaleString("en-IN");
const fmtInr0 = (v) => v === null ? "Unlimited" : "₹" + Math.abs(Math.round(v)).toLocaleString("en-IN");
const netPremiumUsd = (legs) => legs.reduce((s, l) => s + (l.side === "sell" ? 1 : -1) * l.basis * l.lots * LOT, 0);
const fees = (legs) => legs.reduce((s, l) => s + Math.min(l.basis * l.lots * LOT * 0.0005, SPOT * l.lots * LOT * 0.0003) * INR * 1.18, 0);

// ---------- rendering ----------
const $ = (s) => document.querySelector(s);
function setStep(n) { step = Math.max(step, n); document.querySelectorAll("#flow .st").forEach((el) => { const k = +el.dataset.step; el.classList.toggle("on", k === n); el.classList.toggle("done", k < n); }); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
function badge() { return `<span class="pill ${mode}">${mode === "paper" ? "○ PAPER" : "● LIVE"}</span>`; }

function renderLeft() {
  document.querySelectorAll("#left .tabs button").forEach((b) => b.classList.toggle("on", b.dataset.lt === leftTab));
  const el = $("#leftBody");
  if (adjusting && approach === "B") return renderInlinePicker(el);
  if (leftTab === "builder") return renderBuilder(el);
  if (leftTab === "paper") return renderPaper(el);
  el.innerHTML = `<div class="note">${leftTab} panel · not part of this mockup</div>`;
}
function renderPaper(el) {
  const a = analyse(openLegs()); const pnl = S.legs.reduce((s, l) => s + (l.side === "buy" ? 1 : -1) * (l.mark - l.entry) * l.lots * LOT, 0) * INR;
  el.innerHTML = `${step <= 2 ? `<div class="chooser"><div class="opt ${approach === "A" ? "on" : ""}" id="chA"><b>A · Reuse the Builder (your option)</b><span>Details → Builder opens with the 3 open legs locked · the chain picker is the modal used today · the right pane updates after "Add"</span></div><div class="opt ${approach === "B" ? "on" : ""}" id="chB"><b>B · Inline chain picker</b><span>Details → this left pane becomes the chain · every B / S click previews in the right pane at once · no modal until Confirm</span></div></div>` : ""}<div class="strip" style="grid-template-columns:repeat(3,1fr)"><div class="tile"><div class="micro">Total P&L</div><div class="v ${pnl < 0 ? "neg" : "pos"}">${fmtInr(pnl)}</div><div class="d">3 trades · 9 open legs</div></div><div class="tile"><div class="micro">Day P&L</div><div class="v neg">−₹885</div><div class="d">vs previous close</div></div><div class="tile"><div class="micro">Prices</div><div class="v">Live</div><div class="d">mark basis · gateway</div></div></div>
  <div class="card"><div class="row"><b>Bull Call Spread</b><span class="pill paper">○ PAPER</span><span class="micro">BTC · 2/3 legs · 1 day</span><span class="num pos" style="margin-left:auto">₹0.00</span></div><div class="row" style="margin-top:6px"><span class="legchip">B C 78,200 · 10</span><span class="legchip">S C 78,600 · 10</span></div></div>
  <div class="card"><div class="row"><b>Iron Butterfly</b><span class="pill paper">○ PAPER</span><span class="micro">BTC · 4/4 legs · 1 day</span><span class="num pos" style="margin-left:auto">₹0.00</span></div></div>
  <div class="card sel"><div class="row"><b>${S.name}</b>${badge()}<span class="micro">BTC · 3/3 legs · 0 days · custom</span><span class="num neg" style="margin-left:auto">${fmtInr(pnl)}</span></div>
    <div class="row" style="margin-top:6px">${S.legs.map((l) => `<span class="legchip">${l.side === "buy" ? "B" : "S"} ${l.type} ${l.strike.toLocaleString()} · ${l.lots}</span>`).join("")}${picks.length && confirmed ? draftLegs().map((l) => `<span class="legchip adj">${l.side === "buy" ? "B" : "S"} ${l.type} ${l.strike.toLocaleString()} · ${l.lots} · ADJ</span>`).join("") : ""}</div>
    <div class="row" style="margin-top:8px"><button class="btn hl" id="openDetails">Details</button><button class="btn">Go live</button><button class="btn warn">Stop</button><span class="micro" style="margin-left:auto">max loss ${fmtInr(a.maxLoss)} · click Details to adjust</span></div></div>`;
  $("#openDetails").onclick = () => { openDetails(); };
  if ($("#chA")) { $("#chA").onclick = () => setApproach("A"); $("#chB").onclick = () => setApproach("B"); }
}
function renderBuilder(el) {
  const d = draftLegs();
  el.innerHTML = `<div class="row" style="margin-bottom:8px"><span class="micro">Builder</span>${adjusting ? `<b>${S.name}</b>${badge()}<span class="pill" style="border-color:var(--amber);color:var(--amber)">ADJUSTING · ${S.legs.length} open legs locked</span>` : `<b>Bull Call Spread</b><span class="pill">BTC</span>`}<span style="margin-left:auto" class="micro">${adjusting ? 10 - S.legs.length - d.length + " more legs allowed" : "2 legs · 09 Sep"}</span></div>

  <div class="strip" style="margin-top:10px">${tileHtml("Max loss", b.maxLoss, a.maxLoss, "lossBetter")}${tileHtml("Max profit", b.maxProfit, a.maxProfit, "profitBetter")}${tileHtml("Probability of profit", b.pop, a.pop, "pct")}<div class="tile"><div class="micro">You ${prem >= 0 ? "receive" : "pay"}</div><div class="v ${prem >= 0 ? "pos" : "neg"}">${fmtInr(Math.abs(prem * INR))}</div><div class="d">at mark · fees est. ${fmtInr0(fees(d))}</div></div></div>
  <table><thead><tr><th>New leg</th><th class="r">Lots</th><th class="r">Mark now</th><th class="r">Value</th><th class="r">Fee est.</th><th class="r">Δ</th></tr></thead><tbody>${d.map((l) => `<tr><td><span class="side ${l.side}">${l.side.toUpperCase()}</span> <span class="num">${l.type}E ${l.strike.toLocaleString()} · 09 Sep</span></td><td class="r num">${l.lots}</td><td class="r num">${l.mark}</td><td class="r num">${fmtInr((l.side === "sell" ? 1 : -1) * l.mark * l.lots * LOT * INR)}</td><td class="r num">${fmtInr0(fees([l]))}</td><td class="r num">${greeksOf(l, SPOT).delta.toFixed(3)}</td></tr>`).join("")}</tbody></table>
  <div style="margin-top:10px">${mode === "paper" ? `<div class="note">Paper: legs are recorded at the mark shown above (re-read at this moment, not when you clicked). Existing legs are untouched.</div>` : `<div class="verdict"><b>Venue check · ok</b> · margin held now ₹18,420 → after ₹${Math.round(18420 + Math.max(0, -prem) * INR * 0.2).toLocaleString("en-IN")} · available ₹1,24,300 · all products operational · mark band ±5% sent with the order (a moved market rejects instead of filling badly)</div>`}</div>
  <div class="row" style="margin-top:12px"><span class="micro">marks as of 13:56:51 · <a href="#" style="color:var(--muted)">refresh preview</a></span><span style="margin-left:auto"></span><button class="btn" id="closeConfirm2">Back</button><button class="btn primary" id="doConfirm">${mode === "paper" ? "Confirm paper adjustment" : "Place live adjustment"}</button></div>`;
  $("#ovConfirm").classList.add("open"); const close = () => $("#ovConfirm").classList.remove("open"); $("#closeConfirm").onclick = close; $("#closeConfirm2").onclick = close;
  $("#doConfirm").onclick = () => { close(); confirmed = true; adjusting = false; setStep(6); leftTab = "paper"; toast(mode === "paper" ? `Adjustment added · ${d.length} leg${d.length === 1 ? "" : "s"} recorded at mark` : `Live orders placed · ${d.length} filled · strategy updated`); refresh(); setTimeout(openDetailsDone, 500); };
}
function openDetailsDone() {
  const d = draftLegs(); const a = analyse([...openLegs(), ...d]);
  $("#dlgDetails").innerHTML = `<div class="row"><h3>${S.name}</h3>${badge()}<span class="micro">3 original + ${d.length} adjustment leg${d.length === 1 ? "" : "s"}</span><button class="btn" style="margin-left:auto" id="closeDetails">✕</button></div>
  <div class="strip" style="margin-top:10px"><div class="tile"><div class="micro">Max loss now</div><div class="v ${a.maxLoss === -Infinity ? "neg" : ""}">${fmtInr(a.maxLoss)}</div><div class="d">after adjustment</div></div><div class="tile"><div class="micro">Max profit</div><div class="v pos">${fmtInr(a.maxProfit)}</div></div><div class="tile"><div class="micro">POP</div><div class="v">${Math.round(a.pop * 100)}%</div></div><div class="tile"><div class="micro">Legs</div><div class="v">${S.legs.length + d.length}</div><div class="d">all open</div></div></div>
  <div class="micro" style="margin:6px 0">Adjustments</div><table><tbody>${d.map((l) => `<tr><td><span class="side ${l.side}">${l.side.toUpperCase()}</span></td><td class="num">${l.strike.toLocaleString()} ${l.type} · 09 Sep</td><td class="num">${l.lots} lots</td><td class="num">entry ${l.mark} → now ${l.mark}</td><td class="r num">₹0.00</td><td><span class="pill" style="border-style:dashed">ADJUSTMENT</span></td></tr>`).join("")}</tbody></table>
  <div class="micro" style="margin:10px 0 6px">Original legs</div><table><tbody>${S.legs.map((l) => `<tr><td><span class="side ${l.side}">${l.side.toUpperCase()}</span></td><td class="num">${l.strike.toLocaleString()} ${l.type} · 09 Sep</td><td class="num">${l.lots} lots</td><td class="num">entry ${l.entry} → now ${l.mark}</td><td class="r num ${(l.side === "buy" ? 1 : -1) * (l.mark - l.entry) < 0 ? "neg" : "pos"}">${fmtInr((l.side === "buy" ? 1 : -1) * (l.mark - l.entry) * l.lots * LOT * INR)}</td><td></td></tr>`).join("")}</tbody></table>
  <div class="row" style="margin-top:12px"><span class="micro">Flow complete. Use ↺ restart to try the other approach or switch paper / live.</span><button class="btn" style="margin-left:auto" id="closeDetails2">Close</button></div>`;
  $("#ovDetails").classList.add("open"); const close = () => $("#ovDetails").classList.remove("open"); $("#closeDetails").onclick = close; $("#closeDetails2").onclick = close;
}
function cancelAdjust() { if (picks.length && !confirm(`Discard ${picks.length} proposed leg${picks.length === 1 ? "" : "s"}?`)) return; adjusting = false; picks = []; leftTab = "paper"; setStep(2); refresh(); toast("Adjustment cancelled · nothing was sent"); }
function refresh() { $("#builderCount").textContent = adjusting ? S.legs.length + picks.length : 2; renderLeft(); renderRight(); }

// ---------- wiring ----------
document.querySelectorAll("#left .tabs button[data-lt]").forEach((b) => (b.onclick = () => { if (adjusting && approach === "B") return toast("Finish or cancel the adjustment first"); leftTab = b.dataset.lt; refresh(); }));
document.querySelectorAll("#rtabs button[data-rt]").forEach((b) => (b.onclick = () => { rightTab = b.dataset.rt; renderRight(); }));
$("#apA").onclick = () => setApproach("A"); $("#apB").onclick = () => setApproach("B");
function setApproach(a) { approach = a; $("#apA").classList.toggle("on", a === "A"); $("#apB").classList.toggle("on", a === "B"); reset(); }
$("#modeBtn").onclick = () => { mode = mode === "paper" ? "live" : "paper"; S.status = mode; $("#modeBtn").textContent = mode === "paper" ? "○ paper" : "● live"; refresh(); };
$("#resetBtn").onclick = reset;
function reset() { adjusting = false; picks = []; confirmed = false; step = 1; leftTab = "paper"; rightTab = "payoff"; targetPct = 0; ["ovDetails", "ovPicker", "ovConfirm"].forEach((id) => $("#" + id).classList.remove("open")); setStep(1); refresh(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("#ovConfirm").classList.contains("open")) return $("#ovConfirm").classList.remove("open"); if ($("#ovPicker").classList.contains("open")) return $("#closePicker").click(); if ($("#ovDetails").classList.contains("open")) return $("#ovDetails").classList.remove("open"); if (adjusting) cancelAdjust(); } });
refresh();
</script>
