<!-- ===== /analyse workspace (v2 · Obsidian Desk): options chain + right analysis pane (payoff / scenarios / greeks / vol / structure / ladder) ===== -->
<section class="screen" data-route="/analyse" data-title="Analyse" data-auth="user">
  <div data-cg="app-header" data-variant="analyse"></div>
  <div data-cg="plan-banner"></div>
  <div class="an-shell" id="an-shell" data-mobile="chain" data-collapse="">
    <div class="an-mobile-bar"><div class="tabs"><button class="tab active" data-mobile-view="chain">Chain</button><button class="tab" data-mobile-view="analysis">Analysis</button></div></div>
    <div class="an-left" id="an-left">
      <div class="an-lptabs" role="tablist" id="an-lptabs">
        <button class="an-tab active" role="tab" data-lptab="chain" data-tour="options-chain">Chain</button>
        <button class="an-tab" role="tab" data-lptab="strategy" data-tour="builder-tab">Builder<b class="cnt" data-cnt="builder" hidden>0</b></button>
        <button class="an-tab" role="tab" data-lptab="paper" data-tour="paper-tab">Paper<b class="cnt" data-cnt="paper" hidden>0</b></button>
        <button class="an-tab" role="tab" data-lptab="live">Live<b class="cnt" data-cnt="live" hidden>0</b></button>
        <button class="an-tab" role="tab" data-lptab="journal">Journal<b class="cnt" data-cnt="journal" hidden>0</b></button>
        <span class="an-tabs-right"><span class="micro" id="an-lot-info">Lot 0.001 BTC</span><span class="micro an-dot">·</span><span class="micro" id="an-basis-info">Basis mark</span><button class="an-ibtn" data-collapse="right" title="Expand chain · hide the analysis pane" aria-label="Expand chain"><i data-icon="chevr"></i></button></span>
      </div>
      <div id="analyse-left-panels" class="an-left-panels">
        <div class="lp-panel an-chain-panel" data-tab="chain">
          <div class="an-expiry-strip">
            <button class="an-scroll-btn" data-exp-scroll="-1" title="Previous expiries" aria-label="Previous">‹</button>
            <div class="an-expiries" id="an-expiries"></div>
            <button class="an-scroll-btn" data-exp-scroll="1" title="Next expiries" aria-label="Next">›</button>
          </div>
          <div class="an-chain-tools">
            <span class="micro">Strikes</span>
            <div class="an-seg" id="an-range" role="group" aria-label="Strike range"><button data-range="6">±6</button><button data-range="12">±12</button><button data-range="all">all</button></div>
            <button class="an-chip" id="an-greeks-toggle" title="Show Γ Θ ν columns (toggle)"><i data-icon="sigma"></i>Greeks</button>
            <span class="micro an-tools-sep">Find Δ</span>
            <div class="an-seg" id="an-finddelta" role="group" aria-label="Find strike by delta"><button data-delta="10">10Δ</button><button data-delta="16">16Δ</button><button data-delta="25">25Δ</button><button data-delta="50">50Δ</button></div>
            <span class="flex-1"></span>
            <button class="an-live-btn live" id="an-live-btn" title="Live prices"><i class="dot"></i><span>Live</span></button>
            <button class="an-ibtn" id="an-colsettings-btn" title="Column settings" aria-label="Column settings"><i data-icon="gear"></i></button>
          </div>
          <div class="an-chain-wrap" id="an-chain-wrap" tabindex="0" aria-label="Options chain (j / k or arrows move the highlighted strike, B / S add legs, Shift for puts, E cycles expiry)">
            <table class="an-chain" id="an-chain"><colgroup></colgroup><thead></thead><tbody></tbody></table>
          </div>
          <div class="an-chain-foot" id="an-chain-foot"></div>
        </div>
      </div>
    </div>
    <div class="an-divider" id="an-divider" title="Drag to resize · double-click to reset"><button class="an-restore" data-collapse="restore" title="Restore both panes" aria-label="Restore both panes">⋮</button></div>
    <div class="an-right" id="an-right" data-tour="payoff-panel">
      <div class="an-rptabs" role="tablist" id="an-rptabs">
        <button class="an-tab active" role="tab" data-rptab="payoff">Payoff</button>
        <button class="an-tab" role="tab" data-rptab="scenarios">Scenarios</button>
        <button class="an-tab" role="tab" data-rptab="greeks">Greeks</button>
        <button class="an-tab" role="tab" data-rptab="vol">Vol</button>
        <button class="an-tab" role="tab" data-rptab="structure">Structure</button>
        <button class="an-tab" role="tab" data-rptab="ladder">Ladder</button>
        <span class="an-tabs-right"><span class="micro" id="an-strat-info"></span><button class="an-ibtn" id="an-share-btn" title="Share strategy link" aria-label="Share strategy link"><i data-icon="share"></i></button><button class="an-ibtn" data-collapse="left" title="Expand analysis · hide the chain" aria-label="Expand analysis"><i data-icon="chevl"></i></button></span>
      </div>
      <div class="an-right-body" id="an-right-body">
        <div class="rp-panel" data-tab="payoff" id="an-payoff">
          <div class="an-tiles" id="an-tiles"></div>
          <div class="an-astrip" id="an-astrip"></div>
          <div class="an-chart-hd">
            <span class="micro">Payoff</span>
            <div class="an-legend" id="an-legend">
              <button class="lg" data-layer="expiry" title="Toggle the at-expiry P&amp;L line"><i></i>At expiry</button>
              <button class="lg" data-layer="target" title="Toggle the target-date P&amp;L curve"><i class="curve"></i>On <span id="an-legend-date">today</span></button>
            </div>
            <div class="an-chips" id="an-chips">
              <span class="micro">Layers</span>
              <button class="an-chip" data-layer="oi" title="Open interest bars">OI</button>
              <button class="an-chip" data-layer="sd" title="±1σ expected-move band">±SD</button>
              <button class="an-chip" data-layer="be" title="Breakeven markers">BE</button>
              <button class="an-chip" data-layer="ivdn" title="Target-date curve with IV shifted −5%">IV −5%</button>
              <button class="an-chip" data-layer="ivup" title="Target-date curve with IV shifted +5%">IV +5%</button>
              <button class="an-ibtn" id="an-layers-btn" title="All chart layers" aria-label="Chart layers"><i data-icon="layers"></i></button>
              <div class="an-zoom"><button data-zoom="out" title="Zoom out" aria-label="Zoom out">−</button><button data-zoom="reset" title="Reset zoom" id="an-zoom-label">100%</button><button data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button></div>
            </div>
          </div>
          <div class="an-chart-host" id="an-chart-host"></div>
          <div class="an-sliders">
            <div class="sl">
              <div class="lbl"><span class="micro" id="an-tp-title">Target price</span><span class="val"><button class="an-step" data-tp="-1" title="Decrease target price" aria-label="Decrease">−</button><span id="an-tp-val">—</span><em id="an-tp-pct">+0.0%</em><button class="an-step" data-tp="1" title="Increase target price" aria-label="Increase">+</button></span></div>
              <div class="track" id="an-tp-track"><div class="fill" id="an-tp-fill"></div><div class="mk" id="an-tp-spot" data-l="spot"></div><div class="knob" id="an-tp-knob"></div><div class="ticks" id="an-tp-ticks"><span id="an-tp-min">—</span><span id="an-tp-max">—</span></div><input type="range" id="an-tp-range" min="0" max="100" step="1" value="50" aria-label="Target price"></div>
            </div>
            <div class="sl">
              <div class="lbl"><span class="micro" id="an-td-title">Target date</span><span class="val"><button class="an-step" data-td="-1" title="Previous day" aria-label="Previous day">‹</button><span id="an-td-val">—</span><em id="an-td-left">0d left</em><button class="an-step" data-td="1" title="Next day" aria-label="Next day">›</button></span></div>
              <div class="track" id="an-td-track"><div class="fill" id="an-td-fill"></div><div class="knob" id="an-td-knob"></div><div class="ticks" id="an-td-ticks"><span>Today</span><span id="an-td-max">Expiry</span></div><input type="range" id="an-td-range" min="0" max="30" step="1" value="0" aria-label="Target date"></div>
            </div>
          </div>
          <div class="an-gstrip" id="an-greeks-strip"></div>
        </div>
        <div class="rp-panel" data-tab="scenarios" id="an-scenarios" hidden></div>
        <div class="rp-panel" data-tab="greeks" id="an-greeks" hidden></div>
        <div class="rp-panel" data-tab="vol" id="an-vol" hidden></div>
        <div class="rp-panel" data-tab="structure" id="an-structure" hidden></div>
        <div class="rp-panel" data-tab="ladder" id="an-ladder" hidden></div>
      </div>
    </div>
  </div>
  <div data-cg="portfolio-bar"></div>
  <!-- Column Settings dialog -->
  <div id="an-colsettings" hidden>
    <div class="an-cs">
      <div class="an-cs-head">
        <div class="tabs"><button class="tab active" data-cstab="show">Show / Hide</button><button class="tab" data-cstab="reorder">Reorder</button></div>
        <div class="an-cs-quick"><button class="btn btn-outline btn-xs" data-csq="essentials">Essentials</button><button class="btn btn-outline btn-xs" data-csq="all">Show All</button><button class="btn btn-outline btn-xs" data-csq="none">Hide all</button><button class="btn btn-ghost btn-xs" data-csq="reset">Reset</button></div>
      </div>
      <div class="an-cs-body" data-cspanel="show" id="an-cs-show"></div>
      <div class="an-cs-body" data-cspanel="reorder" id="an-cs-reorder" hidden></div>
      <div class="an-cs-foot"><span class="text-xs text-muted" id="an-cs-hint">Changes are saved automatically.</span><button class="btn btn-primary btn-sm" data-cg-close>Done</button></div>
    </div>
  </div>
  <!-- Option details dialog (info icon in the hover controls) -->
  <div id="an-optinfo" hidden></div>
  <!-- Share link dialog -->
  <div id="an-share" hidden></div>
  <!-- Find strike by delta dialog (palette command) -->
  <div id="an-finddelta-dlg" hidden></div>
</section>
<!-- Shared strategy link: #/s/<base64url json> -->
<section class="screen" data-route="/s/:code" data-title="Shared strategy">
  <div class="an-share-page" id="an-share-page"></div>
</section>
<style>
/* ================= /analyse workspace · v2 "Obsidian Desk" ================= */
[data-route="/analyse"]{--an-top:50px;--an-bottom:44px;--an-split:55%;--an-row:36px;--an-itm:hsl(var(--foreground)/.04);--an-oi:hsl(var(--foreground)/.28);--an-hl:hsl(var(--foreground)/.05);padding-bottom:var(--an-bottom)}
[data-route="/analyse"] .an-shell{display:flex;height:calc(100vh - var(--an-top) - var(--an-bottom));min-height:480px;background:hsl(var(--background));overflow:hidden;position:relative}
[data-route="/analyse"] .an-left{width:var(--an-split);min-width:360px;display:flex;flex-direction:column;background:hsl(var(--surface-1));border-right:1px solid hsl(var(--border));min-height:0}
[data-route="/analyse"] .an-right{flex:1;min-width:360px;display:flex;flex-direction:column;min-height:0;background:hsl(var(--background))}
[data-route="/analyse"] .an-shell[data-collapse="left"] .an-left{display:none}
[data-route="/analyse"] .an-shell[data-collapse="right"] .an-right{display:none}
[data-route="/analyse"] .an-shell[data-collapse="left"] .an-right,[data-route="/analyse"] .an-shell[data-collapse="right"] .an-left{width:100%;border-right:0}
[data-route="/analyse"] .an-divider{width:7px;cursor:col-resize;background:transparent;position:relative;flex-shrink:0;margin-left:-4px;z-index:4}
[data-route="/analyse"] .an-divider::after{content:"";position:absolute;left:2px;top:50%;width:3px;height:28px;margin-top:-14px;border-radius:2px;background:hsl(var(--border))}
[data-route="/analyse"] .an-divider:hover::after,[data-route="/analyse"] .an-divider.on::after{background:hsl(var(--primary))}
[data-route="/analyse"] .an-divider .an-restore{display:none;position:absolute;left:0;top:8px;width:16px;height:26px;background:hsl(var(--surface-3));border:1px solid hsl(var(--input));border-radius:0 4px 4px 0;color:hsl(var(--muted-foreground));font-size:11px;line-height:1;z-index:5}
[data-route="/analyse"] .an-shell[data-collapse="left"] .an-divider,[data-route="/analyse"] .an-shell[data-collapse="right"] .an-divider{cursor:default;margin-left:0;width:0}
[data-route="/analyse"] .an-shell[data-collapse="left"] .an-divider::after,[data-route="/analyse"] .an-shell[data-collapse="right"] .an-divider::after{display:none}
[data-route="/analyse"] .an-shell[data-collapse="left"] .an-restore,[data-route="/analyse"] .an-shell[data-collapse="right"] .an-restore{display:grid;place-items:center}
[data-route="/analyse"] .an-shell[data-collapse="right"] .an-restore{left:auto;right:0;border-radius:4px 0 0 4px}
[data-route="/analyse"] .an-mobile-bar{display:none;padding:6px 12px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--surface-1))}
/* ---- tab bars ---- */
[data-route="/analyse"] .an-lptabs,[data-route="/analyse"] .an-rptabs{display:flex;align-items:stretch;height:36px;padding:0 14px;border-bottom:1px solid hsl(var(--border));flex-shrink:0;background:hsl(var(--surface-1));overflow:visible}
[data-route="/analyse"] .an-rptabs{background:hsl(var(--background))}
[data-route="/analyse"] .an-tab{display:inline-flex;align-items:center;gap:6px;padding:0 11px;font-size:12.5px;font-weight:500;color:hsl(var(--muted-foreground));border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;letter-spacing:.01em}
[data-route="/analyse"] .an-tab:first-child{padding-left:0}
[data-route="/analyse"] .an-tab:hover{color:hsl(var(--foreground))}
[data-route="/analyse"] .an-tab.active{color:hsl(var(--foreground));border-bottom-color:hsl(var(--primary))}
[data-route="/analyse"] .an-tab .cnt{font-family:var(--font-mono);font-weight:400;font-size:10px;color:hsl(var(--muted-foreground));background:hsl(var(--surface-3));padding:0 5px;line-height:15px;border-radius:2px}
[data-route="/analyse"] .an-tab.active .cnt{color:hsl(var(--foreground))}
[data-route="/analyse"] .an-tabs-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
[data-route="/analyse"] .an-tabs-right .micro{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-route="/analyse"] .an-ibtn{width:26px;height:26px;display:inline-grid;place-items:center;color:hsl(var(--muted-foreground));border:1px solid transparent;border-radius:4px;flex-shrink:0}
[data-route="/analyse"] .an-ibtn:hover{border-color:hsl(var(--input));color:hsl(var(--foreground))}
[data-route="/analyse"] .an-ibtn.on{color:hsl(var(--foreground));background:hsl(var(--surface-3));border-color:hsl(var(--input))}
[data-route="/analyse"] i[data-icon]{display:inline-flex;width:14px;height:14px;flex-shrink:0}
[data-route="/analyse"] i[data-icon] svg{width:100%;height:100%}
[data-route="/analyse"] .an-left-panels{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
[data-route="/analyse"] .lp-panel{flex:1;min-height:0;display:flex;flex-direction:column}
[data-route="/analyse"] .lp-panel[hidden]{display:none!important}
[data-route="/analyse"] .an-placeholder{align-items:center;justify-content:center;color:hsl(var(--muted-foreground));font-size:12.5px}
/* ---- expiry strip ---- */
[data-route="/analyse"] .an-expiry-strip{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid hsl(var(--border));flex-shrink:0}
[data-route="/analyse"] .an-expiries{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;scroll-behavior:smooth}
[data-route="/analyse"] .an-expiries::-webkit-scrollbar{display:none}
[data-route="/analyse"] .an-exp{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px;flex:1 0 auto;min-width:58px;border:1px solid transparent;border-radius:3px;white-space:nowrap}
[data-route="/analyse"] .an-exp b{font-family:var(--font-mono);font-weight:500;font-size:11.5px;color:hsl(var(--muted-foreground));letter-spacing:-.01em;line-height:1.1}
[data-route="/analyse"] .an-exp em{font-style:normal;font-size:9.5px;color:hsl(var(--muted-foreground));font-family:var(--font-mono);line-height:1.1;opacity:.85}
[data-route="/analyse"] .an-exp:hover{background:hsl(var(--surface-3)/.6)}
[data-route="/analyse"] .an-exp.active{background:hsl(var(--surface-3));border-color:hsl(var(--input))}
[data-route="/analyse"] .an-exp.active b{color:hsl(var(--foreground))}
[data-route="/analyse"] .an-exp.has-leg b::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:hsl(var(--primary));margin-left:4px;vertical-align:middle}
[data-route="/analyse"] .an-scroll-btn{width:18px;height:30px;font-size:15px;color:hsl(var(--muted-foreground));border-radius:3px;flex-shrink:0;display:none}
[data-route="/analyse"] .an-expiry-strip.overflow .an-scroll-btn{display:block}
[data-route="/analyse"] .an-scroll-btn:hover{background:hsl(var(--surface-3));color:hsl(var(--foreground))}
/* ---- chain toolbar ---- */
[data-route="/analyse"] .an-chain-tools{display:flex;align-items:center;gap:8px;padding:0 14px;height:34px;border-bottom:1px solid hsl(var(--border));flex-shrink:0;overflow:hidden}
[data-route="/analyse"] .an-tools-sep{margin-left:6px}
[data-route="/analyse"] .an-seg{display:inline-flex;border:1px solid hsl(var(--input));border-radius:3px;height:22px;overflow:hidden;flex-shrink:0}
[data-route="/analyse"] .an-seg button{padding:0 8px;font-family:var(--font-mono);font-size:10.5px;color:hsl(var(--muted-foreground));border-right:1px solid hsl(var(--input));letter-spacing:.02em;line-height:1}
[data-route="/analyse"] .an-seg button:last-child{border-right:0}
[data-route="/analyse"] .an-seg button:hover{color:hsl(var(--foreground));background:hsl(var(--surface-3)/.6)}
[data-route="/analyse"] .an-seg button.on{background:hsl(var(--foreground));color:hsl(var(--background))}
[data-route="/analyse"] .an-chip{height:22px;padding:0 8px;font-size:10.5px;font-weight:500;letter-spacing:.04em;border:1px solid hsl(var(--input));color:hsl(var(--muted-foreground));display:inline-flex;align-items:center;gap:5px;border-radius:3px;white-space:nowrap;flex-shrink:0;font-family:var(--font-mono)}
[data-route="/analyse"] .an-chip::before{content:"";width:6px;height:6px;border:1px solid currentColor;border-radius:1px;flex-shrink:0}
[data-route="/analyse"] .an-chip:hover{color:hsl(var(--foreground))}
[data-route="/analyse"] .an-chip.on{color:hsl(var(--foreground));border-color:hsl(var(--muted-foreground));background:hsl(var(--surface-3)/.5)}
[data-route="/analyse"] .an-chip.on::before{background:currentColor}
[data-route="/analyse"] .an-chip i[data-icon]{width:11px;height:11px}
[data-route="/analyse"] .an-live-btn{height:22px;padding:0 8px;border-radius:3px;border:1px solid hsl(var(--profit)/.5);background:hsl(var(--buy-bg));color:hsl(var(--profit));font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;font-family:var(--font-mono)}
[data-route="/analyse"] .an-live-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px hsl(var(--profit)/.18)}
[data-route="/analyse"] .an-live-btn.static{border-color:hsl(var(--input));background:transparent;color:hsl(var(--muted-foreground))}
[data-route="/analyse"] .an-live-btn.static .dot{box-shadow:none}
[data-route="/analyse"] .an-live-btn.connecting{border-color:hsl(var(--warning)/.6);background:hsl(var(--warning-bg));color:hsl(var(--warning))}
[data-route="/analyse"] .an-live-btn.connecting .dot{animation:cg-spin 1s linear infinite;border-radius:1px}
/* ---- chain table ---- */
[data-route="/analyse"] .an-chain-wrap{flex:1;min-height:0;overflow:auto;position:relative;outline:none;scrollbar-width:thin;scrollbar-color:hsl(var(--input)) transparent;padding:0 14px}
[data-route="/analyse"] .an-chain-wrap:focus-visible{box-shadow:inset 0 0 0 1px hsl(var(--ring)/.5)}
[data-route="/analyse"] .an-chain{border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:100%}
[data-route="/analyse"] .an-chain th,[data-route="/analyse"] .an-chain td{padding:0 5px;white-space:nowrap;vertical-align:middle;text-align:right}
[data-route="/analyse"] .an-chain td.p-side,[data-route="/analyse"] .an-chain th.p-side{text-align:left}
[data-route="/analyse"] .an-chain td.strike,[data-route="/analyse"] .an-chain th.strike{text-align:center}
[data-route="/analyse"] .an-chain thead th{position:sticky;top:0;z-index:6;background:hsl(var(--surface-1));font-weight:500}
[data-route="/analyse"] .an-chain thead tr.h1 th{height:24px;border-bottom:1px solid hsl(var(--border));font-family:var(--font-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:hsl(var(--foreground))}
[data-route="/analyse"] .an-chain thead tr.h1 th .h{font-family:var(--font-mono);font-size:9.5px;color:hsl(var(--muted-foreground));letter-spacing:.04em;text-transform:none;font-weight:400;margin:0 8px}
[data-route="/analyse"] .an-chain thead tr.h1 th.strike{font-family:var(--font-mono);font-size:9.5px;color:hsl(var(--muted-foreground));text-transform:none;font-weight:500;letter-spacing:.04em}
[data-route="/analyse"] .an-chain thead tr.h2 th{top:24px;height:26px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--muted-foreground));border-bottom:1px solid hsl(var(--input))}
[data-route="/analyse"] .an-chain thead tr.h2 th em{font-style:normal;color:hsl(var(--muted-foreground));opacity:.6;letter-spacing:.04em}
[data-route="/analyse"] .an-chain tbody td{height:var(--an-row);border-bottom:1px solid hsl(var(--border));position:relative;line-height:1.1}
[data-route="/analyse"][data-density="compact"]{--an-row:28px}
[data-route="/analyse"] .an-chain tbody tr:hover td{background:hsl(var(--surface-3))}

        if (act === 'LOTMENU') { const m = CG.menu(b, '<div class="menu-label">Lots (× ' + M.lotSize() + ' ' + AN.asset + ')</div>' + M.LOTS.map((n) => '<button class="menu-item mono" data-lots="' + n + '">' + n + (n === M.curLots() ? ' ✓' : '') + '</button>').join(''), { align: 'left' }); m.addEventListener('click', (ev) => { const x = ev.target.closest('[data-lots]'); if (x) M.setLots(+x.dataset.lots); }); return; }
        M.addLeg(type, act, strike, M.curLots());
      });
      let raf = null; els.wrap.addEventListener('scroll', () => { if (raf) return; raf = requestAnimationFrame(() => { raf = null; M.updateVis(); }); });
      els.wrap.addEventListener('mouseover', (e) => { const tr = e.target.closest('tr[data-strike]'); if (tr && M.hl.get() != null && +tr.dataset.strike !== M.hl.get()) M.setHl(+tr.dataset.strike); });
      M.registerShortcuts();
      M.bindPayoff(); bindScenarios(); bindLadder();
      els.rightBody.addEventListener('click', (e) => { const r = e.target.closest('rect[data-exp]'); if (r) M.setExpiry(r.dataset.exp); });
      // ---------- shared events ----------
      CG.on('asset', (a) => { if (!a || !CG.ASSETS[a]) return; if (AN.asset === a) return; AN.asset = a; st.asset = a; AN.targetPrice = null; M.hl.set(null); if (M.isActive()) { M.renderExpiries(); M.renderChain(); M.renderRight(); M.emitStats(); } });
      CG.on('tick', () => { if (!M.isActive()) return; if (AN.mode === 'live') M.updateChain(); M.renderRight(); M.emitStats(); });
      CG.on('currency-settings-changed', () => { if (!M.isActive()) return; M.renderChain(true); M.renderRight(); });
      CG.on('lot-sizes-changed', () => { if (!M.isActive()) return; M.renderChain(true); M.renderRight(); });
      CG.on('pnl-basis-changed', () => { if (M.isActive()) { M.renderChain(true); M.renderRight(); } });
      CG.on('analyse:legs-changed', () => { if (AN.asset && CG.ASSETS[AN.asset] && AN.expiry && CG.EXPIRIES.includes(AN.expiry)) { const ch = M.chain(); if (ch && (ch.asset !== AN.asset || ch.expiry !== AN.expiry)) { st.asset = AN.asset; st.expiry = AN.expiry; if (M.isActive()) M.renderChain(); } } if (!M.isActive()) return; M.renderPills(); M.renderExpiries(); M.renderCounts(); M.renderRight(); });
      CG.on('analyse:strategies-changed', () => { if (M.isActive()) M.renderCounts(); });
      CG.on('analyse:set-tab', (name) => M.setLeftTab(name));
      CG.on('density', (v) => { if (v) st.density = v; M.applyDensity(); if (M.isActive()) { M.updateVis(); if ((st.analyseRightTab || 'payoff') === 'ladder') M.renderLadder(); } });
      CG.on('theme', () => { if (M.isActive()) setTimeout(M.renderRight, 30); });
      CG.on('route', tryPalette);
      window.addEventListener('cg-tour-set-tab', (e) => { if (e && e.detail) M.setLeftTab(typeof e.detail === 'string' ? e.detail : e.detail.tab); });
      let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (M.isActive()) { M.measureTop(); M.renderExpiries(); M.renderRight(); } }, 120); });
      if (window.ResizeObserver) ['[data-cg="app-header"]', '[data-cg="plan-banner"]', '[data-cg="portfolio-bar"]'].forEach((s) => { const el = root.querySelector(s); if (el) new ResizeObserver(() => M.measureTop()).observe(el); });
      tryPalette();
    },
    show(root, params, query) {
      if (CG.ASSETS[st.asset] && st.asset !== AN.asset) { AN.asset = st.asset; AN.targetPrice = null; }
      if (CG.EXPIRIES.includes(st.expiry) && st.expiry !== AN.expiry) AN.expiry = st.expiry;
      M.measureTop(); M.applyDensity(); M.renderExpiries(); M.renderChain(); M.renderCounts();
      M.setLeftTab((query && query.tab) || st.analyseTab || 'chain', true);
      M.setRightTab((query && query.panel) || st.analyseRightTab || 'payoff');
      M.emitStats(); tryPalette();
      setTimeout(() => { M.measureTop(); M.scrollToAtm(); M.renderExpiries(); }, 30);
    }
  });
})();
</script>
