<script>
/* Fallback /analyse screen: only created when the workspace part is absent at script time, removed again at DOMContentLoaded if a real one appears later. */
(function () {
  if (document.querySelector('section.screen[data-route="/analyse"]')) return;
  var sec = document.createElement('section');
  sec.className = 'screen'; sec.setAttribute('data-route', '/analyse'); sec.setAttribute('data-title', 'Analyse'); sec.setAttribute('data-auth', 'user'); sec.setAttribute('data-trd-fallback', '1');
  sec.innerHTML = '<div data-cg="app-header"></div><div class="trd-fallback"><div class="trd-fallback-note micro">Fallback /analyse shell (workspace part not present) · left-pane trading panels only</div><div class="tabs-line trd-fallback-tabs"><button class="tab" data-trd-tab="chain">Options Chain</button><button class="tab active" data-trd-tab="strategy">Strategy</button><button class="tab" data-trd-tab="paper">Paper Trades</button><button class="tab" data-trd-tab="live">Live Trades</button><button class="tab" data-trd-tab="journal">Journal</button></div><div id="analyse-left-panels"><div class="lp-panel" data-tab="chain" hidden><div class="empty"><b>Options Chain</b>The options chain panel is rendered by the workspace part.</div></div></div></div>';
  document.currentScript.insertAdjacentElement('beforebegin', sec);
  document.addEventListener('DOMContentLoaded', function () { if (document.querySelectorAll('section.screen[data-route="/analyse"]').length > 1) sec.remove(); });
})();
</script>
<style>
/* ---- area 21 v2: trading panels & dialogs (every class prefixed trd-; tokens only, hairlines, no shadows) ---- */
.trd-panel[hidden],.trd-sub[hidden],.trd-fallback .lp-panel[hidden]{display:none!important}
.trd-panel{padding:0 0 18px;font-size:12.5px;overflow:auto;display:block}
.trd-fallback{max-width:880px;margin:0 auto;padding:12px 16px 40px}
.trd-fallback-note{padding:6px 0}
.trd-fallback-tabs{margin-bottom:8px}
.trd-fallback .lp-panel{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:6px;min-height:320px}
.trd-subtabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid hsl(var(--border));padding:0 12px}
.trd-subtabs .tab{padding:8px 10px;font-size:12.5px;font-weight:500;color:hsl(var(--muted-foreground));border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.trd-subtabs .tab:hover{color:hsl(var(--foreground))}
.trd-subtabs .tab.active{color:hsl(var(--foreground));border-bottom-color:hsl(var(--primary))}
.trd-sub-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.trd-tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));font-weight:500;white-space:nowrap;border-radius:3px;line-height:1.2;display:inline-flex;align-items:center;gap:4px}
.trd-x{width:22px;height:22px;border-radius:3px;display:inline-grid;place-items:center;color:hsl(var(--muted-foreground));font-size:13px;line-height:1}
.trd-x:hover{background:hsl(var(--sell-bg));color:hsl(var(--loss))}
.trd-x.warn:hover{background:hsl(var(--warning-bg));color:hsl(var(--warning))}
.trd-icon-btn{width:26px;height:26px;border-radius:4px;display:inline-grid;place-items:center;color:hsl(var(--muted-foreground))}
.trd-icon-btn:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.trd-icon-btn.danger:hover{color:hsl(var(--loss));background:hsl(var(--sell-bg))}
.trd-btn-warn{border-color:hsl(var(--warning)/.55);color:hsl(var(--warning))}.trd-btn-warn:hover:not(:disabled){background:hsl(var(--warning-bg))}
.trd-btn-danger-o{border-color:hsl(var(--loss)/.5);color:hsl(var(--loss))}.trd-btn-danger-o:hover:not(:disabled){background:hsl(var(--sell-bg))}
/* pills / badges */
.trd-side{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:20px;padding:0 7px;border-radius:3px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.08em;border:1px solid transparent;cursor:default;line-height:1}
button.trd-side{cursor:pointer}
.trd-side.buy{color:hsl(var(--buy));border-color:hsl(var(--buy)/.45);background:hsl(var(--buy-bg))}
.trd-side.sell{color:hsl(var(--sell));border-color:hsl(var(--sell)/.45);background:hsl(var(--sell-bg))}

.trd-type{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:3px;font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.08em;border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground))}
.trd-type.call{color:hsl(var(--buy));border-color:hsl(var(--buy)/.4)}.trd-type.put{color:hsl(var(--sell));border-color:hsl(var(--sell)/.4)}
.trd-mode-pill{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:999px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;border:1px solid hsl(var(--muted-foreground)/.55);color:hsl(var(--muted-foreground));white-space:nowrap;line-height:1}
.trd-mode-pill i{width:5px;height:5px;border-radius:50%;display:inline-block}
.trd-mode-pill.paper{color:hsl(var(--foreground));border-color:hsl(var(--foreground)/.5)}
.trd-mode-pill.paper i{border:1px solid currentColor}
.trd-mode-pill.live{background:hsl(var(--profit));color:hsl(var(--background));border-color:hsl(var(--profit))}
.trd-mode-pill.live i{background:currentColor;animation:trd-pulse 1.6s ease-in-out infinite}
.trd-mode-pill.arch{border-style:dashed}

.trd-pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;font-family:var(--font-mono);font-weight:500;font-size:12px;white-space:nowrap}
.trd-pill.up{background:hsl(var(--buy-bg));color:hsl(var(--profit))}.trd-pill.down{background:hsl(var(--sell-bg));color:hsl(var(--loss))}
.trd-live-dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--profit));display:inline-block;box-shadow:0 0 0 3px hsl(var(--profit)/.18)}
/* ===== builder ===== */
.trd-b{padding:10px 12px 12px}

.trd-basket{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:hsl(var(--muted-foreground));cursor:pointer;user-select:none;font-family:var(--font-mono);letter-spacing:.04em}
.trd-basket .switch{width:28px;height:16px}.trd-basket .switch::after{width:10px;height:10px}.trd-basket .switch.on::after{transform:translateX(12px)}
.trd-legs-wrap{overflow-x:auto}
.trd-legs{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px}
.trd-legs th{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--muted-foreground));font-weight:500;height:24px;text-align:right;padding:0 6px;border-top:1px solid hsl(var(--border));border-bottom:1px solid hsl(var(--border));white-space:nowrap}
.trd-legs th.l,.trd-legs td.l{text-align:left}
.trd-legs td{height:36px;padding:0 6px;text-align:right;border-bottom:1px solid hsl(var(--border));white-space:nowrap;vertical-align:middle}
.trd-compact .trd-legs td{height:28px}
.trd-legs tr.closed td{opacity:.55}
.trd-legs tr:hover td{background:hsl(var(--muted)/.5)}
.trd-ins b{display:block;font-weight:500;color:hsl(var(--foreground));font-size:12px;line-height:1.2}
.trd-ins small{display:block;font-size:9.5px;color:hsl(var(--muted-foreground));letter-spacing:.05em;line-height:1.2;margin-top:2px;text-transform:uppercase}
.trd-compact .trd-ins small{display:none}
.trd-step{display:inline-flex;align-items:center;border:1px solid hsl(var(--input));border-radius:4px;height:24px;overflow:hidden;vertical-align:middle}
.trd-step button{width:20px;height:100%;display:grid;place-items:center;color:hsl(var(--muted-foreground));font-size:13px;line-height:1}
.trd-step button:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}

.trd-step input{width:38px;height:100%;border:0;border-left:1px solid hsl(var(--input));border-right:1px solid hsl(var(--input));background:transparent;text-align:center;font-family:var(--font-mono);font-size:12px;padding:0;outline:none;-moz-appearance:textfield;color:hsl(var(--foreground))}

.trd-step input:disabled{opacity:.5}
.trd-compact .trd-step{height:20px}
.trd-price{display:inline-block;padding:2px 4px;border-radius:3px}
.trd-price-in{width:86px;height:24px;padding:0 6px;text-align:right;font-family:var(--font-mono);font-size:12px;border-color:hsl(var(--warning)/.6);display:inline-block}
.trd-add-row{display:flex;gap:6px;padding:8px 0 0;flex-wrap:wrap;align-items:center}

.trd-ticket{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid hsl(var(--border));border-radius:5px;margin-top:10px;overflow:hidden;background:hsl(var(--surface-1))}

.trd-ticket>div:nth-last-child(-n+3){border-bottom:0}

.trd-ticket .s{font-family:var(--font-mono);font-size:10px;color:hsl(var(--muted-foreground));margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trd-b-actions{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.trd-b-actions .trd-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.trd-b-actions .btn kbd{font-family:var(--font-mono);font-size:9.5px;padding:0 4px;border:1px solid hsl(var(--primary-foreground)/.4);border-radius:2px;line-height:1.4;margin-left:2px}

.trd-empty b{display:block;font-size:14.5px;font-family:var(--font-display)}
.trd-empty p{color:hsl(var(--muted-foreground));font-size:12px;margin-top:3px}

.trd-t{padding:10px 12px 14px}

.trd-tpl-svg{width:100%;height:40px;display:block}
.trd-tpl-name{font-size:11px;font-weight:600;line-height:1.2;font-family:var(--font-display)}
.trd-tpl-meta{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:hsl(var(--muted-foreground));gap:4px}

.trd-tpl-cat{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.trd-my{margin-top:16px;border-top:1px solid hsl(var(--border));padding-top:10px}
.trd-my-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}

.trd-my-tabs{display:flex;gap:2px;border-bottom:1px solid hsl(var(--border))}

.trd-toolbar .select{width:auto;min-width:96px}
.trd-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid hsl(var(--border))}
.trd-strip>div{padding:8px 12px 7px;border-right:1px solid hsl(var(--border));min-width:0}
.trd-strip>div:last-child{border-right:0}
.trd-strip .v{font-family:var(--font-mono);font-size:16px;font-weight:500;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.15}
.trd-strip .s{font-family:var(--font-mono);font-size:10px;color:hsl(var(--muted-foreground));margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trd-body{padding:10px 12px}
.trd-list{display:flex;flex-direction:column;gap:6px}
.trd-card{border:1px solid hsl(var(--border));border-radius:5px;background:hsl(var(--surface-1));padding:9px 12px 8px}

.trd-card-meta{display:flex;gap:10px;margin-top:4px;font-family:var(--font-mono);font-size:10.5px;color:hsl(var(--muted-foreground));flex-wrap:wrap}

.trd-card-pnl{margin-left:auto;text-align:right;white-space:nowrap;flex-shrink:0}

.trd-card-mid{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.trd-spark{width:150px;height:28px;display:block;flex-shrink:0}

.trd-card-actions .trd-right{margin-left:auto;display:flex;gap:5px}
.trd-orders{display:flex;gap:4px;flex-wrap:wrap}

      put('[data-total]', smoney(sum('pnl')), pnlClass(sum('pnl'))); put('[data-day]', smoney(sum('dayPnl')), pnlClass(sum('dayPnl'))); put('[data-delta]', F.signed(sum('delta'), 4)); put('[data-margin]', money(sum('margin')));
    });
  }
  CG.register('/analyse:trading', {
    init(root) {
      S.root = root; seedLive(); M.strategies.forEach(recalc); placePanels(root);
      S.els.builder = document.getElementById('trd-builder'); S.els.templates = document.getElementById('trd-templates'); S.els.paper = document.getElementById('trd-paper'); S.els.live = document.getElementById('trd-live'); S.els.journal = document.getElementById('trd-journal');
      bindBuilder(); bindTemplates(); bindPaper(); bindLive(); bindJournal();
      CG.delegate(S.panels.strategy, 'click', '[data-trd-subtab]', (e, t) => T.setSubTab(t.dataset.trdSubtab));
      if (root.hasAttribute('data-trd-fallback')) { CG.delegate(root, 'click', '[data-trd-tab]', (e, t) => CG.emit('analyse:set-tab', t.dataset.trdTab)); }
      CG.on('analyse:set-tab', (name) => { if (S.selfManaged) { moveOrToggle(name); CG.emit('analyse:tab', name); } });
      CG.on('analyse:tab', (name) => { if (name === 'paper') renderPaper(); else if (name === 'live') renderLive(); else if (name === 'journal') renderJournal(); else if (name === 'strategy') { if (S.subTab === 'templates') renderTemplates(); else renderBuilder(); } });
      /* chain → builder: the workspace toasts 'Leg Added' itself and falls back to pushing the leg when nobody emits legs-changed, so add silently and always emit */
      CG.on('analyse:addLeg', (leg) => { if (!leg) return; const added = T.addLeg(leg, { silent: true }); if (!added) CG.emit('analyse:legs-changed', AN.legs); });
      /* target price / date from the payoff sliders → ticket "P&L at target" */
      CG.on('analyse:target', () => renderTicket());
      /* density from the chrome part */
      CG.on('density', applyDensity); applyDensity(ST.density);
      CG.on('tick', () => { tickBuilder(); M.strategies.forEach((s) => { if (s.status === 'PAPER' || s.status === 'LIVE') recalc(s); }); const pf = portfolioChanged(); tickPanels(pf); evalLocalAlerts(); });
      /* asset switch: the workspace part may already have set CG.analyse.asset before we run, so compare against the asset the builder legs were built on */
      S.legsAsset = AN.asset;
      CG.on('asset', (sym) => {
        if (!sym || !CG.ASSETS[sym]) return; const cur = S.legsAsset || AN.asset;
        if (sym === cur) { AN.asset = sym; renderBuilder(); renderTemplates(); return; }
        if (!AN.legs.length) { S.legsAsset = sym; AN.asset = sym; renderBuilder(); renderTemplates(); return; }
        if (S.assetPrompt) return; S.assetPrompt = true;
        CG.modal.confirm({ title: 'Switch asset to ' + sym + '?', description: 'Changing the asset will clear the current strategy legs.', confirmText: 'Clear & Switch' }).then((ok) => {
          S.assetPrompt = false;
          if (ok) { S.legsAsset = sym; AN.asset = sym; AN.legs = []; AN.name = ''; S.editing = null; AN.strategyId = null; S.dirty = false; legsChanged(); renderTemplates(); }
          else { ST.asset = cur; CG.saveState(); CG.emit('asset', cur); AN.asset = cur; renderBuilder(); renderTemplates(); }
        });
      });
      const onExpiry = (code) => { if (code && CG.EXPIRIES.includes(code)) { AN.expiry = code; S.tplExpiry = code; if (S.subTab === 'templates') renderTemplates(); } };
      CG.on('expiry', onExpiry); CG.on('analyse:expiry', onExpiry);
      CG.on('currency', () => renderAll()); CG.on('settings', () => renderAll()); CG.on('currency-settings-changed', () => renderAll());
      CG.on('analyse:strategies-changed', () => { if (S.subTab === 'templates') renderTemplates(); T._renderJournal(); });
      registerPalette(); CG.on('palette-ready', registerPalette); CG.on('palette', registerPalette);
      renderAll();
      if (S.selfManaged) moveOrToggle('strategy');
    },
    show(root) { placePanels(root); M.strategies.forEach(recalc); renderAll(); registerPalette(); if (S.selfManaged && PANELS.every((k) => S.panels[k] && S.panels[k].hidden)) moveOrToggle('strategy'); }
  });
  /* keyboard: P = paper trade the current builder strategy (only on /analyse, builder visible, focus outside inputs, no dialog open) */
  document.addEventListener('keydown', (e) => { if (e.key !== 'p' && e.key !== 'P') return; if (e.ctrlKey || e.metaKey || e.altKey) return; const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return; if (!CG.current || CG.current.path !== '/analyse') return; if (!S.panels.strategy || S.panels.strategy.hidden || S.subTab !== 'builder' || !AN.legs.length) return; if (document.querySelector('.cg-overlay')) return; e.preventDefault(); T.beginTrade('paper'); });
  T.render = renderAll; T.refresh = () => { M.strategies.forEach(recalc); renderAll(); };
  T.state = () => ({ analyse: AN, editing: S.editing, dirty: S.dirty, subTab: S.subTab, basket: S.basket, density: S.density, brokerId: S.brokerId, jFilter: S.jFilter, tplOutlook: S.tplOutlook });
  T.setBroker = (id) => { if (brokerOf(id)) { S.brokerId = id; renderTicket(); } };
})();
</script>
