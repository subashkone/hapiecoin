    MA.table(m.querySelector('[data-tb="fd"]'), { key: 'fd', csv: c.symbol + '-funding', cols: [exCol(), MA.col.fund(), MA.col.fund('predicted', 'Predicted'), { key: 'apr', label: 'Annualised', align: 'r', val: (e) => e.funding * 3 * 365, html: (e) => MA.pct(e.funding * 3 * 365, 1) }], rows: d.ex, sort: { key: 'funding', dir: 'desc' }, nav: exNav });
    const last = d.liq.slice(-24); const mx = Math.max(...last.map((x) => Math.max(x.long, x.short))) || 1; const cell = (x, k, tok) => '<div style="background:hsl(var(--' + tok + ')/' + (0.08 + (x[k] / mx) * 0.9).toFixed(2) + ')" title="' + MA.hhmm(new Date(x.time)) + ' · ' + (k === 'long' ? 'Long' : 'Short') + ' ' + MA.usd(x[k]) + '"></div>';
    m.querySelector('[data-heat]').innerHTML = '<div class="ma-heat-wrap"><div class="ma-heat"><div class="h"></div>' + last.map((x) => '<div class="h">' + MA.hhmm(new Date(x.time)).slice(0, 2) + '</div>').join('') + '<div class="h lab ma-up">Long</div>' + last.map((x) => cell(x, 'long', 'profit')).join('') + '<div class="h lab ma-down">Short</div>' + last.map((x) => cell(x, 'short', 'loss')).join('') + '</div></div>';
    m.onclick = (e) => { if (e.target.closest('[data-star]')) { A.watch.toggle(c.symbol); m.querySelector('[data-starhost]').innerHTML = starBtn(); return; } if (e.target.closest('[data-cmp]')) { if (A.cmp.list().includes(c.symbol) || A.cmp.toggle(c.symbol) !== false) CG.navigate('/terminal/spot?compare=1'); } };
  };
  // 6) Exchange overview
  S.exchange = function (root, p) { const m = main(root); const name = String(p.exchange || ''); const ex = M.exchanges.find((e) => e.name.toLowerCase() === name.toLowerCase()); const chips = '<div class="ma-chips">' + M.exchanges.map((e) => '<a class="ma-chip' + (ex && e.name === ex.name ? ' active' : '') + '" href="#/terminal/exchanges/' + e.name + '">' + CG.esc(e.name) + '</a>').join('') + '</div>';
    if (!ex) { m.innerHTML = MA.head('Unknown exchange: ' + CG.esc(name), 'Exchange overview', chips) + '<div class="ma-panel">' + MA.empty('No data', 'No exchange named “' + CG.esc(name) + '” is tracked. Pick one above.') + '</div>'; return; }
    const count = Math.max(8, Math.round(M.coins.length * Math.min(1, 0.4 + ex.oiShare * 2))); const rows = M.coins.slice().sort((a, b) => b.marketCap - a.marketCap).slice(0, count).map((c) => { const e = MA.coinData(c).ex.find((x) => x.name === ex.name); return { coin: c, symbol: c.symbol, name: c.name, openInterest: e.openInterest, volume24h: e.volume24h, funding: e.funding }; });
    m.innerHTML = MA.head(CG.esc(ex.name), 'Exchange overview', chips) + '<div class="ma-tiles">' + MA.tile('Tracked Coins', rows.length, 'Perpetual markets') + MA.tile('Total OI', MA.usd(ex.openInterest), F.num(ex.oiShare * 100, 1) + '% of aggregated OI') + MA.tile('24h Volume', MA.usd(ex.volume24h), 'Futures volume') + MA.tile('BTC Balance', F.int(ex.btcBalance) + ' BTC', '24h ' + MA.pct(ex.btcBalanceChg24)) + '</div>' + MA.panel('Coins on ' + CG.esc(ex.name), rows.length + ' markets · sortable · click a row to open the coin', '<div data-tb></div>', true);
    MA.table(m.querySelector('[data-tb]'), { key: 'ex-' + ex.name, csv: ex.name + '-markets', cols: [{ key: 'symbol', label: 'Coin', val: (r) => r.symbol, html: (r) => MA.coinCell(r.coin) }, MA.col.usd('openInterest', 'Open Interest'), MA.col.usd('volume24h', '24h Vol'), MA.col.fund()], rows, sort: { key: 'openInterest', dir: 'desc' }, nav: (r) => '/terminal/coin/' + r.symbol, star: (r) => r.symbol }); };
  // 7) Open Interest
  S.oi = function (root) { const m = main(root); const T = MA.totals(); const exOi = M.exchanges.reduce((s, e) => s + e.openInterest, 0); m.innerHTML = MA.head('Open Interest', 'Aggregated futures open interest across exchanges') + '<div class="ma-tiles">' + MA.tile('Aggregated OI', MA.usd(exOi), 'All exchanges') + MA.tile('BTC OI', MA.usd(MA.coin('BTC').openInterest), 'BTC Dominance ' + F.num(T.btcDom, 1) + '%') + MA.tile('Top Exchange', CG.esc(M.exchanges[0].name), F.num(M.exchanges[0].oiShare * 100, 1) + '% share') + '</div>' + MA.panel('Aggregated Open Interest', 'OI USD (left) vs BTC price (right)', '<div data-ch></div>') + MA.panel('Open Interest by Exchange', 'Share of aggregated OI · click a row to open the exchange', '<div data-tb></div>', true);
    MA.tfChart(m.querySelector('[data-ch]'), 'oi', {}, (tf) => { const O = A.tfSeries('t-oi', tf, { values: M.oiHistory.map((x) => x.oi), stepH: 1 }); const P = A.tfSeries('t-btcpx', tf, { values: M.oiHistory.map((x) => x.price), stepH: 1 }); return { height: 260, labels: O.x, tips: O.xTip, series: [{ name: 'Open Interest', type: 'area', data: O.v, color: CURVE, format: MA.usd }, { name: 'BTC Price', data: P.v, color: FG, axis: 'right', format: (v) => '$' + F.int(v) }], yFormat: usdFmt, y2Format: (v) => '$' + F.compact(v) }; });
    MA.table(m.querySelector('[data-tb]'), { key: 'oi-ex', csv: 'oi-by-exchange', cols: [exCol(), MA.col.usd('openInterest', 'Open Interest'), { key: 'oiShare', label: 'Share', align: 'r', val: (e) => e.oiShare, html: (e) => '<span class="ma-bar" style="width:' + Math.max(4, e.oiShare * 240).toFixed(0) + 'px"></span>' + MA.mono(F.num(e.oiShare * 100, 1) + '%') }], rows: M.exchanges, sort: { key: 'openInterest', dir: 'desc' }, nav: (e) => '/terminal/exchanges/' + e.name }); };
  // 8) Funding Rates
  S.funding = function (root) { const m = main(root); const fh = M.fundingHistory; const cur = fh[fh.length - 1]; m.innerHTML = MA.head('Funding Rates', 'OI-weighted funding across exchanges') + '<div class="ma-tiles">' + MA.tile('OI-Weighted Funding', MA.fund(cur.oiWeighted), 'Current 8h rate') + MA.tile('Average Funding', MA.fund(cur.funding), 'Simple average') + MA.tile('Annualised', MA.pct(cur.oiWeighted * 3 * 365, 1), '3 × 365 periods') + '</div>' + MA.panel('OI-Weighted Funding', 'Funding % · 8h intervals', '<div data-ch></div>') + MA.panel('Per-exchange Funding', 'BTC perpetual funding per venue · sortable · click a row to open the exchange', '<div data-tb></div>', true);
    MA.tfChart(m.querySelector('[data-ch]'), 'fund', FUND_TF, (tf) => { const Tn = A.tfSeries('t-fund', tf, Object.assign({ values: fh.map((x) => x.oiWeighted) }, H8)); return { type: 'bar', height: 260, labels: Tn.x, tips: Tn.xTip, series: [{ name: 'Funding %', data: Tn.v.map((v) => +v.toFixed(4)), color: UP, colorNeg: DOWN, legendColor: UP, format: (v) => v.toFixed(4) + '%' }], yFormat: (v) => v.toFixed(3) + '%' }; });
    const btc = MA.coinData(MA.coin('BTC')).ex; MA.table(m.querySelector('[data-tb]'), { key: 'fund-ex', csv: 'funding-by-exchange', cols: [exCol(), MA.col.fund(), MA.col.fund('predicted', 'Predicted'), MA.col.usd('openInterest', 'Open Interest'), { key: 'apr', label: 'Annualised', align: 'r', val: (e) => e.funding * 3 * 365, html: (e) => MA.pct(e.funding * 3 * 365, 1) }], rows: btc, sort: { key: 'funding', dir: 'desc' }, nav: (e) => '/terminal/exchanges/' + e.name }); };
  // 9) Long / Short
  S.longShort = function (root) { const m = main(root); const ls = M.lsHistory; const cur = ls[ls.length - 1]; const cls = (v) => (v >= 1 ? 'ma-up' : 'ma-down'); m.innerHTML = MA.head('Long / Short', 'Global account ratio vs top trader accounts and positions') + '<div class="ma-tiles">' + MA.tile('Global Accounts', F.num(cur.global, 2), 'L/S', cls(cur.global)) + MA.tile('Top Trader (Accounts)', F.num(cur.topAccounts, 2), 'L/S', cls(cur.topAccounts)) + MA.tile('Top Trader (Positions)', F.num(cur.topPositions, 2), 'L/S', cls(cur.topPositions)) + '</div>' + MA.panel('Long / Short Ratio', 'L/S · hourly', '<div data-ch></div>') + MA.panel('Hourly Readings', 'Latest 24 readings · sortable', '<div data-tb></div>', true);
    MA.tfChart(m.querySelector('[data-ch]'), 'ls3', {}, (tf) => { const g = A.tfSeries('t-ls-g', tf, { values: ls.map((x) => x.global), stepH: 1, clamp: [0.5, 2.5] }); const a = A.tfSeries('t-ls-a', tf, { values: ls.map((x) => x.topAccounts), stepH: 1, clamp: [0.5, 3] }); const p = A.tfSeries('t-ls-p', tf, { values: ls.map((x) => x.topPositions), stepH: 1, clamp: [0.5, 3.5] }); const f2 = (arr) => arr.map((v) => +v.toFixed(2)); return { height: 280, labels: g.x, tips: g.xTip, series: [{ name: 'Global Accounts', data: f2(g.v), color: FG }, { name: 'Top Trader (Accounts)', data: f2(a.v), color: CURVE }, { name: 'Top Trader (Positions)', data: f2(p.v), color: THIRD, dash: '4 3' }], yFormat: (v) => F.num(v, 2), refs: [{ y: 1, label: 'L/S = 1' }], legend: true }; });
    const rows = ls.slice(-24).reverse(); const lsCol = (k, l) => ({ key: k, label: l, align: 'r', val: (x) => x[k], html: (x) => '<span class="ma-mono ' + cls(x[k]) + '">' + F.num(x[k], 2) + '</span>' }); MA.table(m.querySelector('[data-tb]'), { key: 'ls-rows', csv: 'long-short-hourly', search: false, cols: [{ key: 'time', label: 'Time', val: (x) => x.time, html: (x) => MA.mono(MA.dmh(new Date(x.time))) }, lsCol('global', 'Global Accounts'), lsCol('topAccounts', 'Top Trader (Accounts)'), lsCol('topPositions', 'Top Trader (Positions)')], rows, sort: { key: 'time', dir: 'desc' } }); };
  // 10) Liquidations
  S.liquidations = function (root) { const m = main(root); const lh = M.liqHistory; const last = lh.slice(-24); const L = last.reduce((s, x) => s + x.long, 0), Sh = last.reduce((s, x) => s + x.short, 0); m.innerHTML = MA.head('Liquidations', 'Aggregated futures liquidations · all exchanges') + '<div class="ma-tiles">' + MA.tile('24h Total', MA.usd(L + Sh), 'Long + Short') + MA.tile('Long Liquidations', MA.usd(L), F.num((L / (L + Sh)) * 100, 1) + '% of total', 'ma-up') + MA.tile('Short Liquidations', MA.usd(Sh), F.num((Sh / (L + Sh)) * 100, 1) + '% of total', 'ma-down') + MA.tile('Largest Coin', CG.esc(M.global.topLiqCoin), 'By 24h liquidations') + '</div>' + MA.panel('Liquidations', 'Long Liq / Short Liq', '<div data-ch></div>') + MA.panel('By Coin (24h)', M.coins.length + ' coins · sortable · click a row to open the coin', '<div data-tb></div>', true);
    MA.tfChart(m.querySelector('[data-ch]'), 'liq', {}, (tf) => { const iid = (r, mean) => mean * (0.35 + r() * 1.3); const Lo = A.tfSeries('t-liq-l', tf, { values: lh.map((x) => x.long), stepH: 1, iid }); const So = A.tfSeries('t-liq-s', tf, { values: lh.map((x) => x.short), stepH: 1, iid }); return { type: 'bar', stacked: true, height: 260, labels: Lo.x, tips: Lo.xTip, series: [{ name: 'Long Liq', data: Lo.v, color: UP, format: MA.usd }, { name: 'Short Liq', data: So.v, color: DOWN, format: MA.usd }], yFormat: usdFmt }; });
    MA.table(m.querySelector('[data-tb]'), { key: 'liq-coins', csv: 'liquidations-by-coin', search: true, searchPlaceholder: 'Search coin…', columns: true, star: (c) => c.symbol, maxH: 560, cols: [MA.col.coin(), MA.col.usd('liq24h', '24h Total'), { key: 'longLiq24h', label: 'Long', align: 'r', val: (c) => c.longLiq24h, html: (c) => '<span class="ma-mono ma-up">' + MA.usd(c.longLiq24h) + '</span>' }, { key: 'shortLiq24h', label: 'Short', align: 'r', val: (c) => c.shortLiq24h, html: (c) => '<span class="ma-mono ma-down">' + MA.usd(c.shortLiq24h) + '</span>' }, { key: 'bias', label: 'L/S Bias', val: (c) => c.longLiq24h / c.liq24h, html: (c) => '<span class="cg2-bias">' + A.split(c.longLiq24h, c.shortLiq24h) + '<span class="mono" style="font-size:10.5px;width:34px;text-align:right">' + F.num(c.longLiq24h / c.liq24h * 100, 0) + '%</span></span>' }], rows: M.coins, sort: { key: 'liq24h', dir: 'desc' }, nav: (c) => '/terminal/coin/' + c.symbol }); };
  // 11) Exchange Balance
  S.exchangeBalance = function (root) { const m = main(root); const eb = MA.exchBalance(); const cur = eb[eb.length - 1].balance, d1 = eb[eb.length - 2].balance, d7 = eb[eb.length - 8].balance, d30 = eb[eb.length - 31].balance; const chg = (a, b) => ((a - b) / b) * 100; m.innerHTML = MA.head('Exchange Balance', 'Bitcoin held on exchanges') + '<div class="ma-tiles">' + MA.tile('Total BTC Balance', F.int(cur) + ' BTC', '≈ ' + MA.usd(cur * MA.coin('BTC').price)) + MA.tile('24h Change', MA.pct(chg(cur, d1)), F.signed(cur - d1, 0) + ' BTC') + MA.tile('7d Change', MA.pct(chg(cur, d7)), F.signed(cur - d7, 0) + ' BTC') + MA.tile('30d Change', MA.pct(chg(cur, d30)), F.signed(cur - d30, 0) + ' BTC') + '</div>' + MA.panel('BTC Balance', 'Total balance across tracked exchanges · daily', '<div data-ch></div>') + MA.panel('Balance by Exchange', 'BTC held per exchange · sortable · click a row to open the exchange', '<div data-tb></div>', true);
    MA.tfChart(m.querySelector('[data-ch]'), 'bal', { options: ['30D', '90D', '1Y'], def: '90D' }, (tf) => { const Tn = A.tfSeries('t-bal', tf, Object.assign({ values: eb.map((x) => x.balance), volMult: 0.8 }, DAILY)); return { type: 'area', height: 260, labels: Tn.x, tips: Tn.xTip, series: [{ name: 'BTC Balance', data: Tn.v.map(Math.round), color: CURVE, format: (v) => F.int(v) + ' BTC' }], yFormat: (v) => F.compact(v) }; });
    const pc = (k, l) => ({ key: k, label: l, align: 'r', val: (e) => e[k], html: (e) => A.heat(e[k], { max: k === 'btcBalanceChg24' ? 1.5 : k === 'btcBalanceChg7d' ? 3 : 6 }) }); MA.table(m.querySelector('[data-tb]'), { key: 'bal-ex', csv: 'exchange-balance', cols: [exCol(), { key: 'btcBalance', label: 'BTC Balance', align: 'r', val: (e) => e.btcBalance, html: (e) => MA.mono(F.int(e.btcBalance) + ' BTC') }, pc('btcBalanceChg24', '24h %'), pc('btcBalanceChg7d', '7d %'), pc('btcBalanceChg30d', '30d %')], rows: M.exchanges, sort: { key: 'btcBalance', dir: 'desc' }, nav: (e) => '/terminal/exchanges/' + e.name }); };
  // 12) Token Unlocks (exact empty state from the bundle)
  S.unlocks = function (root) { main(root).innerHTML = MA.head('Token Unlock Schedule', 'Upcoming vesting events') + '<div class="ma-panel">' + MA.empty('Token unlock data unavailable', 'This data source is not enabled on the current plan. Enable a token-unlock endpoint in the proxy to populate this view — no mock data shown.') + '</div>'; };
  // 13) Fear & Greed
  S.fearGreed = function (root) { const m = main(root); const fg = M.fearGreed; const v = M.fearGreedNow; const at = (n) => fg[fg.length - 1 - n].value; const lab = (x) => x + '<small class="ma-mute">' + M.fgLabel(x) + '</small>'; m.innerHTML = MA.head('Fear & Greed Index', 'Crypto market sentiment · updated daily') + '<div class="ma-grid ma-grid-2">' + MA.panel('Fear &amp; Greed Index', 'Now · ' + M.fgLabel(v), '<div data-gauge style="display:flex;justify-content:center;padding:8px 0"></div>') + MA.panel('History', 'F&amp;G · daily', '<div data-ch></div>') + '</div><div class="ma-tiles">' + MA.tile('Now', lab(v), MA.dm(CG.NOW)) + MA.tile('Yesterday', lab(at(1)), MA.dm(new Date(CG.NOW - 86400000))) + MA.tile('Last Week', lab(at(7)), MA.dm(new Date(CG.NOW - 7 * 86400000))) + MA.tile('Last Month', lab(at(30)), MA.dm(new Date(CG.NOW - 30 * 86400000))) + '</div>'; MA.gauge(m.querySelector('[data-gauge]'), v);
    MA.tfChart(m.querySelector('[data-ch]'), 'fg', { options: ['7D', '30D', '90D', '1Y'], def: '90D' }, (tf) => { const Tn = A.tfSeries('t-fg', tf, Object.assign({ values: fg.map((x) => x.value), additive: true, clamp: [5, 95] }, DAILY)); return { type: 'area', height: 232, min: 0, max: 100, tight: true, labels: Tn.x, tips: Tn.xTip, series: [{ name: 'F&G', data: Tn.v.map(Math.round), color: CURVE, format: (x) => x + ' · ' + M.fgLabel(x) }], yFormat: (x) => String(x), refs: [{ y: 25, label: 'Extreme Fear', color: DOWN }, { y: 75, label: 'Extreme Greed', color: UP }] }; }); };
  // 14) BTC Cycle
  S.cycle = function (root) { const m = main(root); const ch = M.cycleHistory; const cy = M.cycle; const CYC = { options: ['30D', '90D', '180D'], def: '180D' }; m.innerHTML = MA.head('BTC Cycle Indicators', 'AHR999 · Puell Multiple · Pi Cycle Top · daily') + '<div class="ma-tiles">' + MA.tile('AHR999', F.num(cy.ahr999, 2), cy.ahr999 < 0.45 ? 'Bottom zone (< 0.45)' : cy.ahr999 < 1.2 ? 'Accumulate (0.45 – 1.2)' : 'Above 1.2') + MA.tile('Puell Multiple', F.num(cy.puell, 2), cy.puell < 0.5 ? 'Undervalued (< 0.5)' : cy.puell > 4 ? 'Overheated (> 4)' : 'Neutral (0.5 – 4)') + MA.tile('Pi Cycle · 111DMA', '$' + F.int(cy.piCycle.ma111), '350DMA×2 $' + F.int(cy.piCycle.ma350x2)) + MA.tile('Rainbow Band', CG.esc(cy.rainbowBand), '2Y MA $' + F.int(cy.twoYearMa)) + '</div>' + MA.panel('AHR999', 'Bitcoin accumulation index', '<div data-ch="a"></div>') + MA.panel('Puell Multiple', 'Daily issuance value / 365d MA', '<div data-ch="p"></div>') + MA.panel('Pi Cycle', 'BTC price with 111DMA and 350DMA×2', '<div data-ch="pi"></div>');
    MA.tfChart(m.querySelector('[data-ch="a"]'), 'ahr', CYC, (tf) => { const Tn = A.tfSeries('t-ahr', tf, Object.assign({ values: ch.map((x) => x.ahr999), clamp: [0.2, 6] }, DAILY)); return { type: 'area', height: 220, labels: Tn.x, tips: Tn.xTip, series: [{ name: 'AHR999', data: Tn.v.map((v) => +v.toFixed(2)), color: CURVE, format: (v) => F.num(v, 2) }], yFormat: (v) => F.num(v, 2), refs: [{ y: 0.45, label: 'Bottom 0.45', color: UP }, { y: 1.2, label: 'Top 1.2', color: DOWN }] }; });
    MA.tfChart(m.querySelector('[data-ch="p"]'), 'puell', CYC, (tf) => { const Tn = A.tfSeries('t-puell', tf, Object.assign({ values: ch.map((x) => x.puell), clamp: [0.3, 6] }, DAILY)); return { type: 'area', height: 220, labels: Tn.x, tips: Tn.xTip, series: [{ name: 'Puell Multiple', data: Tn.v.map((v) => +v.toFixed(2)), color: FG, format: (v) => F.num(v, 2) }], yFormat: (v) => F.num(v, 2), refs: [{ y: 0.5, label: 'Undervalued 0.5', color: UP }] }; });
    MA.tfChart(m.querySelector('[data-ch="pi"]'), 'pi', CYC, (tf) => { const P = A.tfSeries('t-cyc-px', tf, Object.assign({ values: ch.map((x) => x.price) }, DAILY)); const a = A.tfSeries('t-cyc-111', tf, Object.assign({ values: ch.map((x) => x.ma111), volMult: 0.5 }, DAILY)); const b = A.tfSeries('t-cyc-350', tf, Object.assign({ values: ch.map((x) => x.ma350x2), volMult: 0.4 }, DAILY)); return { height: 260, labels: P.x, tips: P.xTip, series: [{ name: 'BTC Price', data: P.v.map(Math.round), color: FG, format: (v) => '$' + F.int(v) }, { name: '111DMA', data: a.v.map(Math.round), color: CURVE, format: (v) => '$' + F.int(v) }, { name: '350DMA×2', data: b.v.map(Math.round), color: DOWN, dash: '4 3', format: (v) => '$' + F.int(v) }], yFormat: (v) => '$' + F.compact(v), legend: true }; }); };
  // ---------- live price tick on the coin page (BTC / ETH / XAUT come from CG.ASSETS) ----------
  CG.on('tick', (As) => { if (CG.current.route !== '/terminal/coin/:symbol') return; const sym = String(CG.current.params.symbol || '').toUpperCase(); const a = As[sym]; if (!a) return; const act = CG.$('section.screen.active'); const el = act && act.querySelector('[data-live-price]'); if (!el) return; el.textContent = MA.price(a.price); el.style.color = a.price >= (a.prev || a.price) ? 'hsl(var(--profit))' : 'hsl(var(--loss))'; setTimeout(() => { el.style.color = ''; }, 600); });
  // ---------- registrations ----------
  const reg = (route, fn) => CG.register(route, { show(root, params, query) { A.applyTheme(); A.applyDensity(); fn(root, params || {}, query || {}); } });
  reg('/terminal', S.dashboard); reg('/terminal/spot', S.spot); reg('/terminal/sectors/:slug', S.sector); reg('/terminal/etf', S.etf); reg('/terminal/coin/:symbol', S.coin); reg('/terminal/exchanges/:exchange', S.exchange); reg('/terminal/derivatives/open-interest', S.oi); reg('/terminal/derivatives/funding', S.funding); reg('/terminal/derivatives/long-short', S.longShort); reg('/terminal/derivatives/liquidations', S.liquidations); reg('/terminal/onchain/exchange-balance', S.exchangeBalance); reg('/terminal/onchain/unlocks', S.unlocks); reg('/terminal/indicators/fear-greed', S.fearGreed); reg('/terminal/indicators/cycle', S.cycle);
  // re-render terminal charts on resize (keeps the timeframe choice)
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const act = CG.$('section.screen.active'); if (!act || !act.querySelector('.terminal')) return; CG.$$('.ma-chart', act).forEach((el) => { if (el._cg2spec) A.chart(el, el._cg2spec); }); }, 160); });
})();
</script>
