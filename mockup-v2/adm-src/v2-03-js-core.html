<script>
(function () {
  'use strict';
  const A = (window.CG_ADMIN = window.CG_ADMIN || {});
  const M = CG.mock, F = CG.fmt, esc = CG.esc, $ = CG.$, $$ = CG.$$;
  // ---------- icons (lucide paths, inline) ----------
  const ICONS = {
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    settings2: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
    calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
    eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    send: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
    arrowLeft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
    chevLeft: '<path d="m15 18-6-6 6-6"/>',
    chevRight: '<path d="m9 18 6-6-6-6"/>',
    chevDown: '<path d="m6 9 6 6 6-6"/>',
    filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
    layers: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/>',
    image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    ticket: '<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>',
    package: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    columns: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/>',
    monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
    userCheck: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/>',
    external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
    file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>'
  };
  A.icon = (n, size) => '<svg class="adm-ic" width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';
  A.hydrateIcons = (root) => $$('i[data-icon]', root).forEach((i) => { i.outerHTML = A.icon(i.dataset.icon, i.dataset.size); });

  // ---------- shared helpers ----------
  const el = (root, name) => root.querySelector('[data-el="' + name + '"]');
  A.el = el;
  A.uid = (p) => p + '_' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
  A.date = (d) => (d ? F.date(d) : '—');
  A.dateTime = (d) => (d ? F.date(d) + ' ' + F.time(d) : '—');
  A.daysLeft = (d) => Math.ceil((new Date(d) - CG.NOW) / 86400000);
  A.statusBadge = (s) => ({ active: 'badge-success', expired: 'badge-loss', cancelled: 'badge-secondary', free: 'badge-outline', paid: 'badge-success', pending: 'badge-warning', not_paid: 'badge-loss', delivered: 'badge-success', failed: 'badge-loss' }[s] || 'badge-secondary');
  A.statusLabel = (s) => ({ active: 'Active', expired: 'Expired', cancelled: 'Cancelled', free: 'Free', paid: 'Paid', pending: 'Pending', not_paid: 'Not Paid', delivered: 'Delivered', failed: 'Failed' }[s] || s);
  A.planBadge = (name) => (/free/i.test(name || '') ? 'badge-outline' : 'badge-secondary');
  A.planName = (id) => { const p = M.plans.find((x) => x.id === id); return p ? p.name : id; };
  A.switchHtml = (on, attrs) => '<button type="button" class="switch' + (on ? ' on' : '') + '" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" ' + (attrs || '') + '></button>';
  A.setSwitch = (btn, on) => { btn.classList.toggle('on', !!on); btn.setAttribute('aria-checked', on ? 'true' : 'false'); };
  A.isOn = (btn) => btn.classList.contains('on');
  A.validation = (msg) => CG.toast({ title: 'Validation', description: msg, variant: 'destructive' });
  A.save = (fn, title) => { try { fn(); CG.toast({ title: title, variant: 'success' }); return true; } catch (e) { CG.toast({ title: 'Failed to save', description: e && e.message ? e.message : 'Please try again.', variant: 'destructive' }); return false; } };
  A.empty = (icon, title, hint, btn, act) => '<div class="empty"><div class="adm-empty-icon">' + A.icon(icon, 20) + '</div><b>' + esc(title) + '</b>' + esc(hint) + (btn ? '<div class="mt-4"><button class="btn ' + (act === 'clear-filters' ? 'btn-outline' : 'btn-primary') + ' btn-sm" data-act="' + (act || 'new') + '">' + (act === 'clear-filters' ? '' : A.icon('plus') + ' ') + esc(btn) + '</button></div>' : '') + '</div>';
  A.pager = (page, pages, info, prevLabel, nextLabel) => '<span>' + (info ? esc(info) + ' · ' : '') + 'Page ' + page + ' of ' + pages + '</span><span class="flex gap-2"><button class="btn btn-outline btn-sm" data-act="prev"' + (page <= 1 ? ' disabled' : '') + '>' + prevLabel + '</button><button class="btn btn-outline btn-sm" data-act="next"' + (page >= pages ? ' disabled' : '') + '>' + nextLabel + '</button></span>';
  A.paginate = (list, page, per) => { per = per || 10; const pages = Math.max(1, Math.ceil(list.length / per)); page = Math.min(Math.max(1, page), pages); return { page, pages, rows: list.slice((page - 1) * per, page * per), total: list.length }; };
  A.bindTabs = (root, onChange) => { CG.delegate(root, 'click', '[data-tab]', (e, b) => { A.setTab(root, b.dataset.tab); if (onChange) onChange(b.dataset.tab); }); };
  A.setTab = (root, name) => { $$('[data-tab]', root).forEach((t) => t.classList.toggle('active', t.dataset.tab === name)); $$('[data-panel]', root).forEach((p) => (p.hidden = p.dataset.panel !== name)); };
  A.formVal = (form, name) => { const i = form.querySelector('[name="' + name + '"]'); return i ? i.value : ''; };
  A.formSet = (form, name, v) => { const i = form.querySelector('[name="' + name + '"]'); if (i) i.value = v == null ? '' : v; };
  A.busy = (btn, label, fn, ms) => { const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = label; setTimeout(() => { btn.disabled = false; btn.innerHTML = old; fn(); }, ms || 450); };
  A.strip = (html) => String(html || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  A.copyText = (text, toast) => { const done = () => CG.toast(Object.assign({ title: 'Copied!', variant: 'success' }, toast || {})); const fallback = () => { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } catch (e) { } done(); }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); };
  A.csv = (headers, rows) => { const q = (v) => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }; return [headers.map(q).join(',')].concat(rows.map((r) => r.map(q).join(','))).join('\n'); };
  A.copyCsv = (headers, rows, noun) => A.copyText(A.csv(headers, rows), { title: 'CSV copied', description: rows.length + ' ' + (noun || 'rows') + ' × ' + headers.length + ' columns' });
  A.initials = (n) => String(n || '?').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  // mock enrichments (do not rename existing fields)
  M.users.forEach((u) => { if (u.validityDays == null) u.validityDays = u.subscribedAt && u.endsAt ? Math.round((new Date(u.endsAt) - new Date(u.subscribedAt)) / 86400000) : 0; if (!u.lotSizes) u.lotSizes = { BTC: 0.001, ETH: 0.01, XAUT: 0.001 }; if (!u.featureLimits) u.featureLimits = { paper_trading: 0, live_trading: 0 }; });
  // density
  A.applyDensity = (v) => { const c = (v || CG.state.density) === 'compact'; $$('section.adm').forEach((s) => s.classList.toggle('is-compact', c)); };
  CG.on('density', A.applyDensity);

  // ---------- CG.chrome['admin-nav'] : left rail (>=1100px) / top bar ----------
  const NAV = [['Users', '/admin/users', 'users'], ['Subscription Plans', '/admin/subscriptions', 'package'], ['Menu Pricing', '/admin/menu-pricing', 'tag'], ['Coupon Codes', '/admin/coupons', 'ticket'], ['User Subscriptions', '/admin/user-subscriptions', 'wallet'], ['Banners', '/admin/banners', 'image'], ['Promotional Emails', '/admin/emails', 'mail']];
  A.NAV = NAV;
  A.navCount = (p) => ({ '/admin/users': M.users.length, '/admin/subscriptions': M.plans.length, '/admin/menu-pricing': M.menuItems.length, '/admin/coupons': M.coupons.length, '/admin/user-subscriptions': M.commissions.filter((c) => c.pending > 0).length, '/admin/banners': M.banners.filter((b) => b.isActive).length, '/admin/emails': M.campaigns.length }[p]);
  A.navActive = (host) => { const path = (CG.current && CG.current.path) || ''; $$('a[data-path]', host).forEach((a) => { const on = path === a.dataset.path || path.startsWith(a.dataset.path + '/'); a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); const c = a.querySelector('.adm-rail-count'); if (c) c.textContent = A.navCount(a.dataset.path); }); };
  CG.chrome['admin-nav'] = function (host) { host.innerHTML = '<nav class="adm-rail" aria-label="Admin pages"><span class="micro adm-rail-label">Admin</span>' + NAV.map(([l, p, ic]) => '<a href="#' + p + '" data-path="' + p + '">' + A.icon(ic, 15) + '<span>' + esc(l) + '</span><span class="adm-rail-count"></span></a>').join('') + '<div class="adm-rail-foot">' + esc(M.user.email) + '<br>role · ' + esc(CG.state.role || 'admin') + '<br>Ctrl K · palette</div></nav>'; A.navActive(host); };
  CG.chrome['admin-nav:update'] = (host) => A.navActive(host);
  CG.on('route', () => { $$('[data-cg="admin-nav"]').forEach(A.navActive); A.applyDensity(); });
  ['users:changed', 'plans:changed', 'menuItems:changed', 'coupons:changed', 'commissions:changed', 'banners:changed', 'campaigns:changed'].forEach((ev) => CG.on(ev, () => $$('[data-cg="admin-nav"]').forEach(A.navActive)));

  // ---------- palette commands (only if the chrome exposes a palette API) ----------
  const regPalette = (cmds) => { const P = CG.palette; if (!P) return false; const fn = P.register || P.add; if (typeof fn === 'function') { try { cmds.forEach((c) => fn.call(P, c)); return true; } catch (e) { return false; } } if (Array.isArray(P.commands)) { cmds.forEach((c) => P.commands.push(c)); return true; } return false; };
  const PAL = NAV.map(([l, p]) => ({ id: 'admin' + p.replace(/\//g, '-'), label: 'Admin → ' + l, group: 'Admin', run: () => CG.navigate(p) }));
  let palDone = regPalette(PAL); if (!palDone) { const off = CG.on('route', () => { if (!palDone) palDone = regPalette(PAL); if (palDone) off(); }); }

  // ---------- generic data grid: sticky tools, column menu (persisted), sorting, selection + bulk bar, CSV, pager, empty state ----------
  // cfg: { root, key, host, pager, tools, bulkbar, columns:[{id,label,cell,csv,sortVal,cls,always,default}], rows(), rowId, rowAttrs, per, noun, empty:{icon,title,hint,action,act}, emptyFiltered:{title,hint}, isFiltered(), bulk:[{id,label,variant,run(rows,grid),keep}], csvName, onRender }
  A.grid = function (cfg) {
    const G = { sel: new Set(), sort: cfg.sort || null, page: 1 };
    const colsState = () => (CG.state.adminCols = CG.state.adminCols || {});
    const visibleCols = () => { const saved = colsState()[cfg.key]; return cfg.columns.filter((c) => c.always || (Array.isArray(saved) ? saved.includes(c.id) : c.default !== false)); };
    G.setCols = (ids) => { colsState()[cfg.key] = ids; CG.saveState(); G.render(); };
    G.resetCols = () => { delete colsState()[cfg.key]; CG.saveState(); G.render(); };
    G.rows = () => { let rows = cfg.rows(); if (G.sort) { const c = cfg.columns.find((x) => x.id === G.sort.id); if (c && c.sortVal) rows = rows.slice().sort((a, b) => { const va = c.sortVal(a), vb = c.sortVal(b); const r = va > vb ? 1 : va < vb ? -1 : 0; return G.sort.dir === 'asc' ? r : -r; }); } return rows; };
    G.selectedRows = () => cfg.rows().filter((r) => G.sel.has(cfg.rowId(r)));
    G.clearSel = () => { G.sel.clear(); G.render(); };
    const label = (c) => c.csvLabel || A.strip(c.label);
    const csvCols = () => visibleCols().filter((c) => !c.noCsv);
    G.csvText = (rowsOverride) => { const cols = csvCols(); const rows = rowsOverride || G.rows(); return A.csv(cols.map(label), rows.map((r) => cols.map((c) => (c.csv ? c.csv(r) : A.strip(c.cell(r)))))); };
    G.copyCsv = (rowsOverride) => { const cols = csvCols(); const rows = rowsOverride || G.rows(); A.copyText(G.csvText(rows), { title: 'CSV copied', description: rows.length + ' ' + (cfg.noun || 'rows') + ' × ' + cols.length + ' columns' }); };
    const renderTools = (total) => { if (!cfg.tools) return; cfg.tools.innerHTML = '<span class="adm-count">' + total + ' ' + esc(cfg.noun || 'rows') + '</span><button type="button" class="btn btn-outline btn-sm" data-grid="cols" title="Show or hide columns">' + A.icon('columns', 13) + ' Columns ' + A.icon('chevDown', 12) + '</button><button type="button" class="btn btn-outline btn-sm" data-grid="csv" title="Copy the current view as CSV">' + A.icon('copy', 13) + ' Copy CSV</button>'; };
    const renderBulk = () => { const bar = cfg.bulkbar; if (!bar) return; if (!cfg.bulk || !G.sel.size) { bar.hidden = true; bar.innerHTML = ''; return; } bar.hidden = false; bar.innerHTML = '<span class="adm-bulk-n">' + G.sel.size + ' selected</span><span class="adm-bulk-sep"></span>' + cfg.bulk.map((b) => '<button type="button" class="btn btn-sm ' + (b.variant || 'btn-outline') + '" data-bulk="' + b.id + '">' + (b.icon ? A.icon(b.icon, 13) + ' ' : '') + esc(b.label) + '</button>').join('') + '<span class="adm-bulk-sep"></span><button type="button" class="btn btn-ghost btn-sm" data-bulk="__clear" title="Clear selection">' + A.icon('x', 13) + ' Clear</button>'; };
    G.render = () => {
      const all = G.rows(); const cols = visibleCols(); const host = cfg.host;
      const ids = new Set(cfg.rows().map(cfg.rowId)); Array.from(G.sel).forEach((id) => { if (!ids.has(id)) G.sel.delete(id); });
      renderTools(all.length);
      if (!all.length) { const filtered = cfg.isFiltered && cfg.isFiltered(); const e = filtered && cfg.emptyFiltered ? cfg.emptyFiltered : cfg.empty; host.innerHTML = A.empty(e.icon || cfg.empty.icon, e.title, e.hint, e.action, e.act || (filtered ? 'clear-filters' : 'new')); if (cfg.pager) cfg.pager.innerHTML = ''; renderBulk(); if (cfg.onRender) cfg.onRender(all); return; }
      const pg = cfg.per ? A.paginate(all, G.page, cfg.per) : { page: 1, pages: 1, rows: all, total: all.length }; G.page = pg.page;
      const selAll = all.every((r) => G.sel.has(cfg.rowId(r)));
      const th = (c) => '<th class="' + (c.cls || '') + (c.sortVal ? ' adm-sortable' : '') + (G.sort && G.sort.id === c.id ? ' sorted' : '') + '"' + (c.sortVal ? ' data-sort="' + c.id + '" title="Sort by ' + esc(label(c)) + '"' : '') + '>' + c.label + (c.sortVal ? '<span class="adm-sort-ind">' + (G.sort && G.sort.id === c.id ? (G.sort.dir === 'asc' ? '▲' : '▼') : '') + '</span>' : '') + '</th>';
      host.innerHTML = '<table class="table"><thead><tr>' + (cfg.bulk ? '<th class="adm-selcol"><input type="checkbox" class="checkbox" data-sel="__all"' + (selAll ? ' checked' : '') + ' aria-label="Select all ' + all.length + ' rows" title="Select all ' + all.length + ' ' + esc(cfg.noun || 'rows') + '"></th>' : '') + cols.map(th).join('') + '</tr></thead><tbody>' + pg.rows.map((r) => { const id = cfg.rowId(r); return '<tr' + (cfg.rowAttrs ? ' ' + cfg.rowAttrs(r) : '') + (G.sel.has(id) ? ' class="is-selected"' : '') + '>' + (cfg.bulk ? '<td class="adm-selcol"><input type="checkbox" class="checkbox" data-sel="' + esc(id) + '"' + (G.sel.has(id) ? ' checked' : '') + ' aria-label="Select row"></td>' : '') + cols.map((c) => '<td class="' + (c.cls || '') + '">' + c.cell(r) + '</td>').join('') + '</tr>'; }).join('') + '</tbody></table>';
      if (cfg.pager) cfg.pager.innerHTML = cfg.per ? A.pager(pg.page, pg.pages, pg.total + ' ' + (cfg.noun || 'rows'), A.icon('chevLeft', 14) + ' Prev', 'Next ' + A.icon('chevRight', 14)) : '';
      renderBulk(); if (cfg.onRender) cfg.onRender(all);
    };
    // events
    cfg.host.addEventListener('change', (e) => { const c = e.target.closest('[data-sel]'); if (!c) return; if (c.dataset.sel === '__all') { const all = G.rows(); if (c.checked) all.forEach((r) => G.sel.add(cfg.rowId(r))); else G.sel.clear(); } else if (c.checked) G.sel.add(c.dataset.sel); else G.sel.delete(c.dataset.sel); G.render(); });
    cfg.host.addEventListener('click', (e) => { if (e.target.closest('[data-sel]')) { e.stopPropagation(); return; } const th = e.target.closest('th[data-sort]'); if (th) { const id = th.dataset.sort; if (G.sort && G.sort.id === id) G.sort.dir = G.sort.dir === 'asc' ? 'desc' : 'asc'; else { const c = cfg.columns.find((x) => x.id === id); G.sort = { id, dir: c && c.sortDesc ? 'desc' : 'asc' }; } G.page = 1; G.render(); } });
    if (cfg.pager) { CG.delegate(cfg.pager, 'click', '[data-act="prev"]', () => { G.page--; G.render(); }); CG.delegate(cfg.pager, 'click', '[data-act="next"]', () => { G.page++; G.render(); }); }
    if (cfg.tools) cfg.tools.addEventListener('click', (e) => {
      const b = e.target.closest('[data-grid]'); if (!b) return;
      if (b.dataset.grid === 'csv') { G.copyCsv(); return; }
      const vis = new Set(visibleCols().map((c) => c.id));
      const m = CG.menu(b, '<div class="menu-label">Columns</div>' + cfg.columns.filter((c) => !c.always).map((c) => '<label class="adm-colrow"><input type="checkbox" class="checkbox" data-col="' + c.id + '"' + (vis.has(c.id) ? ' checked' : '') + '><span>' + esc(label(c)) + '</span></label>').join('') + '<div class="menu-sep"></div><button type="button" class="menu-item" data-cols-reset>' + A.icon('columns', 13) + ' Reset to default</button>');
      m.addEventListener('change', (ev) => { const cb = ev.target.closest('[data-col]'); if (!cb) return; const ids = Array.from(m.querySelectorAll('[data-col]:checked')).map((x) => x.dataset.col); if (!ids.length) { cb.checked = true; CG.toast({ title: 'Keep at least one column' }); return; } G.setCols(cfg.columns.filter((c) => c.always || ids.includes(c.id)).map((c) => c.id)); });
      m.addEventListener('click', (ev) => { if (ev.target.closest('[data-cols-reset]')) { G.resetCols(); CG.toast({ title: 'Columns reset' }); } });
    });
    if (cfg.bulkbar) cfg.bulkbar.addEventListener('click', async (e) => { const b = e.target.closest('[data-bulk]'); if (!b) return; if (b.dataset.bulk === '__clear') { G.clearSel(); return; } const act = cfg.bulk.find((x) => x.id === b.dataset.bulk); if (!act) return; const rows = G.selectedRows(); const r = await act.run(rows, G, b); if (r !== false && !act.keep) G.sel.clear(); G.render(); });
    return G;
  };

  // ---------- grouped / stacked bar chart (SVG, theme-aware via CSS classes) ----------
  const niceMax = (v) => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; const n = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10; return n * p; };
  A.barChart = function (o) {
    const W = o.width || 640, H = o.height || 170, padL = 52, padR = 12, padT = 20, padB = 24; const n = o.labels.length;
    const totals = o.labels.map((_, i) => o.stacked ? o.series.reduce((s, sr) => s + (sr.values[i] || 0), 0) : Math.max.apply(null, o.series.map((sr) => sr.values[i] || 0)));
    const max = niceMax(Math.max(1, ...totals)); const iw = W - padL - padR, ih = H - padT - padB; const y = (v) => padT + ih - v / max * ih; const slot = iw / Math.max(n, 1);
    const fmt = o.fmt || ((v) => String(v)); let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(o.aria || 'Bar chart') + '">';
    s += '<defs><pattern id="admHatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="hsl(var(--profit))" stroke-width="1.5" opacity=".75"/></pattern></defs>';
    [0, 0.5, 1].forEach((f) => { const v = max * f; s += '<line class="grid-l" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"' + (f === 0 ? '' : ' stroke-dasharray="2 3"') + '/><text class="axis-t" x="' + (padL - 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + esc(fmt(v)) + '</text>'; });
    const g = o.series.length; const bw = o.stacked ? Math.min(30, slot * 0.55) : Math.min(18, (slot * 0.62) / g);
    o.labels.forEach((lab, i) => {
      const cx = padL + slot * i + slot / 2; let cum = 0; const tip = lab + ': ' + o.series.map((sr) => sr.name + ' ' + fmt(sr.values[i] || 0)).join(' · ');
      if (o.stacked) { o.series.forEach((sr) => { const v = sr.values[i] || 0; if (v <= 0) return; const top = y(cum + v), h = Math.max(1, y(cum) - top - (cum > 0 ? 2 : 0)); s += '<rect class="' + sr.cls + '" x="' + (cx - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"><title>' + esc(tip) + '</title></rect>'; cum += v; }); }
      else { o.series.forEach((sr, k) => { const v = sr.values[i] || 0; const x = cx - (g * bw + (g - 1) * 3) / 2 + k * (bw + 3); const top = y(v), h = y(0) - top; if (v > 0) s += '<rect class="' + sr.cls + '" x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) + '" rx="2"><title>' + esc(tip) + '</title></rect>'; }); }
      if (totals[i] > 0 && (o.labelAll || i === n - 1 || totals[i] === Math.max(...totals))) s += '<text class="val-t" x="' + cx.toFixed(1) + '" y="' + (y(totals[i]) - 5).toFixed(1) + '" text-anchor="middle">' + esc(fmt(totals[i])) + '</text>';
      s += '<text class="axis-t" x="' + cx.toFixed(1) + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(lab) + '</text>';
      s += '<rect class="bar-hit" x="' + (padL + slot * i).toFixed(1) + '" y="' + padT + '" width="' + slot.toFixed(1) + '" height="' + ih + '"><title>' + esc(tip) + '</title></rect>';
    });
    return s + '</svg>';
  };
  A.inrShort = (v) => (v >= 100000 ? '₹' + (v / 100000).toFixed(v % 100000 ? 1 : 0) + 'L' : v >= 1000 ? '₹' + (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : '₹' + Math.round(v));
})();
</script>
