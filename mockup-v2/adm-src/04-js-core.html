
<script>
(function () {
  'use strict';
  const A = (window.CG_ADMIN = window.CG_ADMIN || {});
  const M = CG.mock, F = CG.fmt, esc = CG.esc, $ = CG.$, $$ = CG.$$;
  // ---------- icons (lucide paths, inline) ----------
  const ICONS = {
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    settings2: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
    calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
    eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    send: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
    arrowLeft: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
    chevLeft: '<path d="m15 18-6-6 6-6"/>',
    chevRight: '<path d="m9 18 6-6-6-6"/>',
    filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
    layers: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/>',
    image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    ticket: '<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>',
    package: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'
  };
  A.icon = (n, size) => '<svg class="adm-ic" width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';
  A.hydrateIcons = (root) => $$('i[data-icon]', root).forEach((i) => { i.outerHTML = A.icon(i.dataset.icon, i.dataset.size); });

  // ---------- shared helpers ----------
  const el = (root, name) => root.querySelector('[data-el="' + name + '"]');
  A.el = el;
  A.uid = (p) => p + '_' + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
  A.date = (d) => (d ? F.date(d) : '—');
  A.dateTime = (d) => (d ? F.date(d) + ' ' + F.time(d) : '—');
  A.daysLeft = (d) => Math.ceil((new Date(d) - CG.NOW) / 86400000);
  A.statusBadge = (s) => ({ active: 'badge-success', expired: 'badge-loss', cancelled: 'badge-secondary', free: 'badge-outline', paid: 'badge-success', pending: 'badge-warning', not_paid: 'badge-loss', delivered: 'badge-success', failed: 'badge-loss' }[s] || 'badge-secondary');
  A.statusLabel = (s) => ({ active: 'Active', expired: 'Expired', cancelled: 'Cancelled', free: 'Free', paid: 'Paid', pending: 'Pending', not_paid: 'Not Paid', delivered: 'Delivered', failed: 'Failed' }[s] || s);
  A.planBadge = (name) => (/free/i.test(name || '') ? 'badge-outline' : /elite/i.test(name) ? 'badge-warning' : /pro/i.test(name) ? 'badge-default' : 'badge-info');
  A.planName = (id) => { const p = M.plans.find((x) => x.id === id); return p ? p.name : id; };
  A.switchHtml = (on, attrs) => '<button type="button" class="switch' + (on ? ' on' : '') + '" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" ' + (attrs || '') + '></button>';
  A.setSwitch = (btn, on) => { btn.classList.toggle('on', !!on); btn.setAttribute('aria-checked', on ? 'true' : 'false'); };
  A.isOn = (btn) => btn.classList.contains('on');
  A.validation = (msg) => CG.toast({ title: 'Validation', description: msg, variant: 'destructive' });
  A.save = (fn, title) => { try { fn(); CG.toast({ title: title, variant: 'success' }); return true; } catch (e) { CG.toast({ title: 'Failed to save', description: e && e.message ? e.message : 'Please try again.', variant: 'destructive' }); return false; } };
  A.empty = (icon, title, sub, btn) => '<div class="empty"><div class="adm-empty-icon">' + A.icon(icon, 22) + '</div><b>' + esc(title) + '</b>' + esc(sub) + (btn ? '<div class="mt-4"><button class="btn btn-primary" data-act="new">' + A.icon('plus') + ' ' + esc(btn) + '</button></div>' : '') + '</div>';
  A.pager = (page, pages, info, prevLabel, nextLabel) => '<span>Page ' + page + ' of ' + pages + (info ? ' · ' + esc(info) : '') + '</span><span class="flex gap-2"><button class="btn btn-outline btn-sm" data-act="prev"' + (page <= 1 ? ' disabled' : '') + '>' + prevLabel + '</button><button class="btn btn-outline btn-sm" data-act="next"' + (page >= pages ? ' disabled' : '') + '>' + nextLabel + '</button></span>';
  A.paginate = (list, page, per) => { per = per || 10; const pages = Math.max(1, Math.ceil(list.length / per)); page = Math.min(Math.max(1, page), pages); return { page, pages, rows: list.slice((page - 1) * per, page * per), total: list.length }; };
  A.bindTabs = (root, onChange) => { CG.delegate(root, 'click', '[data-tab]', (e, b) => { A.setTab(root, b.dataset.tab); if (onChange) onChange(b.dataset.tab); }); };
  A.setTab = (root, name) => { $$('[data-tab]', root).forEach((t) => t.classList.toggle('active', t.dataset.tab === name)); $$('[data-panel]', root).forEach((p) => (p.hidden = p.dataset.panel !== name)); };
  A.formVal = (form, name) => { const i = form.querySelector('[name="' + name + '"]'); return i ? i.value : ''; };
  A.formSet = (form, name, v) => { const i = form.querySelector('[name="' + name + '"]'); if (i) i.value = v == null ? '' : v; };
  A.busy = (btn, label, fn, ms) => { const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = label; setTimeout(() => { btn.disabled = false; btn.innerHTML = old; fn(); }, ms || 450); };
  // mock enrichments (do not rename existing fields)
  M.users.forEach((u) => { if (u.validityDays == null) u.validityDays = u.subscribedAt && u.endsAt ? Math.round((new Date(u.endsAt) - new Date(u.subscribedAt)) / 86400000) : 0; if (!u.lotSizes) u.lotSizes = { BTC: 0.001, ETH: 0.01, XAUT: 0.001 }; if (!u.featureLimits) u.featureLimits = { paper_trading: 0, live_trading: 0 }; });

  // ---------- CG.chrome['admin-nav'] : secondary "Admin pages" bar ----------
  const NAV = [['Users', '/admin/users'], ['Subscription Plans', '/admin/subscriptions'], ['Menu Pricing', '/admin/menu-pricing'], ['Coupon Codes', '/admin/coupons'], ['User Subscriptions', '/admin/user-subscriptions'], ['Banners', '/admin/banners'], ['Promotional Emails', '/admin/emails']];
  A.navActive = (host) => { const path = (CG.current && CG.current.path) || ''; $$('a[data-path]', host).forEach((a) => { const on = path === a.dataset.path || path.startsWith(a.dataset.path + '/'); a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); };
  CG.chrome['admin-nav'] = function (host) { host.innerHTML = '<nav class="adm-nav" aria-label="Admin pages"><div class="container adm-nav-inner"><span class="adm-nav-label">Admin pages</span>' + NAV.map(([l, p]) => '<a href="#' + p + '" data-path="' + p + '">' + esc(l) + '</a>').join('') + '</div></nav>'; A.navActive(host); };
  CG.chrome['admin-nav:update'] = (host) => A.navActive(host);
  CG.on('route', () => $$('[data-cg="admin-nav"]').forEach(A.navActive));

  // =====================================================================
  // /admin/subscriptions
  // =====================================================================
  CG.register('/admin/subscriptions', {
    init(root) {
      A.hydrateIcons(root);
      const dlg = el(root, 'dialog'), form = dlg.querySelector('form');
      const INTERVALS = [['monthly', 'Monthly'], ['quarterly', 'Quarterly'], ['yearly', 'Yearly']];
      let editing = null, features = [], handle = null;
      // build the three interval blocks once
      el(root, 'intervals').innerHTML = INTERVALS.map(([k, label]) => '<div class="adm-interval"><h4>' + label + '</h4>' +
        '<div class="field"><label class="label">Price</label><input class="input input-sm mono" name="' + k + '.price" type="number" min="0" step="1" value="0"></div>' +
        '<div class="field"><label class="label">Discount Price (₹)</label><input class="input input-sm mono" name="' + k + '.discountPrice" type="number" min="0" step="1" value="0"></div>' +
        '<div class="adm-sublabel">Feature Limits</div>' +
        '<div class="field"><label class="label">Paper Trading Limit <span class="text-muted font-medium">(Per Month)</span></label><input class="input input-sm mono" name="' + k + '.paper" type="number" min="0" step="1" value="0"></div>' +
        '<div class="field" style="margin-bottom:0"><label class="label">Live Trading Limit <span class="text-muted font-medium">(Per Month)</span></label><input class="input input-sm mono" name="' + k + '.live" type="number" min="0" step="1" value="0"></div>' +
        '</div>').join('');
      const renderFeatures = () => { el(root, 'features').innerHTML = features.length ? features.map((f, i) => '<span class="adm-chip">' + esc(f) + '<button type="button" class="adm-chip-x" data-act="rm-feature" data-i="' + i + '" aria-label="Remove ' + esc(f) + '">' + A.icon('x', 11) + '</button></span>').join('') : '<span class="text-xs text-muted">No features added yet</span>'; };
      const renderMenu = (selected) => { const sel = new Set(selected || []); el(root, 'menu-items').innerHTML = M.menuItems.length ? M.menuItems.map((m) => '<label><input type="checkbox" class="checkbox" name="menuItem" value="' + esc(m.displayName) + '"' + (sel.has(m.displayName) ? ' checked' : '') + (m.isActive ? '' : ' title="Inactive menu item"') + '><span class="flex-1">' + esc(m.displayName) + (m.isActive ? '' : ' <span class="badge badge-secondary">Inactive</span>') + '</span><span class="text-xs text-muted">' + esc(m.category) + ' · ' + F.inr(m.price) + '</span></label>').join('') : '<div class="empty">No menu items — add some in Menu Pricing</div>'; updateMenuCount(); };
      const updateMenuCount = () => { const n = $$('[name="menuItem"]:checked', form).length; el(root, 'menu-count').textContent = n + ' of ' + M.menuItems.length + ' menu items linked'; };
      const addFeature = () => { const inp = el(root, 'feature-input'); const v = inp.value.trim(); if (!v) return; if (!features.includes(v)) features.push(v); inp.value = ''; renderFeatures(); inp.focus(); };
      const open = (plan) => {
        editing = plan || null; features = plan ? plan.features.slice() : []; form.reset();
        A.formSet(form, 'name', plan ? plan.name : ''); A.formSet(form, 'description', plan ? plan.description : '');
        INTERVALS.forEach(([k]) => { const iv = plan ? plan[k] || {} : {}; const fl = iv.featureLimits || {}; A.formSet(form, k + '.price', iv.price || 0); A.formSet(form, k + '.discountPrice', iv.discountPrice || 0); A.formSet(form, k + '.paper', fl.paper_trading || 0); A.formSet(form, k + '.live', fl.live_trading || 0); });
        renderFeatures(); renderMenu(plan ? plan.menuItems : []); A.setSwitch(el(root, 'active'), plan ? plan.isActive : true);
        el(root, 'submit').textContent = plan ? 'Update' : 'Create';
        handle = CG.modal.open(dlg, { title: plan ? 'Edit Plan' : 'Create New Plan', description: plan ? 'Update pricing, limits and menu access for ' + plan.name : 'Define a new subscription tier, its pricing and feature limits', size: 'lg' });
        setTimeout(() => form.querySelector('[name="name"]').focus(), 50);
      };
      const submit = (e) => {
        e.preventDefault(); const name = A.formVal(form, 'name').trim();
        if (!name) { A.validation('Plan name is required'); form.querySelector('[name="name"]').focus(); return; }
        const data = { name, description: A.formVal(form, 'description').trim(), features: features.slice(), isActive: A.isOn(el(root, 'active')), menuItems: $$('[name="menuItem"]:checked', form).map((c) => c.value) };
        INTERVALS.forEach(([k]) => { data[k] = { price: +A.formVal(form, k + '.price') || 0, discountPrice: +A.formVal(form, k + '.discountPrice') || 0, featureLimits: { paper_trading: +A.formVal(form, k + '.paper') || 0, live_trading: +A.formVal(form, k + '.live') || 0 } }; });
        const ok = A.save(() => { if (editing) Object.assign(editing, data); else M.plans.push(Object.assign({ id: A.uid('p') }, data)); CG.emit('plans:changed', M.plans); }, editing ? 'Updated' : 'Created');
        if (ok) { handle && handle.close(); render(); }
      };
      form.addEventListener('submit', submit);
      el(root, 'feature-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addFeature(); } });
      CG.delegate(form, 'click', '[data-act="add-feature"]', addFeature);
      CG.delegate(form, 'click', '[data-act="rm-feature"]', (e, b) => { features.splice(+b.dataset.i, 1); renderFeatures(); });
      CG.delegate(form, 'click', '[data-act="cancel"]', () => handle && handle.close());
      CG.delegate(form, 'change', '[name="menuItem"]', updateMenuCount);
      el(root, 'active').addEventListener('click', (e) => A.setSwitch(e.currentTarget, !A.isOn(e.currentTarget)));
      CG.delegate(root, 'click', '[data-act="new"]', () => open(null));
      CG.delegate(root, 'click', '[data-act="edit"]', (e, b) => open(M.plans.find((p) => p.id === b.dataset.id)));
      CG.delegate(root, 'click', '[data-act="toggle"]', (e, b) => { const p = M.plans.find((x) => x.id === b.dataset.id); if (!p) return; p.isActive = !p.isActive; A.save(() => CG.emit('plans:changed', M.plans), 'Updated'); render(); });
      const priceCell = (iv) => { if (!iv) return '<span class="text-muted">—</span>'; const hasDisc = iv.discountPrice > 0 && iv.discountPrice < iv.price; return '<span class="mono font-medium">' + F.inr(hasDisc ? iv.discountPrice : iv.price) + '</span>' + (hasDisc ? '<span class="adm-strike mono">' + F.inr(iv.price) + '</span><div class="text-2xs text-profit">' + Math.round((1 - iv.discountPrice / iv.price) * 100) + '% off</div>' : '') + '<div class="text-2xs text-muted">' + (iv.featureLimits ? (iv.featureLimits.paper_trading || '∞') + ' paper · ' + (iv.featureLimits.live_trading || (iv.price ? '∞' : 0)) + ' live' : '') + '</div>'; };
      const render = () => {
        el(root, 'count').textContent = 'All Plans (' + M.plans.length + ')';
        const t = el(root, 'table');
        if (!M.plans.length) { t.innerHTML = A.empty('package', 'No Plans Yet', 'Create your first subscription plan', 'Create Plan'); return; }
        t.innerHTML = '<table class="table"><thead><tr><th>Name</th><th>Monthly</th><th>Quarterly</th><th>Yearly</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>' + M.plans.map((p) => '<tr><td><div class="font-medium">' + esc(p.name) + '</div><div class="text-xs text-muted" style="max-width:280px">' + esc(p.description || '') + '</div><div class="text-2xs text-muted mt-1">' + (p.features || []).length + ' features · ' + (p.menuItems || []).length + ' menu items</div></td><td>' + priceCell(p.monthly) + '</td><td>' + priceCell(p.quarterly) + '</td><td>' + priceCell(p.yearly) + '</td><td><div class="flex items-center gap-2">' + A.switchHtml(p.isActive, 'data-act="toggle" data-id="' + p.id + '" aria-label="Toggle plan active"') + '<span class="text-xs ' + (p.isActive ? '' : 'text-muted') + '">' + (p.isActive ? 'Active' : 'Inactive') + '</span></div></td><td><div class="adm-actions"><button class="adm-icon-btn" title="Edit plan" data-act="edit" data-id="' + p.id + '">' + A.icon('pencil') + '</button></div></td></tr>').join('') + '</tbody></table>';
      };
      this._render = render;
    },
    show() { this._render && this._render(); }
  });

  // =====================================================================
  // /admin/menu-pricing
  // =====================================================================
  CG.register('/admin/menu-pricing', {
    init(root) {
      A.hydrateIcons(root);
      const dlg = el(root, 'dialog'), form = dlg.querySelector('form'); let editing = null, handle = null;
      const open = (item) => { editing = item || null; form.reset(); A.formSet(form, 'displayName', item ? item.displayName : ''); A.formSet(form, 'category', item ? item.category : ''); A.formSet(form, 'price', item ? item.price : 0); A.setSwitch(el(root, 'active'), item ? item.isActive : true); el(root, 'submit').textContent = item ? 'Update' : 'Create'; handle = CG.modal.open(dlg, { title: item ? 'Edit Menu Item' : 'New Menu Item', description: item ? 'Change the name, category or price of ' + item.displayName : 'Menu items can be linked to subscription plans' }); setTimeout(() => form.querySelector('[name="displayName"]').focus(), 50); };
      form.addEventListener('submit', (e) => {
        e.preventDefault(); const name = A.formVal(form, 'displayName').trim();
        if (!name) { A.validation('Display Name is required'); form.querySelector('[name="displayName"]').focus(); return; }
        const data = { displayName: name, category: A.formVal(form, 'category').trim() || 'General', price: +A.formVal(form, 'price') || 0, isActive: A.isOn(el(root, 'active')) };
        const ok = A.save(() => { if (editing) { const old = editing.displayName; Object.assign(editing, data); if (old !== data.displayName) M.plans.forEach((p) => { p.menuItems = (p.menuItems || []).map((m) => (m === old ? data.displayName : m)); }); } else M.menuItems.push(Object.assign({ id: A.uid('m') }, data)); CG.emit('menuItems:changed', M.menuItems); }, editing ? 'Updated' : 'Created');
        if (ok) { handle && handle.close(); render(); }
      });
      CG.delegate(form, 'click', '[data-act="cancel"]', () => handle && handle.close());
      el(root, 'active').addEventListener('click', (e) => A.setSwitch(e.currentTarget, !A.isOn(e.currentTarget)));
      CG.delegate(root, 'click', '[data-act="new"]', () => open(null));
      CG.delegate(root, 'click', '[data-act="edit"]', (e, b) => open(M.menuItems.find((m) => m.id === b.dataset.id)));
      CG.delegate(root, 'click', '[data-act="toggle"]', (e, b) => { const m = M.menuItems.find((x) => x.id === b.dataset.id); if (!m) return; m.isActive = !m.isActive; A.save(() => CG.emit('menuItems:changed', M.menuItems), 'Updated'); render(); });
      const render = () => {
        el(root, 'count').textContent = 'All Menu Items (' + M.menuItems.length + ')';
        const t = el(root, 'table');
        if (!M.menuItems.length) { t.innerHTML = A.empty('tag', 'No Menu Items', 'Add menu items that can be linked to plans', 'Add Item'); return; }
        t.innerHTML = '<table class="table"><thead><tr><th>Display Name</th><th>Category</th><th class="r">Price (₹)</th><th>Linked plans</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>' + M.menuItems.map((m) => { const linked = M.plans.filter((p) => (p.menuItems || []).includes(m.displayName)).length; return '<tr><td class="font-medium">' + esc(m.displayName) + '</td><td><span class="badge badge-secondary">' + esc(m.category) + '</span></td><td class="r mono">' + (m.price ? F.inr(m.price) : '<span class="text-muted">Free</span>') + '</td><td class="text-xs text-muted">' + linked + ' plan' + (linked === 1 ? '' : 's') + '</td><td><div class="flex items-center gap-2">' + A.switchHtml(m.isActive, 'data-act="toggle" data-id="' + m.id + '" aria-label="Toggle item active"') + '<span class="text-xs ' + (m.isActive ? '' : 'text-muted') + '">' + (m.isActive ? 'Active' : 'Inactive') + '</span></div></td><td><div class="adm-actions"><button class="adm-icon-btn" title="Edit item" data-act="edit" data-id="' + m.id + '">' + A.icon('pencil') + '</button></div></td></tr>'; }).join('') + '</tbody></table>';
      };
      this._render = render;
    },
    show() { this._render && this._render(); }
  });
