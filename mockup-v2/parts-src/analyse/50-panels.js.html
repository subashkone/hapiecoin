  function decodeShare(code) { try { const o = JSON.parse(unb64u(code)); if (!o || !Array.isArray(o.l) || !o.l.length || !CG.ASSETS[o.a]) return null; const legs = o.l.map((x) => ({ id: CG.newLegId(), type: x[0], side: x[1], strike: +x[2], expiry: x[3], lots: +x[4] || 1, price: +x[5] || 0, iv: (x[0] === 'FUTURE' ? 0 : (CG.quote(o.a, CG.EXPIRIES.includes(x[3]) ? x[3] : AN.expiry, +x[2], x[0]).markIv)), status: 'OPEN', isAdjustment: false, symbol: M.symbolOf(x[0], o.a, +x[2], x[3]), asset: o.a })); if (!legs.every((l) => ['CALL', 'PUT', 'FUTURE'].includes(l.type) && ['BUY', 'SELL'].includes(l.side))) return null; return { asset: o.a, legs, name: o.n || '' }; } catch (e) { return null; } }
  async function copyText(t) { try { await navigator.clipboard.writeText(t); return true; } catch (e) { try { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (x) { return false; } } }
  function openShare() {
    const legs = activeLegs(); if (!legs.length) { CG.toast({ title: 'Nothing to share', description: 'Add legs to the strategy first', variant: 'destructive' }); return; }
    const link = baseUrl() + '#/s/' + shareCode(); const a = baseAnalysis();
    els.share.innerHTML = '<div class="an-share-wrap"><p class="text-sm text-muted">Anyone with this link sees a preview of the strategy and can open it in Analyse. Legs, lots and entry prices are encoded in the link itself — nothing is uploaded.</p><div class="lnk"><input class="input input-sm" readonly value="' + esc(link) + '" data-share-input><button class="btn btn-primary btn-sm" data-share-copy>' + ic('copy') + 'Copy</button></div><div class="an-share-legs">' + legs.map((l) => '<span><b class="' + (l.side === 'BUY' ? 'text-buy' : 'text-sell') + '">' + l.side + '</b><span>' + (l.lots || 1) + ' × ' + (l.symbol || M.symbolOf(l.type, AN.asset, l.strike, l.expiry)) + '</span><span class="text-muted">@ ' + F.num(l.price || 0, 1) + '</span></span>').join('') + '</div>' + (a ? '<div class="an-kv mt-3"><span>max profit <b class="text-profit">' + (isFinite(a.maxProfit) ? smoney(a.maxProfit) : 'Unlimited') + '</b></span><span>max loss <b class="text-loss">' + (isFinite(a.maxLoss) ? smoney(a.maxLoss) : 'Unlimited') + '</b></span><span>POP <b>' + (a.pop == null ? '—' : Math.round(a.pop * 100) + '%') + '</b></span></div>' : '') + '</div>';
    const h = CG.modal.open(els.share, { title: 'Share strategy', description: (AN.name || 'Custom strategy') + ' · ' + AN.asset + ' · ' + legs.length + ' legs' });
    els.share.onclick = async (e) => { if (!e.target.closest('[data-share-copy]')) return; const ok = await copyText(link); CG.toast(ok ? { title: 'Link copied', description: 'Share it to load this strategy in Analyse', variant: 'success' } : { title: 'Copy blocked by the browser', description: 'Select the link and copy it manually', variant: 'destructive' }); if (ok) h.close(); };
    copyText(link).then((ok) => { if (ok) CG.toast({ title: 'Link copied to clipboard', description: link.length > 70 ? link.slice(0, 70) + '…' : link, variant: 'success' }); });
  }
  function applyShared(d) { AN.asset = d.asset; st.asset = d.asset; AN.legs = d.legs; AN.name = d.name; AN.strategyId = null; AN.targetPrice = null; AN.targetDays = 0; const e = d.legs.find((l) => CG.EXPIRIES.includes(l.expiry)); if (e) { AN.expiry = e.expiry; st.expiry = e.expiry; } CG.saveState(); CG.emit('analyse:legs-changed', AN.legs); }
  function renderSharePage(root, params) {
    const host = root.querySelector('#an-share-page'); const d = decodeShare(params.code || '');
    if (!d) { host.innerHTML = '<div class="an-share-card"><span class="micro">Shared strategy</span><h2>This link is not valid</h2><p class="text-muted mt-2">The strategy code could not be decoded. Ask for a fresh link or build the strategy yourself.</p><div class="flex gap-2 mt-4"><a class="btn btn-primary" href="#/analyse">Open Analyse</a><a class="btn btn-outline" href="#/">Home</a></div></div>'; return; }
    if (st.loggedIn) { applyShared(d); CG.toast({ title: 'Strategy loaded from link', description: (d.name || 'Custom strategy') + ' · ' + d.legs.length + ' legs · ' + d.asset, variant: 'success' }); CG.navigate('/analyse', { replace: true }); return; }
    const a = CG.analyze(d.legs, d.asset, {}); const exp = d.legs.find((l) => l.expiry);
    host.innerHTML = '<div class="an-share-card"><span class="micro">Shared strategy · ' + esc(d.asset) + (exp ? ' · ' + esc(expShort(exp.expiry)) : '') + '</span><h2>' + esc(d.name || 'Custom strategy') + '</h2><div class="legs">' + d.legs.map((l) => '<div><span class="' + (l.side === 'BUY' ? 'text-buy' : 'text-sell') + '">' + l.side + '</span><span>' + esc(l.symbol) + '</span><span class="r">' + l.lots + ' lots</span><span class="r text-muted">@ ' + F.num(l.price, 1) + '</span></div>').join('') + '</div><div class="tiles"><div><span class="micro">Max profit</span><div class="v text-profit">' + (isFinite(a.maxProfit) ? smoney(a.maxProfit) : 'Unlimited') + '</div></div><div><span class="micro">Max loss</span><div class="v text-loss">' + (isFinite(a.maxLoss) ? smoney(a.maxLoss) : 'Unlimited') + '</div></div><div><span class="micro">POP</span><div class="v">' + (a.pop == null ? '—' : Math.round(a.pop * 100) + '%') + '</div></div></div><p class="text-muted text-xs">Sign in to open this strategy in the Analyse workspace with the live chain, payoff and scenarios.</p><div class="flex gap-2 mt-4"><button class="btn btn-primary" data-share-open>Open in Analyse</button><a class="btn btn-outline" href="#/auth">Sign in</a></div></div>';
    host.onclick = (e) => { if (e.target.closest('[data-share-open]')) { applyShared(d); CG.toast({ title: 'Strategy loaded from link', description: 'Sign in to continue to Analyse' }); CG.navigate('/analyse'); } };
  }
  CG.register('/s/:code', { show(root, params) { renderSharePage(root, params); } });
  Object.assign(M, { renderScenarios, renderGreeks, renderVol, renderStructure, renderLadder, openShare, shareCode, decodeShare });

  // ======================================================================
  // registration / wiring
  // ======================================================================
  let paletteDone = false; const tryPalette = () => { if (!paletteDone && CG.palette && typeof CG.palette.register === 'function') { paletteDone = true; M.registerPalette(); } setTimeout(M.dedupePalette, 150); };
  CG.register('/analyse', {
    init(root) {
      M.root = root;
      Object.assign(els, {
        shell: root.querySelector('#an-shell'), left: root.querySelector('#an-left'), right: root.querySelector('#an-right'), divider: root.querySelector('#an-divider'), lptabs: root.querySelector('#an-lptabs'), rptabs: root.querySelector('#an-rptabs'), leftPanels: root.querySelector('#analyse-left-panels'), chainPanel: root.querySelector('.an-chain-panel'), rightBody: root.querySelector('#an-right-body'),
        expStrip: root.querySelector('.an-expiry-strip'), exp: root.querySelector('#an-expiries'), tools: root.querySelector('.an-chain-tools'), range: root.querySelector('#an-range'), greeksBtn: root.querySelector('#an-greeks-toggle'), findDelta: root.querySelector('#an-finddelta'), live: root.querySelector('#an-live-btn'), wrap: root.querySelector('#an-chain-wrap'), table: root.querySelector('#an-chain'), foot: root.querySelector('#an-chain-foot'), cs: root.querySelector('#an-colsettings'), optinfo: root.querySelector('#an-optinfo'), share: root.querySelector('#an-share'), findDlg: root.querySelector('#an-finddelta-dlg'),
        lotInfo: root.querySelector('#an-lot-info'), basisInfo: root.querySelector('#an-basis-info'), stratInfo: root.querySelector('#an-strat-info'),
        payoff: root.querySelector('#an-payoff'), scenarios: root.querySelector('#an-scenarios'), greeks: root.querySelector('#an-greeks'), vol: root.querySelector('#an-vol'), structure: root.querySelector('#an-structure'), ladder: root.querySelector('#an-ladder'),
        tiles: root.querySelector('#an-tiles'), astrip: root.querySelector('#an-astrip'), legend: root.querySelector('#an-legend'), legendDate: root.querySelector('#an-legend-date'), chips: root.querySelector('#an-chips'), layersBtn: root.querySelector('#an-layers-btn'), zoomLabel: root.querySelector('#an-zoom-label'), chartHost: root.querySelector('#an-chart-host'), gstrip: root.querySelector('#an-greeks-strip'),
        tpTitle: root.querySelector('#an-tp-title'), tpPct: root.querySelector('#an-tp-pct'), tpVal: root.querySelector('#an-tp-val'), tpRange: root.querySelector('#an-tp-range'), tpKnob: root.querySelector('#an-tp-knob'), tpFill: root.querySelector('#an-tp-fill'), tpSpot: root.querySelector('#an-tp-spot'), tpTicks: root.querySelector('#an-tp-ticks'),
        tdTitle: root.querySelector('#an-td-title'), tdVal: root.querySelector('#an-td-val'), tdLeft: root.querySelector('#an-td-left'), tdRange: root.querySelector('#an-td-range'), tdKnob: root.querySelector('#an-td-knob'), tdFill: root.querySelector('#an-td-fill'), tdTicks: root.querySelector('#an-td-ticks')
      });
      els.tbody = els.table.querySelector('tbody');
      M.fillIcons(root); M.setLive(AN.mode === 'static' ? 'static' : 'live'); M.applyDensity();
      if (st.analyseSplit) root.style.setProperty('--an-split', st.analyseSplit + '%');
      els.shell.dataset.collapse = st.analyseCollapse === 'left' || st.analyseCollapse === 'right' ? st.analyseCollapse : '';
      // tabs / collapse / mobile toggle / divider
      els.lptabs.addEventListener('click', (e) => { const b = e.target.closest('[data-lptab]'); if (b) M.setLeftTab(b.dataset.lptab); });
      root.addEventListener('click', (e) => {
        const b = e.target.closest('[data-rptab]'); if (b) { M.setRightTab(b.dataset.rptab); return; }
        const c = e.target.closest('[data-collapse]'); if (c && c.tagName === 'BUTTON') { M.setCollapse(c.dataset.collapse === 'restore' ? '' : c.dataset.collapse); return; }
        if (e.target.closest('#an-share-btn')) { openShare(); return; }
        const mv = e.target.closest('[data-mobile-view]'); if (mv) { els.shell.dataset.mobile = mv.dataset.mobileView; CG.$$('[data-mobile-view]', root).forEach((x) => x.classList.toggle('active', x === mv)); if (mv.dataset.mobileView === 'analysis') M.renderRight(); else M.scrollToAtm(); }
      });
      els.divider.addEventListener('mousedown', (e) => { if (e.target.closest('[data-collapse]')) return; e.preventDefault(); els.divider.classList.add('on'); const rect = els.shell.getBoundingClientRect(); const move = (ev) => { const pct = Math.min(70, Math.max(35, ((ev.clientX - rect.left) / rect.width) * 100)); root.style.setProperty('--an-split', pct.toFixed(1) + '%'); }; const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); els.divider.classList.remove('on'); st.analyseSplit = parseFloat(root.style.getPropertyValue('--an-split')) || 55; CG.saveState(); M.renderChart(); M.updateVis(); }; document.addEventListener('mousemove', move); document.addEventListener('mouseup', up); });
      els.divider.addEventListener('dblclick', () => { st.analyseSplit = 55; root.style.setProperty('--an-split', '55%'); CG.saveState(); M.renderChart(); CG.toast({ title: 'Split reset', description: 'Chain 55% · analysis 45%' }); });
      new MutationObserver(() => { M.setLeftTab(st.analyseTab || 'chain', true); }).observe(els.leftPanels, { childList: true });
      // expiry strip / chain tools
      els.expStrip.addEventListener('click', (e) => { const x = e.target.closest('[data-exp]'); if (x) { M.setExpiry(x.dataset.exp); return; } const s = e.target.closest('[data-exp-scroll]'); if (s) els.exp.scrollBy({ left: 220 * (+s.dataset.expScroll), behavior: 'smooth' }); });
      els.tools.addEventListener('click', (e) => {
        const rg = e.target.closest('[data-range]'); if (rg) { M.setRange(rg.dataset.range); return; }
        if (e.target.closest('#an-greeks-toggle')) { M.setGreeksCols(!M.greeksShown()); return; }
        const fd = e.target.closest('[data-delta]'); if (fd) { M.findDelta(+fd.dataset.delta); return; }
        if (e.target.closest('#an-live-btn')) { M.toggleLive(); return; }
        if (e.target.closest('#an-colsettings-btn')) M.openColSettings();
      });
      M.bindCs();
      els.optinfo.addEventListener('click', (e) => { const b = e.target.closest('[data-oi-act]'); if (!b) return; const lots = +(els.optinfo.querySelector('[data-oi-lots]') || {}).value || M.curLots(); M.setLots(lots); if (M.addLeg(els.optinfo.dataset.type, b.dataset.oiAct, +els.optinfo.dataset.strike, lots)) CG.modal.closeAll(); });
      // chain interactions
      els.wrap.addEventListener('click', (e) => {
        const b = e.target.closest('[data-act]'); if (!b) return; const tr = b.closest('tr'); const ctl = b.closest('.an-ctl'); if (!tr || !ctl) return; const strike = +tr.dataset.strike; const type = ctl.dataset.type; const act = b.dataset.act;
        if (act === 'INFO') { M.openOptInfo(type, strike); return; }
        if (act === 'LOTDN') { M.stepLots(-1); return; } if (act === 'LOTUP') { M.stepLots(1); return; }
        if (act === 'LOTMENU') { const m = CG.menu(b, '<div class="menu-label">Lots (× ' + M.lotSize() + ' ' + AN.asset + ')</div>' + M.LOTS.map((n) => '<button class="menu-item mono" data-lots="' + n + '">' + n + (n === M.curLots() ? ' ✓' : '') + '</button>').join(''), { align: 'left' }); m.addEventListener('click', (ev) => { const x = ev.target.closest('[data-lots]'); if (x) M.setLots(+x.dataset.lots); }); return; }
        M.addLeg(type, act, strike, M.curLots());
      });
      let raf = null; els.wrap.addEventListener('scroll', () => { if (raf) return; raf = requestAnimationFrame(() => { raf = null; M.updateVis(); }); });
      els.wrap.addEventListener('mouseover', (e) => { const tr = e.target.closest('tr[data-strike]'); if (tr && M.hl.get() != null && +tr.dataset.strike !== M.hl.get()) M.setHl(+tr.dataset.strike); });
      M.registerShortcuts();
      M.bindPayoff(); bindScenarios(); bindLadder();
      els.rightBody.addEventListener('click', (e) => { const r = e.target.closest('rect[data-exp]'); if (r) M.setExpiry(r.dataset.exp); });
      // ---------- shared events ----------
      CG.on('asset', (a) => { if (!a || !CG.ASSETS[a]) return; if (AN.asset === a) return; AN.asset = a; st.asset = a; AN.targetPrice = null; M.hl.set(null); if (M.isActive()) { M.renderExpiries(); M.renderChain(); M.renderRight(); M.emitStats(); } });
      CG.on('tick', () => { if (!M.isActive()) return; if (AN.mode === 'live') M.updateChain(); M.renderRight(); M.emitStats(); });
      CG.on('currency-settings-changed', () => { if (!M.isActive()) return; M.renderChain(true); M.renderRight(); });
      CG.on('lot-sizes-changed', () => { if (!M.isActive()) return; M.renderChain(true); M.renderRight(); });
      CG.on('pnl-basis-changed', () => { if (M.isActive()) { M.renderChain(true); M.renderRight(); } });
      CG.on('analyse:legs-changed', () => { if (AN.asset && CG.ASSETS[AN.asset] && AN.expiry && CG.EXPIRIES.includes(AN.expiry)) { const ch = M.chain(); if (ch && (ch.asset !== AN.asset || ch.expiry !== AN.expiry)) { st.asset = AN.asset; st.expiry = AN.expiry; if (M.isActive()) M.renderChain(); } } if (!M.isActive()) return; M.renderPills(); M.renderExpiries(); M.renderCounts(); M.renderRight(); });
      CG.on('analyse:strategies-changed', () => { if (M.isActive()) M.renderCounts(); });
      CG.on('analyse:set-tab', (name) => M.setLeftTab(name));
      CG.on('density', (v) => { if (v) st.density = v; M.applyDensity(); if (M.isActive()) { M.updateVis(); if ((st.analyseRightTab || 'payoff') === 'ladder') M.renderLadder(); } });
      CG.on('theme', () => { if (M.isActive()) setTimeout(M.renderRight, 30); });
      CG.on('route', tryPalette);
      window.addEventListener('cg-tour-set-tab', (e) => { if (e && e.detail) M.setLeftTab(typeof e.detail === 'string' ? e.detail : e.detail.tab); });
      let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (M.isActive()) { M.measureTop(); M.renderExpiries(); M.renderRight(); } }, 120); });
      if (window.ResizeObserver) ['[data-cg="app-header"]', '[data-cg="plan-banner"]', '[data-cg="portfolio-bar"]'].forEach((s) => { const el = root.querySelector(s); if (el) new ResizeObserver(() => M.measureTop()).observe(el); });
      tryPalette();
    },
    show(root, params, query) {
      if (CG.ASSETS[st.asset] && st.asset !== AN.asset) { AN.asset = st.asset; AN.targetPrice = null; }
      if (CG.EXPIRIES.includes(st.expiry) && st.expiry !== AN.expiry) AN.expiry = st.expiry;
      M.measureTop(); M.applyDensity(); M.renderExpiries(); M.renderChain(); M.renderCounts();
      M.setLeftTab((query && query.tab) || st.analyseTab || 'chain', true);
      M.setRightTab((query && query.panel) || st.analyseRightTab || 'payoff');
      M.emitStats(); tryPalette();
      setTimeout(() => { M.measureTop(); M.scrollToAtm(); M.renderExpiries(); }, 30);
    }
  });
})();
