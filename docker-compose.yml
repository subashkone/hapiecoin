name: hapiecoin
services:
  postgres:
    # Pinned by digest (GAPS #30): timescaledb 2.29.2 on PostgreSQL 17.11 as pulled on 08 Sep 2026. Bump deliberately.
    image: timescale/timescaledb:latest-pg17@sha256:bc8527e62f70f0766b29515077965025872fabb5349db421565f69ee273baf2d
    container_name: hapiecoin-postgres
    environment:
      POSTGRES_USER: hapiecoin
      POSTGRES_PASSWORD: hapiecoin
      POSTGRES_DB: hapiecoin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapiecoin -d hapiecoin"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: hapiecoin-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
