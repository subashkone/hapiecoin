    <div class="acct-head">
      <div><h1>My Subscription</h1><p class="acct-sub">Choose a plan to unlock features</p></div>

<section class="screen" data-route="/referrals" data-title="My Referrals" data-auth="user">

      <div><h1>My Referrals</h1><p class="acct-sub">Share &amp; Earn</p></div>
    </div>

      <div class="card" id="ref-how"></div>
      <div class="ref-stats" id="ref-stats"></div>
    </div>

  </div>

        CG.$$('[data-ico]', root).forEach((el) => { el.innerHTML = I(el.dataset.ico); });
        CG.delegate(root, 'click', '#ref-copy', () => copyText(R().link));
        CG.delegate(root, 'click', '#ref-share', share);
        CG.delegate(root, 'click', '#ref-code', () => copyText(R().code));
        CG.delegate(root, 'click', '#ref-link', (e, t) => { t.select(); });
        const bind = (id, key, ev) => CG.$('#' + id, root).addEventListener(ev || 'input', (e) => { F[key] = e.target.value; page = 1; renderTable(); });
        bind('ref-q', 'q'); bind('ref-status', 'status', 'change'); bind('ref-plan', 'plan', 'change'); bind('ref-from', 'from', 'change'); bind('ref-to', 'to', 'change');
        CG.delegate(root, 'click', '#ref-clear', () => { F.q = F.status = F.plan = F.from = F.to = ''; ['ref-q', 'ref-status', 'ref-plan', 'ref-from', 'ref-to'].forEach((id) => (CG.$('#' + id, root).value = '')); page = 1; renderTable(); CG.toast({ title: 'Filters cleared' }); });
        CG.delegate(root, 'click', '[data-pager="referrals"] [data-pg]', (e, t) => { if (t.disabled) return; page += t.dataset.pg === 'next' ? 1 : -1; renderTable(); });
      },
      show() { page = 1; renderAll(); }
    });
  })();
})();
</script>
