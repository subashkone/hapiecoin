<!-- ===== /analyse workspace: shell + options chain + right analysis pane (payoff / analytics / greeks / P&L table) ===== -->
<section class="screen" data-route="/analyse" data-title="Analyse" data-auth="user">
  <div data-cg="app-header" data-variant="analyse"></div>
  <div data-cg="plan-banner"></div>
  <div class="an-shell" id="an-shell" data-mobile="chain">
    <div class="an-mobile-bar"><div class="tabs"><button class="tab active" data-mobile-view="chain">Chain</button><button class="tab" data-mobile-view="analysis">Analysis</button></div></div>
    <div class="an-left" id="an-left">
      <div class="an-lptabs" role="tablist" id="an-lptabs">
        <button class="an-tab active" role="tab" data-lptab="chain" data-tour="options-chain"><i data-icon="link"></i>Options Chain</button>
        <button class="an-tab" role="tab" data-lptab="strategy" data-tour="builder-tab"><i data-icon="layers"></i>Strategy</button>
        <button class="an-tab" role="tab" data-lptab="paper" data-tour="paper-tab"><i data-icon="file"></i>Paper Trades</button>
        <button class="an-tab" role="tab" data-lptab="live"><i data-icon="radio"></i>Live Trades</button>
      </div>
      <div id="analyse-left-panels" class="an-left-panels">
        <div class="lp-panel an-chain-panel" data-tab="chain">
          <div class="an-expiry-strip">
            <button class="an-scroll-btn" data-exp-scroll="-1" title="Previous expiries" aria-label="Previous">‹</button>
            <div class="an-expiries" id="an-expiries"></div>
            <button class="an-scroll-btn" data-exp-scroll="1" title="Next expiries" aria-label="Next">›</button>
            <button class="an-live-btn live" id="an-live-btn" title="Live prices"><i data-icon="bolt"></i><span>Live</span></button>
            <button class="an-gear" id="an-colsettings-btn" title="Column settings" aria-label="Column settings"><i data-icon="gear"></i></button>
          </div>
          <div class="an-chain-wrap" id="an-chain-wrap" tabindex="0" aria-label="Options chain (arrow keys move the highlighted strike, B / S add legs, Shift for puts)">
            <table class="an-chain" id="an-chain"><colgroup></colgroup><thead></thead><tbody></tbody></table>
          </div>
          <div class="an-chain-foot" id="an-chain-foot"></div>
        </div>
      </div>
    </div>
    <div class="an-divider" id="an-divider" title="Drag to resize"></div>
    <div class="an-right" id="an-right" data-tour="payoff-panel">
      <div class="an-rptabs" role="tablist">
        <button class="an-tab active" role="tab" data-rptab="payoff"><i data-icon="chart"></i>Payoff Diagram</button>
        <button class="an-tab" role="tab" data-rptab="analytics"><i data-icon="activity"></i>Analytics</button>
        <button class="an-tab" role="tab" data-rptab="greeks"><i data-icon="pie"></i>Greeks</button>
        <button class="an-tab" role="tab" data-rptab="pnl"><i data-icon="table"></i>P&amp;L Table</button>
      </div>
      <div class="an-right-body" id="an-right-body">
        <div class="rp-panel" data-tab="payoff" id="an-payoff">
          <div class="an-tiles">
            <div class="an-tile"><div class="an-tile-h"><i data-icon="trendup" class="text-profit"></i><span>Max Profit</span></div><div class="an-tile-v text-profit" id="an-t-maxp">—</div></div>
            <div class="an-tile"><div class="an-tile-h"><i data-icon="trenddown" class="text-loss"></i><span>Max Loss</span></div><div class="an-tile-v text-loss" id="an-t-maxl">—</div></div>
            <div class="an-tile"><div class="an-tile-h"><i data-icon="dollar"></i><span>Net Premium</span></div><div class="an-tile-v" id="an-t-prem">—</div><div class="an-tile-s" id="an-t-prem-s"></div></div>
            <div class="an-tile an-tile-be"><div class="an-tile-h"><i data-icon="target"></i><span>Breakevens</span></div><div class="an-tile-v" id="an-t-be">None</div></div>
          </div>
          <div class="card an-chart-card">
            <div class="an-chart-top">
              <div class="an-legend" id="an-legend">
                <button class="lg" data-layer="expiry" title="Toggle Expiry P&amp;L"><span class="sw line" style="background:hsl(var(--profit))"></span>On Expiry</button>
                <button class="lg" data-layer="target" title="Toggle Target Date P&amp;L"><span class="sw line" style="background:#3b82f6"></span>On Target Date</button>
                <button class="lg" data-layer="fill" title="Toggle Profit / Loss Fill"><span class="sw dot" style="background:hsl(var(--profit) / 0.35)"></span>Profit</button>
                <button class="lg" data-layer="fill" title="Toggle Profit / Loss Fill"><span class="sw dot" style="background:hsl(var(--loss) / 0.35)"></span>Loss</button>
                <button class="lg" data-layer="oi" title="Toggle Open Interest"><span class="sw dot" style="background:hsl(var(--loss) / 0.45)"></span>Call OI</button>
                <button class="lg" data-layer="oi" title="Toggle Open Interest"><span class="sw dot" style="background:hsl(var(--profit) / 0.45)"></span>Put OI</button>
              </div>
              <div class="an-chart-ctl">
                <div class="an-zoom"><button data-zoom="in" title="Zoom In" aria-label="Zoom In"><i data-icon="zoomin"></i></button><button class="mono" data-zoom="reset" title="Reset Zoom" id="an-zoom-label">100%</button><button data-zoom="out" title="Zoom Out" aria-label="Zoom Out"><i data-icon="zoomout"></i></button></div>
                <button class="an-layers-btn" id="an-layers-btn" title="Toggle Layers"><i data-icon="layers"></i>Layers</button>
              </div>
            </div>
            <div class="an-sd-row" id="an-sd-row"></div>
            <div class="an-chart-host" id="an-chart-host"></div>
            <div class="an-chart-foot" id="an-chart-foot"></div>
          </div>
          <div class="an-sliders">
            <div class="card an-slider-card">
              <div class="an-sl-h"><span id="an-tp-title">BTC TARGET</span><span class="badge" id="an-tp-pct">+0.0%</span></div>
              <div class="an-sl-mid"><button class="an-step" data-tp="-1" title="Decrease target price" aria-label="Decrease">−</button><span class="an-sl-val mono" id="an-tp-val">—</span><button class="an-step" data-tp="1" title="Increase target price" aria-label="Increase">+</button></div>
              <input type="range" class="an-range" id="an-tp-range" min="0" max="100" step="1" value="50" aria-label="Target price">
              <div class="an-sl-minmax mono"><span id="an-tp-min">—</span><span id="an-tp-max">—</span></div>
            </div>
            <div class="card an-slider-card">
              <div class="an-sl-h"><span id="an-td-title">TODAY</span><span class="an-info" title="Move the target date to see the On Target Date P&amp;L curve at a future date (time decay applied)."><i data-icon="info"></i></span></div>
              <div class="an-sl-mid"><button class="an-step" data-td="-1" title="Previous day" aria-label="Previous day">‹</button><span class="an-sl-val" id="an-td-val">—</span><button class="an-step" data-td="1" title="Next day" aria-label="Next day">›</button></div>
              <input type="range" class="an-range" id="an-td-range" min="0" max="30" step="1" value="0" aria-label="Target date">
              <div class="an-sl-minmax"><span>Today</span><span id="an-td-max">Expiry</span></div>
            </div>
          </div>
        </div>
        <div class="rp-panel" data-tab="analytics" id="an-analytics" hidden></div>
        <div class="rp-panel" data-tab="greeks" id="an-greeks" hidden></div>
        <div class="rp-panel" data-tab="pnl" id="an-pnl" hidden></div>
      </div>
    </div>
  </div>
  <!-- Column Settings dialog -->
  <div id="an-colsettings" hidden>
    <div class="an-cs">
      <div class="an-cs-head">
        <div class="tabs"><button class="tab active" data-cstab="show">Show / Hide</button><button class="tab" data-cstab="reorder">Reorder</button></div>
        <div class="an-cs-quick"><button class="btn btn-outline btn-xs" data-csq="essentials">Essentials</button><button class="btn btn-outline btn-xs" data-csq="all">Show All</button><button class="btn btn-outline btn-xs" data-csq="none">Hide all</button><button class="btn btn-ghost btn-xs" data-csq="reset">Reset</button></div>
      </div>
      <div class="an-cs-body" data-cspanel="show" id="an-cs-show"></div>
      <div class="an-cs-body" data-cspanel="reorder" id="an-cs-reorder" hidden></div>
      <div class="an-cs-foot"><span class="text-xs text-muted" id="an-cs-hint">Changes are saved automatically.</span><button class="btn btn-primary btn-sm" data-cg-close>Done</button></div>
    </div>
  </div>
  <!-- Option details dialog (chart icon in the hover controls) -->
  <div id="an-optinfo" hidden></div>
</section>
<style>
/* ---------- /analyse workspace shell ---------- */
[data-route="/analyse"]{--an-top:56px;--an-split:55%}
[data-route="/analyse"] .an-shell{display:flex;height:calc(100vh - var(--an-top));min-height:480px;background:hsl(var(--background));overflow:hidden;position:relative}
[data-route="/analyse"] .an-left{width:var(--an-split);min-width:320px;display:flex;flex-direction:column;background:hsl(var(--card));border-right:1px solid hsl(var(--border));min-height:0}
[data-route="/analyse"] .an-right{flex:1;min-width:320px;display:flex;flex-direction:column;min-height:0;background:hsl(var(--background))}
[data-route="/analyse"] .an-divider{width:6px;cursor:col-resize;background:transparent;position:relative;flex-shrink:0;margin-left:-3px;z-index:4}
[data-route="/analyse"] .an-divider::after{content:"";position:absolute;left:1px;top:50%;width:4px;height:26px;margin-top:-13px;border-radius:2px;background:hsl(var(--border))}
[data-route="/analyse"] .an-divider:hover::after,[data-route="/analyse"] .an-divider.on::after{background:hsl(var(--primary))}
[data-route="/analyse"] .an-mobile-bar{display:none;padding:8px 12px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--card))}
[data-route="/analyse"] .an-lptabs,[data-route="/analyse"] .an-rptabs{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--card));flex-shrink:0;overflow-x:auto;scrollbar-width:none}
[data-route="/analyse"] .an-tab{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:hsl(var(--muted-foreground));white-space:nowrap}
[data-route="/analyse"] .an-tab:hover{color:hsl(var(--foreground));background:hsl(var(--muted)/.6)}
[data-route="/analyse"] .an-tab.active{background:hsl(var(--muted));color:hsl(var(--foreground))}
[data-route="/analyse"] .an-tab i,[data-route="/analyse"] i[data-icon]{display:inline-flex;width:16px;height:16px;flex-shrink:0}
[data-route="/analyse"] i[data-icon] svg{width:100%;height:100%}
[data-route="/analyse"] .an-left-panels{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
[data-route="/analyse"] .lp-panel{flex:1;min-height:0;display:flex;flex-direction:column}
[data-route="/analyse"] .lp-panel[hidden]{display:none!important}
[data-route="/analyse"] .an-placeholder{align-items:center;justify-content:center;color:hsl(var(--muted-foreground));font-size:13px}
/* expiry strip */
[data-route="/analyse"] .an-expiry-strip{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid hsl(var(--border));flex-shrink:0}
[data-route="/analyse"] .an-expiries{position:relative;display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;scroll-behavior:smooth}
[data-route="/analyse"] .an-expiries::-webkit-scrollbar{display:none}
[data-route="/analyse"] .an-exp{height:34px;padding:0 13px;border-radius:7px;background:hsl(var(--muted));font-family:var(--font-mono);font-size:13px;font-weight:600;color:hsl(var(--muted-foreground));white-space:nowrap;flex-shrink:0}
[data-route="/analyse"] .an-exp:hover{background:hsl(var(--secondary));color:hsl(var(--foreground))}
[data-route="/analyse"] .an-exp.active{background:hsl(var(--primary));color:#fff}
[data-route="/analyse"] .an-exp small{font-size:9.5px;font-weight:500;opacity:.75;margin-left:4px}
[data-route="/analyse"] .an-scroll-btn{width:26px;height:34px;font-size:18px;color:hsl(var(--muted-foreground));border-radius:6px;flex-shrink:0}
[data-route="/analyse"] .an-scroll-btn:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
[data-route="/analyse"] .an-live-btn{height:34px;padding:0 13px;border-radius:7px;border:1px solid hsl(var(--profit)/.55);background:hsl(var(--buy-bg));color:hsl(var(--profit));font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap}
[data-route="/analyse"] .an-live-btn.static{border-color:hsl(var(--border));background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
[data-route="/analyse"] .an-live-btn.connecting{border-color:hsl(var(--warning)/.6);background:hsl(var(--warning-bg));color:hsl(var(--warning))}
[data-route="/analyse"] .an-live-btn i{width:14px;height:14px}
[data-route="/analyse"] .an-gear{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:hsl(var(--muted-foreground));flex-shrink:0}
[data-route="/analyse"] .an-gear:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
[data-route="/analyse"] .an-gear i{width:18px;height:18px}
/* chain table */
[data-route="/analyse"] .an-chain-wrap{flex:1;min-height:0;overflow:auto;position:relative;outline:none;scrollbar-width:thin;scrollbar-color:hsl(var(--border)) transparent}
[data-route="/analyse"] .an-chain-wrap:focus-visible{box-shadow:inset 0 0 0 2px hsl(var(--ring)/.5)}
[data-route="/analyse"] .an-chain{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px}
[data-route="/analyse"] .an-chain th,[data-route="/analyse"] .an-chain td{padding:0;text-align:center;white-space:nowrap;vertical-align:middle}
[data-route="/analyse"] .an-chain thead th{position:sticky;top:0;z-index:6;background:hsl(var(--card))}
[data-route="/analyse"] .an-chain thead tr.h1 th{height:38px;font-family:var(--font-display);font-size:16px;font-weight:700;border-bottom:1px solid hsl(var(--border))}
[data-route="/analyse"] .an-chain thead tr.h2 th{top:38px;height:30px;font-size:11px;font-weight:500;color:hsl(var(--muted-foreground));border-bottom:1px solid hsl(var(--border));background:hsl(var(--surface-2))}
[data-route="/analyse"] .an-chain th.th-calls{color:hsl(var(--profit))}
[data-route="/analyse"] .an-chain th.th-puts{color:hsl(var(--loss))}
[data-route="/analyse"] .an-chain th.th-strike{background:hsl(var(--muted));border-left:1px solid hsl(var(--border));border-right:1px solid hsl(var(--border));font-size:13px;letter-spacing:.04em}
[data-route="/analyse"] .an-chain th .hs{display:inline-flex;align-items:center;gap:10px}
[data-route="/analyse"] .an-chain th .hs button{font-size:16px;line-height:1;color:hsl(var(--muted-foreground));width:22px;height:22px;border-radius:5px;font-weight:400}
[data-route="/analyse"] .an-chain th .hs button:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
[data-route="/analyse"] .an-chain tbody td{height:42px;border-bottom:1px solid hsl(var(--border)/.7);position:relative;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
[data-route="/analyse"] .an-chain tbody tr:hover td{background-color:hsl(var(--muted)/.55)}
[data-route="/analyse"] .an-chain tbody tr.hl td{background-color:hsl(var(--info-bg))}
[data-route="/analyse"] .an-chain td.c-itm{background:hsl(var(--buy-bg)/.6)}
[data-route="/analyse"] .an-chain td.p-itm{background:hsl(var(--sell-bg)/.55)}
html.dark [data-route="/analyse"] .an-chain td.c-itm{background:hsl(var(--profit)/.09)}
html.dark [data-route="/analyse"] .an-chain td.p-itm{background:hsl(var(--loss)/.1)}
[data-route="/analyse"] .an-chain td.strike{font-weight:700;font-size:13.5px;background:hsl(var(--muted)/.45);border-left:1px solid hsl(var(--border));border-right:1px solid hsl(var(--border));line-height:1.1}
[data-route="/analyse"] .an-chain tr.atm td.strike{background:hsl(var(--info-bg));color:hsl(var(--primary))}
[data-route="/analyse"] .an-chain td.strike small{display:block;font-size:9px;letter-spacing:.08em;font-weight:600;color:hsl(var(--primary));font-family:var(--font-body);margin-top:1px}
[data-route="/analyse"] .an-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;position:relative;z-index:1;gap:1px}
[data-route="/analyse"] .an-cell .px{font-weight:600;font-size:12.5px}
[data-route="/analyse"] .an-cell .iv,[data-route="/analyse"] .an-cell .sub{font-size:10px;color:hsl(var(--muted-foreground));font-weight:400}
[data-route="/analyse"] td.c-side .an-cell .px.money{color:hsl(var(--profit))}
[data-route="/analyse"] td.p-side .an-cell .px.money{color:hsl(var(--loss))}
[data-route="/analyse"] .an-cell .px.oi{font-weight:600}
[data-route="/analyse"] td.c-side .an-cell .px.oi{color:hsl(var(--profit))}
[data-route="/analyse"] td.p-side .an-cell .px.oi{color:hsl(var(--loss))}
[data-route="/analyse"] .an-oibar{position:absolute;top:5px;bottom:5px;z-index:0;border-radius:2px;pointer-events:none}
[data-route="/analyse"] td.c-side .an-oibar{right:0;background:rgba(34,197,94,.25)}
[data-route="/analyse"] td.p-side .an-oibar{left:0;background:rgba(239,68,68,.25)}
[data-route="/analyse"] .an-chain td .px.up{color:hsl(var(--profit))}
[data-route="/analyse"] .an-chain td .px.dn{color:hsl(var(--loss))}
/* leg pills */
[data-route="/analyse"] .an-pills{position:absolute;top:2px;bottom:2px;display:flex;flex-direction:column;justify-content:space-between;z-index:2;pointer-events:none}
[data-route="/analyse"] td.c-inb .an-pills{right:4px}
[data-route="/analyse"] td.p-inb .an-pills{left:4px}
[data-route="/analyse"] .an-pill{font-size:9px;font-weight:700;padding:0 4px;border-radius:4px;line-height:13px;color:#fff;font-family:var(--font-mono);box-shadow:0 1px 2px rgba(0,0,0,.2)}
[data-route="/analyse"] .an-pill.b{background:hsl(var(--buy))}
[data-route="/analyse"] .an-pill.s{background:hsl(var(--sell))}
/* hover controls */
[data-route="/analyse"] .an-ctl{display:none;position:absolute;top:50%;transform:translateY(-50%);z-index:5;align-items:center;gap:5px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:9px;padding:4px 6px;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);font-family:var(--font-body)}
[data-route="/analyse"] td.c-inb .an-ctl{right:6px}
[data-route="/analyse"] td.p-inb .an-ctl{left:6px}
[data-route="/analyse"] tr:hover .an-ctl,[data-route="/analyse"] tr.hl .an-ctl{display:flex}
[data-route="/analyse"] .an-ctl .bs{width:30px;height:28px;border-radius:6px;font-weight:700;font-size:12.5px;border:1px solid;display:inline-flex;align-items:center;justify-content:center;gap:2px}
[data-route="/analyse"] .an-ctl .bs.b{color:hsl(var(--buy));border-color:hsl(var(--buy)/.6);background:hsl(var(--buy-bg))}
[data-route="/analyse"] .an-ctl .bs.s{color:hsl(var(--sell));border-color:hsl(var(--sell)/.6);background:hsl(var(--sell-bg))}
[data-route="/analyse"] .an-ctl .bs.b:hover,[data-route="/analyse"] .an-ctl .bs.b.on{background:hsl(var(--buy));color:#fff}
[data-route="/analyse"] .an-ctl .bs.s:hover,[data-route="/analyse"] .an-ctl .bs.s.on{background:hsl(var(--sell));color:#fff}
[data-route="/analyse"] .an-ctl .ic{width:28px;height:28px;border-radius:6px;border:1px solid hsl(var(--border));display:grid;place-items:center;color:hsl(var(--foreground))}
[data-route="/analyse"] .an-ctl .ic:hover{background:hsl(var(--muted))}
[data-route="/analyse"] .an-ctl .ic i{width:15px;height:15px}
[data-route="/analyse"] .an-ctl select{height:28px;font-size:12.5px;font-weight:600;border:1px solid hsl(var(--border));border-radius:6px;background:hsl(var(--card));padding:0 4px;font-family:var(--font-mono);color:hsl(var(--foreground))}
[data-route="/analyse"] .an-ctl .lot{font-size:11px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}
[data-route="/analyse"] .an-chain-foot{padding:6px 12px;border-top:1px solid hsl(var(--border));font-size:11.5px;color:hsl(var(--muted-foreground));display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-shrink:0;font-family:var(--font-mono)}
[data-route="/analyse"] .an-chain-foot b{color:hsl(var(--foreground));font-weight:600}
[data-route="/analyse"] .an-chain-foot .sep{opacity:.5}
/* right pane */
[data-route="/analyse"] .an-right-body{flex:1;min-height:0;overflow:auto;padding:12px;scrollbar-width:thin}
[data-route="/analyse"] .rp-panel[hidden]{display:none!important}
[data-route="/analyse"] .an-tiles{display:grid;grid-template-columns:1fr 1fr 1fr 1.55fr;gap:10px;margin-bottom:12px}
[data-route="/analyse"] .an-tile{border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--card));padding:10px 12px;min-width:0}
[data-route="/analyse"] .an-tile-h{display:flex;gap:8px;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:hsl(var(--muted-foreground));font-weight:600}
[data-route="/analyse"] .an-tile-h i{width:15px;height:15px}
[data-route="/analyse"] .an-tile-h i.text-profit{color:hsl(var(--profit))}

        exp: root.querySelector('#an-expiries'), live: root.querySelector('#an-live-btn'), wrap: root.querySelector('#an-chain-wrap'), table: root.querySelector('#an-chain'), foot: root.querySelector('#an-chain-foot'), cs: root.querySelector('#an-colsettings'), optinfo: root.querySelector('#an-optinfo'),
        payoff: root.querySelector('#an-payoff'), analytics: root.querySelector('#an-analytics'), greeks: root.querySelector('#an-greeks'), pnl: root.querySelector('#an-pnl'),
        tMaxP: root.querySelector('#an-t-maxp'), tMaxL: root.querySelector('#an-t-maxl'), tPrem: root.querySelector('#an-t-prem'), tPremS: root.querySelector('#an-t-prem-s'), tBe: root.querySelector('#an-t-be'),
        legend: root.querySelector('#an-legend'), layersBtn: root.querySelector('#an-layers-btn'), zoomLabel: root.querySelector('#an-zoom-label'), sdRow: root.querySelector('#an-sd-row'), chartHost: root.querySelector('#an-chart-host'), chartFoot: root.querySelector('#an-chart-foot'),
        tpTitle: root.querySelector('#an-tp-title'), tpPct: root.querySelector('#an-tp-pct'), tpVal: root.querySelector('#an-tp-val'), tpRange: root.querySelector('#an-tp-range'), tpMin: root.querySelector('#an-tp-min'), tpMax: root.querySelector('#an-tp-max'),
        tdTitle: root.querySelector('#an-td-title'), tdVal: root.querySelector('#an-td-val'), tdRange: root.querySelector('#an-td-range'), tdMax: root.querySelector('#an-td-max')
      });
      els.tbody = els.table.querySelector('tbody');
      M.fillIcons(root); M.setLive(AN.mode === 'static' ? 'static' : 'live');
      if (st.analyseSplit) root.style.setProperty('--an-split', st.analyseSplit + '%');
      // left tabs + mobile toggle + divider
      els.lptabs.addEventListener('click', (e) => { const b = e.target.closest('[data-lptab]'); if (b) M.setLeftTab(b.dataset.lptab); });
      root.addEventListener('click', (e) => { const b = e.target.closest('[data-rptab]'); if (b) { M.setRightTab(b.dataset.rptab); return; } const mv = e.target.closest('[data-mobile-view]'); if (mv) { els.shell.dataset.mobile = mv.dataset.mobileView; CG.$$('[data-mobile-view]', root).forEach((x) => x.classList.toggle('active', x === mv)); if (mv.dataset.mobileView === 'analysis') M.renderRight(); else M.scrollToAtm(); } });
      els.divider.addEventListener('mousedown', (e) => { e.preventDefault(); els.divider.classList.add('on'); const rect = els.shell.getBoundingClientRect(); const move = (ev) => { const pct = Math.min(70, Math.max(35, ((ev.clientX - rect.left) / rect.width) * 100)); root.style.setProperty('--an-split', pct.toFixed(1) + '%'); }; const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); els.divider.classList.remove('on'); st.analyseSplit = parseFloat(root.style.getPropertyValue('--an-split')) || 55; CG.saveState(); M.renderChart(); }; document.addEventListener('mousemove', move); document.addEventListener('mouseup', up); });
      new MutationObserver(() => { if (st.analyseTab) M.setLeftTab(st.analyseTab, true); }).observe(els.leftPanels, { childList: true });
      // expiry strip / live / column settings
      root.querySelector('.an-expiry-strip').addEventListener('click', (e) => { const x = e.target.closest('[data-exp]'); if (x) { M.setExpiry(x.dataset.exp); return; } const s = e.target.closest('[data-exp-scroll]'); if (s) { els.exp.scrollBy({ left: 220 * (+s.dataset.expScroll), behavior: 'smooth' }); return; } if (e.target.closest('#an-live-btn')) { M.toggleLive(); return; } if (e.target.closest('#an-colsettings-btn')) M.openColSettings(); });
      M.bindCs();
      els.optinfo.addEventListener('click', (e) => { const b = e.target.closest('[data-oi-act]'); if (!b) return; const lots = +(els.optinfo.querySelector('[data-oi-lots]') || {}).value || M.curLots(); st.chainLots = lots; CG.saveState(); if (M.addLeg(els.optinfo.dataset.type, b.dataset.oiAct, +els.optinfo.dataset.strike, lots)) CG.modal.closeAll(); });
      // chain interactions
      els.wrap.addEventListener('click', (e) => {
        const hb = e.target.closest('[data-hscroll]'); if (hb) { els.wrap.scrollBy({ left: 180 * (+hb.dataset.hscroll), behavior: 'smooth' }); return; }
        const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return; const tr = b.closest('tr'); const ctl = b.closest('.an-ctl'); if (!tr || !ctl) return; const strike = +tr.dataset.strike; const type = ctl.dataset.type;
        if (b.dataset.act === 'INFO') { M.openOptInfo(type, strike); return; }
        const lots = +(ctl.querySelector('select.lots') || {}).value || M.curLots(); M.addLeg(type, b.dataset.act, strike, lots);
      });
      els.wrap.addEventListener('change', (e) => { const s = e.target.closest('select.lots'); if (!s) return; st.chainLots = +s.value; CG.saveState(); CG.$$('select.lots', els.wrap).forEach((x) => { if (x !== s) x.value = s.value; }); });
      let raf = null; els.wrap.addEventListener('scroll', () => { if (raf) return; raf = requestAnimationFrame(() => { raf = null; M.updateVis(); }); });
      els.wrap.addEventListener('keydown', (e) => {
        const rows = M.rowsByStrike(); const strikes = Object.keys(rows).map(Number).sort((a, b) => a - b); if (!strikes.length) return; let cur = M.hl.get();
        const setHl = (k) => { if (cur != null && rows[cur]) rows[cur].classList.remove('hl'); cur = k; M.hl.set(k); if (k != null && rows[k]) { rows[k].classList.add('hl'); const tr = rows[k]; const top = tr.offsetTop - 70, bot = tr.offsetTop + tr.offsetHeight; if (top < els.wrap.scrollTop) els.wrap.scrollTop = top; else if (bot > els.wrap.scrollTop + els.wrap.clientHeight) els.wrap.scrollTop = bot - els.wrap.clientHeight; } };
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const atm = (M.chain() || {}).atm; let i = cur == null ? strikes.indexOf(atm) : strikes.indexOf(cur); i = Math.max(0, Math.min(strikes.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1))); setHl(strikes[i]); return; }
        if (e.key === 'Escape') { setHl(null); return; }
        if ((e.key === 'b' || e.key === 'B' || e.key === 's' || e.key === 'S') && cur != null) { e.preventDefault(); M.addLeg(e.shiftKey ? 'PUT' : 'CALL', e.key.toUpperCase() === 'B' ? 'BUY' : 'SELL', cur, M.curLots()); return; }
        if (e.key === 'Enter' && cur != null) { e.preventDefault(); M.openOptInfo(e.shiftKey ? 'PUT' : 'CALL', cur); }
      });
      M.bindPayoff();
      // ---------- shared events ----------
      CG.on('asset', (a) => { if (!a || !CG.ASSETS[a]) return; if (AN.asset === a) return; AN.asset = a; st.asset = a; AN.targetPrice = null; M.hl.set(null); if (M.isActive()) { M.renderChain(); M.renderRight(); } });
      CG.on('tick', () => { if (!M.isActive()) return; if (AN.mode === 'live') M.updateChain(); M.renderRight(); });
      CG.on('currency-settings-changed', () => { if (!M.isActive()) return; M.renderChain(true); M.renderRight(); });
      CG.on('analyse:legs-changed', () => { if (AN.asset && CG.ASSETS[AN.asset] && AN.expiry && CG.EXPIRIES.includes(AN.expiry)) { const ch = M.chain(); if (ch && (ch.asset !== AN.asset || ch.expiry !== AN.expiry)) { st.asset = AN.asset; st.expiry = AN.expiry; M.renderExpiries(); if (M.isActive()) M.renderChain(); } } if (!M.isActive()) return; M.renderPills(); M.renderRight(); });
      CG.on('analyse:set-tab', (name) => M.setLeftTab(name));
      window.addEventListener('cg-tour-set-tab', (e) => { if (e && e.detail) M.setLeftTab(typeof e.detail === 'string' ? e.detail : e.detail.tab); });
      let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (M.isActive()) { M.measureTop(); M.renderChart(); } }, 120); });
      if (window.ResizeObserver) ['[data-cg="app-header"]', '[data-cg="plan-banner"]'].forEach((s) => { const el = root.querySelector(s); if (el) new ResizeObserver(() => M.measureTop()).observe(el); });
    },
    show(root, params, query) {
      if (CG.ASSETS[st.asset] && st.asset !== AN.asset) { AN.asset = st.asset; AN.targetPrice = null; }
      if (CG.EXPIRIES.includes(st.expiry) && st.expiry !== AN.expiry) AN.expiry = st.expiry;
      M.measureTop(); M.renderExpiries(); M.renderChain();
      M.setLeftTab((query && query.tab) || st.analyseTab || 'chain', true);
      M.setRightTab((query && query.panel) || st.analyseRightTab || 'payoff');
      setTimeout(() => { M.measureTop(); M.scrollToAtm(); }, 30);
    }
  });
})();
</script>
