<!-- ===== 00-chrome · shared logged-in chrome: app header (analyse + default variants), settings menu, settings dialogs, plan banner, upgrade dialog, banner flyers, CoinGreeks Assistant, product tour. No screens of its own. ===== -->
<style>
[hidden]{display:none!important}
/* ---- header ---- */
.cgc-header{gap:10px;padding:0 14px}
.cgc-header .cg-logo{font-size:16px;flex-shrink:0}
.cgc-admin{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:hsl(var(--info-bg));color:hsl(var(--primary));border:1px solid hsl(var(--primary)/.3);line-height:1.4}
.cgc-vdiv{width:1px;height:28px;background:hsl(var(--border));margin:0 4px;flex-shrink:0}
.cgc-asset{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;font-family:var(--font-display);font-weight:600;font-size:15px;flex-shrink:0}
.cgc-asset:hover{background:hsl(var(--muted))}
.cgc-asset svg{width:16px;height:16px;color:hsl(var(--muted-foreground))}
.cgc-coin{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;font-family:var(--font-mono);flex-shrink:0}
.cgc-coin.BTC{background:#f7931a}.cgc-coin.ETH{background:#627eea}.cgc-coin.XAUT{background:#c9a227;font-size:10px}
.cgc-stat{display:flex;flex-direction:column;justify-content:center;line-height:1.15;padding:0 6px;flex-shrink:0}
.cgc-stat .cgc-lbl{font-size:11px;color:hsl(var(--muted-foreground))}
.cgc-stat .cgc-val{font-family:var(--font-mono);font-size:17px;font-weight:700;padding:0 3px;border-radius:4px;margin-left:-3px}
.cgc-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.cgc-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:7px;border:1px solid hsl(var(--border));background:hsl(var(--muted));font-size:12.5px;font-weight:500;color:hsl(var(--muted-foreground));white-space:nowrap}
.cgc-chip:hover{background:hsl(var(--secondary));color:hsl(var(--foreground))}
.cgc-chip.on{background:hsl(var(--buy-bg));color:hsl(var(--buy));border-color:hsl(var(--buy)/.35)}
.cgc-chip.warn{background:hsl(var(--warning-bg));color:hsl(var(--warning));border-color:hsl(var(--warning)/.4)}
.cgc-chip svg{width:15px;height:15px;flex-shrink:0}
.cgc-chip .cgc-sub{font-size:10.5px;font-weight:600;opacity:.8;padding-left:4px;border-left:1px solid currentColor;margin-left:2px}
.cgc-icon{width:34px;height:34px;border-radius:7px;display:inline-grid;place-items:center;color:hsl(var(--foreground));flex-shrink:0}
.cgc-icon:hover{background:hsl(var(--muted))}
.cgc-icon svg{width:18px;height:18px}
.cgc-avatar{width:32px;height:32px;border-radius:50%;background:hsl(var(--info-bg));color:hsl(var(--primary));display:grid;place-items:center;border:1px solid hsl(var(--primary)/.3);flex-shrink:0}
.cgc-avatar svg{width:18px;height:18px}
.cgc-header .cg-nav{display:flex;align-items:center;gap:2px}
.cgc-header .cg-nav .btn{color:hsl(var(--primary-foreground));height:32px}
.cgc-header .cg-nav .btn:hover{background:hsl(var(--primary)/.9);color:#fff}
.menu.cgc-menu{min-width:240px;max-height:calc(100vh - 80px);overflow:auto}
.menu-item svg{width:15px;height:15px;color:hsl(var(--muted-foreground));flex-shrink:0}
.menu-item.danger,.menu-item.danger svg{color:hsl(var(--destructive))}
.cgc-menu-user{padding:8px 10px;border-bottom:1px solid hsl(var(--border));margin-bottom:4px}
.cgc-menu-user b{display:block;font-size:13px}.cgc-menu-user span{font-size:11.5px;color:hsl(var(--muted-foreground))}
.cgc-assetrow{display:flex;align-items:center;gap:10px}
.cgc-assetrow .cgc-px{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:hsl(var(--muted-foreground))}
.cgc-assetrow.sel{background:hsl(var(--info-bg))}
@media (max-width:900px){.cgc-stat.cgc-chg,.cgc-chip .cgc-sub,.cgc-chip span.cgc-txt{display:none}}
/* ---- plan banner ---- */
.cgc-banner{display:flex;align-items:center;gap:12px;padding:7px 16px;font-size:13px;border-bottom:1px solid hsl(var(--border))}
.cgc-banner.expired{background:hsl(var(--sell-bg));color:hsl(var(--sell))}
.cgc-banner.free{background:hsl(var(--info-bg));color:hsl(var(--primary))}
.cgc-banner.expiring{background:hsl(var(--warning-bg));color:hsl(var(--warning))}
.cgc-banner.active{background:hsl(var(--buy-bg));color:hsl(var(--buy))}
.cgc-banner .btn{height:26px;padding:0 10px;font-size:12px}
.cgc-banner .cgc-x{margin-left:auto;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;opacity:.7}
.cgc-banner .cgc-x:hover{opacity:1;background:rgba(0,0,0,.06)}
.cgc-banner svg{width:15px;height:15px;flex-shrink:0}
/* ---- dialog pieces ---- */
.cgc-status{border:1px solid hsl(var(--border));border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start;background:hsl(var(--muted)/.5)}
.cgc-status.ok{background:hsl(var(--buy-bg));border-color:hsl(var(--buy)/.35)}
.cgc-status.no{background:hsl(var(--warning-bg));border-color:hsl(var(--warning)/.4)}
.cgc-status b{display:block}.cgc-status .mono{font-size:12.5px}
.cgc-status svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.cgc-sect{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--muted-foreground));font-weight:600;margin:14px 0 8px}
.cgc-ip{display:flex;align-items:center;gap:8px;border:1px dashed hsl(var(--border));border-radius:8px;padding:8px 10px;background:hsl(var(--muted)/.5)}
.cgc-ip code{font-family:var(--font-mono);font-size:13px;flex:1}
.cgc-avatars{display:flex;gap:12px;justify-content:center;margin:6px 0 10px}
.cgc-av{width:56px;height:56px;border-radius:50%;border:2px solid hsl(var(--border));display:grid;place-items:center;background:hsl(var(--muted));color:hsl(var(--primary));cursor:pointer}
.cgc-av.sel{border-color:hsl(var(--primary));box-shadow:0 0 0 3px hsl(var(--primary)/.2)}
.cgc-av svg{width:28px;height:28px}
.cgc-av.big{width:76px;height:76px}.cgc-av.big svg{width:38px;height:38px}
.cgc-radio{display:flex;gap:10px;padding:10px 12px;border:1px solid hsl(var(--border));border-radius:8px;cursor:pointer;margin-bottom:8px;align-items:flex-start}
.cgc-radio.sel{border-color:hsl(var(--primary));background:hsl(var(--info-bg))}
.cgc-radio i{width:16px;height:16px;border-radius:50%;border:2px solid hsl(var(--muted-foreground));margin-top:2px;flex-shrink:0;display:grid;place-items:center}
.cgc-radio.sel i{border-color:hsl(var(--primary))}.cgc-radio.sel i::after{content:"";width:8px;height:8px;border-radius:50%;background:hsl(var(--primary))}
.cgc-radio b{display:block;font-size:13px}.cgc-radio span{font-size:12px;color:hsl(var(--muted-foreground))}
.cgc-broker{display:flex;align-items:center;gap:12px;border:1px solid hsl(var(--border));border-radius:8px;padding:10px 12px;margin-bottom:8px}
.cgc-broker b{display:block;font-size:13.5px}.cgc-broker .cgc-meta{font-size:12px;color:hsl(var(--muted-foreground));display:flex;gap:10px;flex-wrap:wrap}
.cgc-broker .cgc-meta .mono{color:hsl(var(--foreground))}
.cgc-kv{display:flex;justify-content:space-between;gap:12px;padding:5px 10px;font-size:13px}
.cgc-kv span{color:hsl(var(--muted-foreground))}.cgc-kv b{font-family:var(--font-mono);font-weight:600}
.cgc-lotrow{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;margin-bottom:10px}
.cgc-lotrow .cgc-eq{display:flex;align-items:center;gap:8px;font-size:13px}
.cgc-lotrow .input{width:120px;font-family:var(--font-mono)}
.cgc-form-err{color:hsl(var(--destructive));font-size:12px;margin-top:4px}
/* ---- flyers ---- */
.cgc-flyer{position:relative}
.cgc-flyer .cg-dialog-body{padding-top:44px}
.cgc-flyer-img{height:300px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cgc-flyer-img h3{color:#fff;font-size:24px;margin-bottom:6px}
.cgc-flyer-img p{font-size:14px;opacity:.95;max-width:90%}
.cgc-flyer-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cgc-flyer-nav svg{width:18px;height:18px}
.cgc-flyer-nav.prev{left:10px}.cgc-flyer-nav.next{right:10px}
.cgc-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.cgc-dots i{width:7px;height:7px;border-radius:50%;background:hsl(var(--border))}.cgc-dots i.on{background:hsl(var(--primary))}
/* ---- assistant ---- */
.cgc-chat-btn{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;background:hsl(var(--primary));color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px -6px hsl(var(--primary)/.8);z-index:90;touch-action:none;user-select:none;transition:transform .15s}
.cgc-chat-btn:hover{transform:scale(1.06)}.cgc-chat-btn.drag{transform:scale(1.1);cursor:grabbing}
.cgc-chat-btn svg{width:24px;height:24px}
.cgc-chat{position:fixed;width:360px;max-width:calc(100vw - 24px);height:520px;max-height:calc(100vh - 100px);background:hsl(var(--card));color:hsl(var(--card-foreground));border:1px solid hsl(var(--border));border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);z-index:91;display:flex;flex-direction:column;overflow:hidden;animation:cg-pop .16s ease-out}
.cgc-chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:hsl(var(--primary));color:#fff}
.cgc-chat-head svg{width:20px;height:20px}
.cgc-chat-head b{display:block;font-family:var(--font-display);font-size:14px}.cgc-chat-head span{font-size:11px;opacity:.85}
.cgc-chat-head .cgc-close{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#fff}
.cgc-chat-head .cgc-close:hover{background:rgba(255,255,255,.15)}
.cgc-chat-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:hsl(var(--background))}
.cgc-msg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.cgc-msg.bot{background:hsl(var(--card));border:1px solid hsl(var(--border));align-self:flex-start;border-bottom-left-radius:4px}
.cgc-msg.me{background:hsl(var(--primary));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.cgc-chips{display:flex;flex-wrap:wrap;gap:6px}
.cgc-chips button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid hsl(var(--primary)/.4);color:hsl(var(--primary));background:hsl(var(--info-bg));text-align:left}
.cgc-chips button:hover{background:hsl(var(--primary));color:#fff}
.cgc-chat-form{display:flex;gap:6px;padding:10px 12px 6px;border-top:1px solid hsl(var(--border))}
.cgc-chat-form .btn svg{width:15px;height:15px}
.cgc-chat-foot{font-size:11px;color:hsl(var(--muted-foreground));text-align:center;padding:0 12px 8px}
.cgc-chat-foot a{color:hsl(var(--primary));text-decoration:underline}
.cgc-typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:hsl(var(--muted-foreground));margin:0 1px;animation:cgc-bounce 1s infinite}
.cgc-typing i:nth-child(2){animation-delay:.15s}.cgc-typing i:nth-child(3){animation-delay:.3s}
@keyframes cgc-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
/* ---- tour ---- */
.cgc-tour{position:fixed;inset:0;z-index:150;pointer-events:none}
.cgc-tour svg{position:absolute;inset:0;width:100%;height:100%}
.cgc-tour-ring{position:fixed;z-index:150;pointer-events:none;border-radius:8px;box-shadow:0 0 0 2px hsl(var(--primary)),0 0 0 6px hsl(var(--primary)/.25);transition:all .25s}
.cgc-tour-pop{position:fixed;z-index:151;pointer-events:auto;width:330px;max-width:calc(100vw - 24px);background:hsl(var(--card));color:hsl(var(--card-foreground));border:1px solid hsl(var(--border));border-radius:12px;box-shadow:0 20px 50px -15px rgba(0,0,0,.45);padding:14px 16px 12px;animation:cg-pop .16s ease-out}
.cgc-tour-pop h4{font-size:15px;margin-bottom:6px;padding-right:22px}
.cgc-tour-pop p{font-size:13px;color:hsl(var(--muted-foreground));line-height:1.5}
.cgc-tour-foot{display:flex;align-items:center;gap:6px;margin-top:12px}
.cgc-tour-prog{font-size:11.5px;color:hsl(var(--muted-foreground));margin-right:auto}
.cgc-tour-x{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:hsl(var(--muted-foreground))}
.cgc-tour-x:hover{background:hsl(var(--muted))}
.cgc-tour-arrow{position:absolute;width:12px;height:12px;background:hsl(var(--card));border-left:1px solid hsl(var(--border));border-top:1px solid hsl(var(--border));transform:rotate(45deg)}
.cgc-tour-arrow.bottom{transform:rotate(225deg)}
</style>

const TOUR_STEPS = [
  { title: 'Welcome to CoinGreeks', desc: "Let's place a real paper trade together — from picking legs to stopping the trade. Skip anytime; replay later from the help button in the header.", next: 'Start' },
  { target: 'asset-select', title: 'Choose your asset', desc: 'Switch between BTC, ETH and XAUT. The live futures price updates here in real time.' },
  { target: 'options-chain', title: 'Your workspaces', desc: 'Option Chain shows live strikes. Builder creates strategies. Paper and Live manage your trades, and Templates stores ready-made setups.', tab: 'options-chain' },
  { target: 'options-chain', title: 'Add a leg — try it now', desc: 'Click any Call or Put price in the chain to add it as a leg. The tour moves on as soon as your first leg is added.', tab: 'options-chain', waitFor: 'cg-tour:leg-added' },
  { target: 'strategy-legs', alt: 'add-leg-button', title: 'Your strategy legs', desc: 'Here is the leg you just added. Adjust side (Buy/Sell), strike, expiry and quantity — add more legs for multi-leg strategies. Press Next when it looks right.', tab: 'builder' },
  { target: 'payoff-panel', title: 'Payoff and analytics', desc: 'See the payoff diagram, max profit, max loss and breakevens for the strategy you are building.' },
  { target: 'paper-trade-button', title: 'Start a paper trade', desc: 'Click Paper Trade to begin — virtual funds only, no real money.', waitFor: 'cg-tour:save-dialog-open' },
  { target: 'save-dialog', alt: 'save-button', title: 'Name your strategy', desc: "Give the trade a name you'll recognise in the list, then press Save.", waitFor: 'cg-tour:trade-modal-open' },
  { target: 'trade-modal', alt: 'trade-confirm-button', title: 'Review and start', desc: 'Check the order preview — legs, net premium and required margin — then click Start Paper Trade.', waitFor: 'cg-tour:paper-started' },
  { target: 'paper-tab', title: 'Your trade is running', desc: 'Every paper trade lives in the Paper tab — including the one you just started.', tab: 'paper' },
  { target: 'paper-pnl', title: 'Track P&L and details', desc: 'Total P&L updates live as the market moves. Click the trade card to open full details — per-leg P&L, payoff chart and history.', tab: 'paper' },
  { target: 'paper-stop', title: 'Stop a paper trade', desc: 'Use Stop on the trade card to square off every open leg at the current price and move the trade to your archive.', tab: 'paper' },
  { target: 'settings-menu', title: 'Settings', desc: 'Manage your profile, subscription, API settings and preferences here. Replay this tour anytime from the help button.' },
  { target: 'chat-launcher', title: 'Ask the CoinGreeks Assistant', desc: 'Stuck anywhere? Click this chat button to ask about strategies, options concepts or how a screen works. You can drag the button anywhere on the page.' }
];
CH.TOUR_STEPS = TOUR_STEPS;
let tour = null;
const visible = (el) => { if (!el) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
function findTarget(step) { if (!step.target) return null; const sel = (k) => CG.$$('[data-tour="' + k + '"]').find(visible) || null; return sel(step.target) || (step.alt ? sel(step.alt) : null); }
function makeTour() {
  const ov = h('<div class="cgc-tour"><svg><defs><mask id="cgc-tour-mask"><rect width="100%" height="100%" fill="#fff"/><rect data-hole x="0" y="0" width="0" height="0" rx="8" fill="#000"/></mask></defs><rect width="100%" height="100%" fill="rgba(5,10,20,.62)" mask="url(#cgc-tour-mask)"/></svg></div>');
  const ring = h('<div class="cgc-tour-ring" hidden></div>');
  const pop = h('<div class="cgc-tour-pop" role="dialog" aria-live="polite"><button class="cgc-tour-x" aria-label="Close" data-close>' + I('x', 14) + '</button><h4 data-title></h4><p data-desc></p><div class="cgc-tour-foot"><span class="cgc-tour-prog" data-prog></span><button class="btn btn-outline btn-sm" data-prev>Previous</button><button class="btn btn-primary btn-sm" data-next>Next</button></div><div class="cgc-tour-arrow" data-arrow hidden></div></div>');
  document.body.append(ov, ring, pop);
  const N = TOUR_STEPS.length; let idx = 0, unsubWait = null, placeT = null, unsubRoute = null;
  const hole = ov.querySelector('[data-hole]'), arrow = pop.querySelector('[data-arrow]');
  function place() {
    const step = TOUR_STEPS[idx]; const t = findTarget(step);
    if (t) {
      try { t.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (e) { }
      const r = t.getBoundingClientRect(); const pad = 6; const x = r.left - pad, y = r.top - pad, w = r.width + pad * 2, hh = r.height + pad * 2;
      hole.setAttribute('x', x); hole.setAttribute('y', y); hole.setAttribute('width', w); hole.setAttribute('height', hh);
      ring.hidden = false; Object.assign(ring.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: hh + 'px' });
      const pw = pop.offsetWidth, ph = pop.offsetHeight; let left = Math.max(8, Math.min(r.left, window.innerWidth - pw - 8)); let top, below = true;
      if (r.bottom + 14 + ph <= window.innerHeight - 8) top = r.bottom + 14; else if (r.top - 14 - ph >= 8) { top = r.top - 14 - ph; below = false; } else { top = Math.max(8, Math.min(r.top, window.innerHeight - ph - 8)); left = r.right + 14 + pw <= window.innerWidth ? r.right + 14 : Math.max(8, r.left - pw - 14); arrow.hidden = true; }
      if (r.bottom + 14 + ph <= window.innerHeight - 8 || r.top - 14 - ph >= 8) { arrow.hidden = false; arrow.className = 'cgc-tour-arrow' + (below ? '' : ' bottom'); arrow.style.left = Math.max(12, Math.min(r.left + r.width / 2 - left - 6, pw - 24)) + 'px'; arrow.style.top = below ? '-7px' : 'auto'; arrow.style.bottom = below ? 'auto' : '-7px'; }
      pop.style.left = left + 'px'; pop.style.top = top + 'px';
    } else {
      hole.setAttribute('width', 0); hole.setAttribute('height', 0); ring.hidden = true; arrow.hidden = true;
      pop.style.left = Math.max(8, (window.innerWidth - pop.offsetWidth) / 2) + 'px'; pop.style.top = Math.max(8, (window.innerHeight - pop.offsetHeight) / 2) + 'px';
    }
  }
  function render() {
    const step = TOUR_STEPS[idx];
    pop.querySelector('[data-title]').textContent = step.title; pop.querySelector('[data-desc]').textContent = step.desc; pop.querySelector('[data-prog]').textContent = (idx + 1) + ' of ' + N;
    const prev = pop.querySelector('[data-prev]'), next = pop.querySelector('[data-next]'); prev.disabled = idx === 0; prev.hidden = idx === 0; next.textContent = idx === N - 1 ? 'Done' : step.next || 'Next';
    if (unsubWait) { unsubWait(); unsubWait = null; }
    if (step.waitFor) unsubWait = CG.on(step.waitFor, () => T.go(idx + 1));
    CG.emit('tour-step', { index: idx, target: step.target || null, tab: step.tab || null, title: step.title });
    place(); clearTimeout(placeT); placeT = setTimeout(place, 180);
  }
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); T.destroy(); } else if (e.key === 'ArrowRight') T.go(idx + 1); else if (e.key === 'ArrowLeft') T.go(idx - 1); };
  const onResize = () => place();
  const T = {
    go(i) { if (i < 0) return; if (i >= N) return T.finish(); idx = i; render(); },
    finish() { T.destroy(); CG.emit('tour-end', { completed: true }); CG.toast({ title: 'Tour complete', description: 'Replay it anytime from the help button in the header.', variant: 'success' }); },
    destroy() { if (unsubWait) unsubWait(); if (unsubRoute) unsubRoute(); clearTimeout(placeT); document.removeEventListener('keydown', onKey, true); window.removeEventListener('resize', onResize); window.removeEventListener('scroll', onResize, true); ov.remove(); ring.remove(); pop.remove(); if (tour === T) tour = null; CG.emit('tour-end', { completed: false }); },
    get index() { return idx; }
  };
  pop.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) T.destroy(); else if (e.target.closest('[data-prev]')) T.go(idx - 1); else if (e.target.closest('[data-next]')) T.go(idx + 1); });
  document.addEventListener('keydown', onKey, true); window.addEventListener('resize', onResize); window.addEventListener('scroll', onResize, true);
  unsubRoute = CG.on('route', (c) => { if (c && c.path !== '/analyse' && CG.$('section.screen[data-route="/analyse"]')) T.destroy(); });
  return T;
}
CH.startTour = function () {
  if (tour) tour.destroy();
  const hasAnalyse = !!CG.$('section.screen[data-route="/analyse"]');
  if (hasAnalyse && (CG.current.path || '') !== '/analyse') { const un = CG.on('route', (c) => { if (c.path === '/analyse') { un(); setTimeout(() => CH.startTour(), 450); } }); CG.navigate('/analyse'); return null; }
  CG.modal.closeAll(); CG.menu.closeAll();
  tour = makeTour(); tour.go(0); return tour;
};
CH.autoTour = function () { if (st.tourDone) return; st.tourDone = true; CG.saveState(); CH.startTour(); };
CH.tourActive = () => !!tour;
CH.tourNext = () => { if (tour) tour.go(tour.index + 1); };

})();
</script>
