  // 6) Exchange overview
  S.exchange = function (root, p) { const m = main(root); const name = String(p.exchange || ''); const ex = M.exchanges.find((e) => e.name.toLowerCase() === name.toLowerCase()); const chips = '<div class="ma-chips">' + M.exchanges.map((e) => '<a class="ma-chip' + (ex && e.name === ex.name ? ' active' : '') + '" href="#/terminal/exchanges/' + e.name + '">' + CG.esc(e.name) + '</a>').join('') + '</div>';

  // 7) Open Interest
  S.oi = function (root) { const m = main(root); const T = MA.totals(); const exOi = M.exchanges.reduce((s, e) => s + e.openInterest, 0); m.innerHTML = MA.head('Open Interest', 'Aggregated futures open interest across exchanges') + '<div class="ma-tiles">' + MA.tile('Aggregated OI', MA.usd(exOi), 'All exchanges') + MA.tile('BTC OI', MA.usd(MA.coin('BTC').openInterest), 'BTC Dominance ' + F.num(T.btcDom, 1) + '%') + MA.tile('Top Exchange', CG.esc(M.exchanges[0].name), F.num(M.exchanges[0].oiShare * 100, 1) + '% share') + '</div>' + MA.panel('Aggregated Open Interest', 'OI USD (left) vs BTC price (right) · 96h', '<div data-ch></div>') + MA.panel('Open Interest by Exchange', 'Share of aggregated OI · click a row to open the exchange', '<div data-tb></div>', true);

  // 8) Funding Rates
  S.funding = function (root) { const m = main(root); const fh = M.fundingHistory; const cur = fh[fh.length - 1]; m.innerHTML = MA.head('Funding Rates', 'OI-weighted funding across exchanges') + '<div class="ma-tiles">' + MA.tile('OI-Weighted Funding', MA.fund(cur.oiWeighted), 'Current 8h rate') + MA.tile('Average Funding', MA.fund(cur.funding), 'Simple average') + MA.tile('Annualised', MA.pct(cur.oiWeighted * 3 * 365, 1), '3 × 365 periods') + '</div>' + MA.panel('OI-Weighted Funding', 'Funding % · 8h intervals · 32d', '<div data-ch></div>') + MA.panel('Per-exchange Funding', 'BTC perpetual funding per venue · sortable · click a row to open the exchange', '<div data-tb></div>', true);
    MA.chart(m.querySelector('[data-ch]'), { type: 'bar', height: 260, labels: fh.map((x) => MA.dmh(new Date(x.time))), series: [{ name: 'Funding %', data: fh.map((x) => x.oiWeighted), color: ACC, colorNeg: DOWN, format: (v) => v.toFixed(4) + '%' }], yFormat: (v) => v.toFixed(3) + '%' });
    const btc = MA.coinData(MA.coin('BTC')).ex; MA.table(m.querySelector('[data-tb]'), { cols: [exCol(), MA.col.fund(), MA.col.fund('predicted', 'Predicted'), MA.col.usd('openInterest', 'Open Interest'), { key: 'apr', label: 'Annualised', align: 'r', val: (e) => e.funding * 3 * 365, html: (e) => MA.pct(e.funding * 3 * 365, 1) }], rows: btc, sort: { key: 'funding', dir: 'desc' }, nav: (e) => '/terminal/exchanges/' + e.name }); };
  // 9) Long / Short
  S.longShort = function (root) { const m = main(root); const ls = M.lsHistory; const cur = ls[ls.length - 1]; const cls = (v) => (v >= 1 ? 'ma-up' : 'ma-down'); m.innerHTML = MA.head('Long / Short', 'Global account ratio vs top trader accounts and positions') + '<div class="ma-tiles">' + MA.tile('Global Accounts', F.num(cur.global, 2), 'L/S', cls(cur.global)) + MA.tile('Top Trader (Accounts)', F.num(cur.topAccounts, 2), 'L/S', cls(cur.topAccounts)) + MA.tile('Top Trader (Positions)', F.num(cur.topPositions, 2), 'L/S', cls(cur.topPositions)) + '</div>' + MA.panel('Long / Short Ratio', 'L/S · hourly · 72h', '<div data-ch></div>') + MA.panel('Hourly Readings', 'Latest 24 readings · sortable', '<div data-tb></div>', true);

  // 10) Liquidations
  S.liquidations = function (root) { const m = main(root); const lh = M.liqHistory; const last = lh.slice(-24); const L = last.reduce((s, x) => s + x.long, 0), Sh = last.reduce((s, x) => s + x.short, 0); m.innerHTML = MA.head('Liquidations', 'Aggregated futures liquidations · all exchanges') + '<div class="ma-tiles">' + MA.tile('24h Total', MA.usd(L + Sh), 'Long + Short') + MA.tile('Long Liquidations', MA.usd(L), F.num((L / (L + Sh)) * 100, 1) + '% of total', 'ma-down') + MA.tile('Short Liquidations', MA.usd(Sh), F.num((Sh / (L + Sh)) * 100, 1) + '% of total', 'ma-up') + MA.tile('Largest Coin', CG.esc(M.global.topLiqCoin), 'By 24h liquidations') + '</div>' + MA.panel('Liquidations', 'Long Liq / Short Liq · hourly · 48h', '<div data-ch></div>') + MA.panel('By Coin (24h)', M.coins.length + ' coins · sortable · click a row to open the coin', '<div data-tb></div>', true);
    MA.chart(m.querySelector('[data-ch]'), { type: 'bar', stacked: true, height: 260, labels: lh.map((x) => MA.dmh(new Date(x.time))), series: [{ name: 'Long Liq', data: lh.map((x) => x.long), color: DOWN, format: MA.usd }, { name: 'Short Liq', data: lh.map((x) => x.short), color: UP, format: MA.usd }], yFormat: usdFmt });
    MA.table(m.querySelector('[data-tb]'), { cols: [MA.col.coin(), MA.col.usd('liq24h', '24h Total'), { key: 'longLiq24h', label: 'Long', align: 'r', val: (c) => c.longLiq24h, html: (c) => '<span class="ma-mono ma-down">' + MA.usd(c.longLiq24h) + '</span>' }, { key: 'shortLiq24h', label: 'Short', align: 'r', val: (c) => c.shortLiq24h, html: (c) => '<span class="ma-mono ma-up">' + MA.usd(c.shortLiq24h) + '</span>' }], rows: M.coins, sort: { key: 'liq24h', dir: 'desc' }, nav: (c) => '/terminal/coin/' + c.symbol }); };
  // 11) Exchange Balance
  S.exchangeBalance = function (root) { const m = main(root); const eb = MA.exchBalance(); const cur = eb[eb.length - 1].balance, d1 = eb[eb.length - 2].balance, d7 = eb[eb.length - 8].balance, d30 = eb[eb.length - 31].balance; const chg = (a, b) => ((a - b) / b) * 100; m.innerHTML = MA.head('Exchange Balance', 'Bitcoin held on exchanges') + '<div class="ma-tiles">' + MA.tile('Total BTC Balance', F.int(cur) + ' BTC', '≈ ' + MA.usd(cur * MA.coin('BTC').price)) + MA.tile('24h Change', MA.pct(chg(cur, d1)), F.signed(cur - d1, 0) + ' BTC') + MA.tile('7d Change', MA.pct(chg(cur, d7)), F.signed(cur - d7, 0) + ' BTC') + MA.tile('30d Change', MA.pct(chg(cur, d30)), F.signed(cur - d30, 0) + ' BTC') + '</div>' + MA.panel('BTC Balance', 'Total balance across tracked exchanges · daily · 90d', '<div data-ch></div>') + MA.panel('Balance by Exchange', 'BTC held per exchange · sortable · click a row to open the exchange', '<div data-tb></div>', true);
    MA.chart(m.querySelector('[data-ch]'), { type: 'area', height: 260, labels: eb.map((x) => MA.dm(x.date)), series: [{ name: 'BTC Balance', data: eb.map((x) => x.balance), color: ACC, format: (v) => F.int(v) + ' BTC' }], yFormat: (v) => F.compact(v) });
    const pc = (k, l) => ({ key: k, label: l, align: 'r', val: (e) => e[k], html: (e) => MA.pct(e[k]) }); MA.table(m.querySelector('[data-tb]'), { cols: [exCol(), { key: 'btcBalance', label: 'BTC Balance', align: 'r', val: (e) => e.btcBalance, html: (e) => MA.mono(F.int(e.btcBalance) + ' BTC') }, pc('btcBalanceChg24', '24h %'), pc('btcBalanceChg7d', '7d %'), pc('btcBalanceChg30d', '30d %')], rows: M.exchanges, sort: { key: 'btcBalance', dir: 'desc' }, nav: (e) => '/terminal/exchanges/' + e.name }); };

  S.unlocks = function (root) { main(root).innerHTML = MA.head('Token Unlock Schedule', 'Upcoming vesting events') + '<div class="ma-panel">' + MA.empty('Token unlock data unavailable', 'This data source is not enabled on the current plan. Enable a token-unlock endpoint in the proxy to populate this view — no mock data shown.') + '</div>'; };
  // 13) Fear & Greed
  S.fearGreed = function (root) { const m = main(root); const fg = M.fearGreed; const v = M.fearGreedNow; const at = (n) => fg[fg.length - 1 - n].value; const lab = (x) => x + '<small class="ma-mute">' + M.fgLabel(x) + '</small>'; m.innerHTML = MA.head('Fear & Greed Index', 'Crypto market sentiment · updated daily') + '<div class="ma-grid ma-grid-2">' + MA.panel('Fear &amp; Greed Index', 'Now · ' + M.fgLabel(v), '<div data-gauge></div>') + MA.panel('History', 'F&amp;G · daily · 90d', '<div data-ch></div>') + '</div><div class="ma-tiles">' + MA.tile('Now', lab(v), MA.dm(CG.NOW)) + MA.tile('Yesterday', lab(at(1)), MA.dm(new Date(CG.NOW - 86400000))) + MA.tile('Last Week', lab(at(7)), MA.dm(new Date(CG.NOW - 7 * 86400000))) + MA.tile('Last Month', lab(at(30)), MA.dm(new Date(CG.NOW - 30 * 86400000))) + '</div>'; MA.gauge(m.querySelector('[data-gauge]'), v); MA.chart(m.querySelector('[data-ch]'), { type: 'area', height: 232, labels: fg.map((x) => MA.dm(new Date(x.date))), series: [{ name: 'F&G', data: fg.map((x) => x.value), color: ACC, format: (x) => x + ' · ' + M.fgLabel(x) }], yFormat: (x) => String(x), refs: [{ y: 25, label: 'Extreme Fear', color: DOWN }, { y: 75, label: 'Extreme Greed', color: UP }] }); };
  // 14) BTC Cycle
  S.cycle = function (root) { const m = main(root); const ch = M.cycleHistory; const cy = M.cycle; const labels = ch.map((x) => MA.dm(new Date(x.date))); m.innerHTML = MA.head('BTC Cycle Indicators', 'AHR999 · Puell Multiple · Pi Cycle Top · daily · 180d') + '<div class="ma-tiles">' + MA.tile('AHR999', F.num(cy.ahr999, 2), cy.ahr999 < 0.45 ? 'Bottom zone (< 0.45)' : cy.ahr999 < 1.2 ? 'Accumulate (0.45 – 1.2)' : 'Above 1.2') + MA.tile('Puell Multiple', F.num(cy.puell, 2), cy.puell < 0.5 ? 'Undervalued (< 0.5)' : cy.puell > 4 ? 'Overheated (> 4)' : 'Neutral (0.5 – 4)') + MA.tile('Pi Cycle · 111DMA', '$' + F.int(cy.piCycle.ma111), '350DMA×2 $' + F.int(cy.piCycle.ma350x2)) + MA.tile('Rainbow Band', CG.esc(cy.rainbowBand), '2Y MA $' + F.int(cy.twoYearMa)) + '</div>' + MA.panel('AHR999', 'Bitcoin accumulation index', '<div data-ch="a"></div>') + MA.panel('Puell Multiple', 'Daily issuance value / 365d MA', '<div data-ch="p"></div>') + MA.panel('Pi Cycle', 'BTC price with 111DMA and 350DMA×2', '<div data-ch="pi"></div>');

    MA.chart(m.querySelector('[data-ch="p"]'), { type: 'area', height: 220, labels, series: [{ name: 'Puell Multiple', data: ch.map((x) => x.puell), color: SEC, format: (v) => F.num(v, 2) }], yFormat: (v) => F.num(v, 2), refs: [{ y: 0.5, label: 'Undervalued 0.5', color: UP }] });
    MA.chart(m.querySelector('[data-ch="pi"]'), { height: 260, labels, series: [{ name: 'BTC Price', data: ch.map((x) => x.price), color: ACC, format: (v) => '$' + F.int(v) }, { name: '111DMA', data: ch.map((x) => x.ma111), color: SEC, format: (v) => '$' + F.int(v) }, { name: '350DMA×2', data: ch.map((x) => x.ma350x2), color: THIRD, format: (v) => '$' + F.int(v) }], yFormat: (v) => '$' + F.compact(v), legend: true }); };
  // ---------- live price tick on the coin page (BTC / ETH / XAUT come from CG.ASSETS) ----------
  CG.on('tick', (A) => { if (CG.current.route !== '/terminal/coin/:symbol') return; const sym = String(CG.current.params.symbol || '').toUpperCase(); const a = A[sym]; if (!a) return; const act = CG.$('section.screen.active'); const el = act && act.querySelector('[data-live-price]'); if (!el) return; el.textContent = MA.price(a.price); el.style.color = a.price >= (a.prev || a.price) ? 'hsl(var(--ma-up))' : 'hsl(var(--ma-down))'; setTimeout(() => { el.style.color = ''; }, 600); });
  // ---------- registrations ----------
  const reg = (route, fn) => CG.register(route, { show(root, params, query) { fn(root, params || {}, query || {}); } });
  reg('/terminal', S.dashboard); reg('/terminal/spot', S.spot); reg('/terminal/sectors/:slug', S.sector); reg('/terminal/etf', S.etf); reg('/terminal/coin/:symbol', S.coin); reg('/terminal/exchanges/:exchange', S.exchange); reg('/terminal/derivatives/open-interest', S.oi); reg('/terminal/derivatives/funding', S.funding); reg('/terminal/derivatives/long-short', S.longShort); reg('/terminal/derivatives/liquidations', S.liquidations); reg('/terminal/onchain/exchange-balance', S.exchangeBalance); reg('/terminal/onchain/unlocks', S.unlocks); reg('/terminal/indicators/fear-greed', S.fearGreed); reg('/terminal/indicators/cycle', S.cycle);
