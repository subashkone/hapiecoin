<!-- ===== /analyse · trading panels (Strategy, Paper Trades, Live Trades) + trading dialogs · area 21 ===== -->
<div id="analyse-trading-holder" hidden>
  <div class="lp-panel trd-panel" data-tab="strategy" hidden>
    <div class="tabs-line trd-subtabs">
      <button class="tab active" data-trd-subtab="builder" data-tour="builder-tab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Builder</button>
      <button class="tab" data-trd-subtab="templates" data-tour="templates-tab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Templates</button>
    </div>
    <div class="trd-sub" data-trd-sub="builder"><div id="trd-builder"></div></div>
    <div class="trd-sub" data-trd-sub="templates" hidden><div id="trd-templates"></div></div>
  </div>
  <div class="lp-panel trd-panel" data-tab="paper" hidden><div id="trd-paper"></div></div>
  <div class="lp-panel trd-panel" data-tab="live" hidden><div id="trd-live"></div></div>
</div>
<script>
/* Fallback /analyse screen: only created when the workspace part is absent at script time, removed again at DOMContentLoaded if a real one appears later. */
(function () {
  if (document.querySelector('section.screen[data-route="/analyse"]')) return;
  var sec = document.createElement('section');
  sec.className = 'screen'; sec.setAttribute('data-route', '/analyse'); sec.setAttribute('data-title', 'Analyse'); sec.setAttribute('data-auth', 'user'); sec.setAttribute('data-trd-fallback', '1');
  sec.innerHTML = '<div data-cg="app-header"></div><div class="trd-fallback"><div class="trd-fallback-note text-xs text-muted">Fallback /analyse shell (workspace part not present) · left-pane trading panels only</div><div class="tabs-line trd-fallback-tabs"><button class="tab" data-trd-tab="chain">Options Chain</button><button class="tab active" data-trd-tab="strategy">Strategy</button><button class="tab" data-trd-tab="paper">Paper Trades</button><button class="tab" data-trd-tab="live">Live Trades</button></div><div id="analyse-left-panels"><div class="lp-panel" data-tab="chain" hidden><div class="empty"><b>Options Chain</b>The options chain panel is rendered by the workspace part.</div></div></div></div>';
  document.currentScript.insertAdjacentElement('beforebegin', sec);
  document.addEventListener('DOMContentLoaded', function () { if (document.querySelectorAll('section.screen[data-route="/analyse"]').length > 1) sec.remove(); });
})();
</script>
<style>
/* ---- area 21: trading panels & dialogs (all classes prefixed trd-) ---- */
.trd-panel[hidden],.trd-sub[hidden],.trd-fallback .lp-panel[hidden]{display:none!important}
.trd-panel{padding:10px 12px 16px;font-size:13px;overflow:auto;display:block}
.trd-fallback{max-width:820px;margin:0 auto;padding:12px 16px 40px}
.trd-fallback-note{padding:6px 0}
.trd-fallback-tabs{margin-bottom:8px}
.trd-fallback .lp-panel{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:10px;min-height:320px}
.trd-subtabs{margin-bottom:10px}
.trd-subtabs .tab{font-size:12.5px;padding:7px 10px}
/* strategy legs card */
.trd-legs-card{overflow:hidden}
.trd-legs-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 6px;flex-wrap:wrap}
.trd-legs-title{font-family:var(--font-display);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.trd-legs-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trd-pmode{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid hsl(var(--border));background:hsl(var(--card))}
.trd-pmode.live{color:hsl(var(--profit));border-color:hsl(var(--profit)/.4);background:hsl(var(--buy-bg))}
.trd-pmode.custom{color:hsl(var(--warning));border-color:hsl(var(--warning)/.5);background:hsl(var(--warning-bg))}
.trd-basket{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:hsl(var(--muted-foreground));cursor:pointer;user-select:none}
.trd-basket .switch{width:30px;height:18px}.trd-basket .switch::after{width:12px;height:12px}.trd-basket .switch.on::after{transform:translateX(12px)}
.trd-name-row{display:flex;gap:8px;align-items:center;padding:0 12px 8px}
.trd-name-row .input{max-width:280px}
.trd-legs-wrap{overflow-x:auto}
.trd-legs-table{width:100%;border-collapse:collapse;font-size:12px}
.trd-legs-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--muted-foreground));font-weight:600;padding:6px 8px;border-top:1px solid hsl(var(--border));border-bottom:1px solid hsl(var(--border));text-align:left;white-space:nowrap;background:hsl(var(--muted)/.5)}
.trd-legs-table td{padding:6px 8px;border-bottom:1px solid hsl(var(--border));vertical-align:middle;white-space:nowrap}
.trd-legs-table tr.trd-leg-closed td{opacity:.6}
.trd-side{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:22px;padding:0 8px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.03em;cursor:pointer;border:1px solid transparent}
.trd-side.buy,.trd-badge-buy{background:hsl(var(--buy-bg));color:hsl(var(--buy));border-color:hsl(var(--buy)/.3)}
.trd-side.sell,.trd-badge-sell{background:hsl(var(--sell-bg));color:hsl(var(--sell));border-color:hsl(var(--sell)/.3)}
.trd-side[disabled]{cursor:default}
.trd-type{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.trd-type.call,.trd-badge-call{background:hsl(var(--buy-bg));color:hsl(var(--buy))}
.trd-type.put,.trd-badge-put{background:hsl(var(--sell-bg));color:hsl(var(--sell))}
.trd-type.fut{background:hsl(var(--info-bg));color:hsl(var(--info))}
.trd-adj{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.05em;background:hsl(262 83% 58%/.12);color:hsl(262 83% 58%);margin-left:4px}
.trd-closed{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:700;background:hsl(var(--muted));color:hsl(var(--muted-foreground));margin-left:4px}
.trd-money{font-size:10px;color:hsl(var(--muted-foreground));font-weight:500}
.trd-qty{width:64px;height:28px;padding:0 6px;text-align:right}
.trd-price-in{width:92px;height:28px;padding:0 6px;text-align:right;border-color:hsl(var(--warning)/.6)}
.trd-price{display:inline-block;padding:2px 4px;border-radius:4px}
.trd-icon-btn{width:26px;height:26px;border-radius:6px;display:inline-grid;place-items:center;color:hsl(var(--muted-foreground))}
.trd-icon-btn:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.trd-icon-btn.danger:hover{color:hsl(var(--destructive));background:hsl(var(--sell-bg))}
.trd-icon-btn.warn:hover{color:hsl(24 94% 45%);background:hsl(24 94% 53%/.12)}
.trd-add-row{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.trd-legs-foot{border-top:1px solid hsl(var(--border));padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:hsl(var(--muted)/.35)}
.trd-legs-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:hsl(var(--muted-foreground))}
.trd-legs-stats b{color:hsl(var(--foreground));font-weight:600}
.trd-legs-actions{display:flex;gap:6px;flex-wrap:wrap}
.trd-legs-actions .btn{height:32px;padding:0 12px;font-size:12px}
.trd-empty{padding:34px 16px 22px;text-align:center}
.trd-empty-ico{width:56px;height:56px;border-radius:14px;margin:0 auto 12px;display:grid;place-items:center;background:hsl(var(--info-bg));color:hsl(var(--primary))}
.trd-empty b{display:block;font-size:15px;font-family:var(--font-display)}
.trd-empty p{color:hsl(var(--muted-foreground));font-size:12.5px;margin-top:4px}
.trd-empty-actions{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.trd-empty-or{margin-top:12px;font-size:11.5px;color:hsl(var(--muted-foreground))}
/* templates */
.trd-tpl-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.trd-chips{display:flex;gap:4px;flex-wrap:wrap}
.trd-chip{height:26px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;color:hsl(var(--muted-foreground));border:1px solid transparent;display:inline-flex;align-items:center;gap:5px}
.trd-chip:hover{background:hsl(var(--muted))}
.trd-chip.active{background:hsl(var(--primary));color:#fff}
.trd-chip .trd-chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.trd-tpl-bar .select{width:auto;min-width:120px}
.trd-tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.trd-tpl-card{border:1px solid hsl(var(--border));border-radius:10px;padding:8px 8px 7px;background:hsl(var(--card));cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:4px}
.trd-tpl-card:hover{border-color:hsl(var(--primary));box-shadow:0 2px 10px -4px rgba(0,0,0,.2)}
.trd-tpl-svg{width:100%;height:44px;display:block}
.trd-tpl-name{font-size:10.5px;font-weight:600;line-height:1.2}
.trd-tpl-cat{font-size:9.5px;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.05em}
.trd-cat-Bullish{color:hsl(var(--profit))}.trd-cat-Bearish{color:hsl(var(--loss))}.trd-cat-Neutral{color:hsl(var(--primary))}.trd-cat-Others{color:hsl(262 83% 58%)}
.trd-my{margin-top:16px;border-top:1px solid hsl(var(--border));padding-top:12px}
.trd-my-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.trd-my-head>b{font-family:var(--font-display);font-size:14px}
.trd-my-tabs{display:flex;gap:2px;border-bottom:1px solid hsl(var(--border))}
.trd-my-tabs button{padding:6px 10px;font-size:11px;font-weight:600;color:hsl(var(--muted-foreground));border-bottom:2px solid transparent;margin-bottom:-1px}
.trd-my-tabs button.active{color:hsl(var(--primary));border-bottom-color:hsl(var(--primary))}
.trd-search{position:relative;flex:1;min-width:160px}
.trd-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:hsl(var(--muted-foreground))}
.trd-search .input{padding-left:28px;padding-right:26px}
.trd-search .trd-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.trd-toolbar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.trd-summary{display:flex;align-items:baseline;gap:10px;padding:10px 12px;border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--card));margin-bottom:10px}
.trd-summary .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--muted-foreground));font-weight:600}
.trd-summary .val{font-family:var(--font-mono);font-size:20px;font-weight:700}
.trd-summary .sub{font-size:11.5px;color:hsl(var(--muted-foreground));margin-left:auto}
/* strategy cards (paper / live / my templates) */
.trd-list{display:flex;flex-direction:column;gap:8px}
.trd-strat{border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--card));padding:10px 12px}
.trd-strat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.trd-strat-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trd-strat-pnl{font-family:var(--font-mono);font-size:16px;font-weight:700;text-align:right;white-space:nowrap}
.trd-strat-pnl small{display:block;font-size:10px;font-weight:500;color:hsl(var(--muted-foreground));font-family:var(--font-body)}
.trd-strat-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:hsl(var(--muted-foreground));margin-top:6px}
.trd-strat-meta b{color:hsl(var(--foreground));font-weight:600}
.trd-strat-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.trd-strat-actions .btn{height:28px;padding:0 10px;font-size:11.5px}
.trd-badge-paper{background:hsl(var(--info-bg));color:hsl(var(--primary))}
.trd-badge-live{background:hsl(var(--buy-bg));color:hsl(var(--buy))}
.trd-badge-draft{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.trd-badge-arch{background:hsl(var(--warning-bg));color:hsl(var(--warning))}
.trd-orders{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.trd-ochip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:600;font-family:var(--font-mono);border:1px solid hsl(var(--border))}
.trd-ochip.filled{color:hsl(var(--profit));border-color:hsl(var(--profit)/.4);background:hsl(var(--buy-bg))}
.trd-ochip.pending{color:hsl(var(--warning));border-color:hsl(var(--warning)/.5);background:hsl(var(--warning-bg))}
.trd-ochip.failed{color:hsl(var(--loss));border-color:hsl(var(--loss)/.4);background:hsl(var(--sell-bg))}
.trd-failed{margin-top:8px;font-size:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.trd-pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.trd-btn-orange{background:hsl(24 94% 53%);color:#fff}.trd-btn-orange:hover:not(:disabled){background:hsl(24 94% 47%)}
.trd-btn-orange-o{background:hsl(24 94% 53%/.1);color:hsl(24 94% 45%);border-color:hsl(24 94% 53%/.4)}.trd-btn-orange-o:hover:not(:disabled){background:hsl(24 94% 53%/.2)}
html.dark .trd-btn-orange-o{color:hsl(24 94% 65%)}
/* dialogs */
.trd-dlg .cg-dialog-body{padding-top:8px}
.trd-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.trd-mode{border:1px solid hsl(var(--border));border-radius:10px;padding:14px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;background:hsl(var(--card))}
.trd-mode b{font-size:14px}.trd-mode small{font-size:11px;color:hsl(var(--muted-foreground))}
.trd-mode .trd-mode-ico{font-size:22px;line-height:1;margin-bottom:4px}
.trd-mode.active{border-color:hsl(var(--primary));box-shadow:0 0 0 2px hsl(var(--primary)/.25);background:hsl(var(--info-bg))}
.trd-mode.active[data-mode="live"]{border-color:hsl(var(--profit));box-shadow:0 0 0 2px hsl(var(--profit)/.25);background:hsl(var(--buy-bg))}
.trd-mode:disabled{opacity:.5;cursor:not-allowed}
.trd-kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;padding:4px 0}
.trd-kv span{color:hsl(var(--muted-foreground))}.trd-kv b{font-family:var(--font-mono);font-weight:600;text-align:right}
.trd-box{border:1px solid hsl(var(--border));border-radius:10px;padding:10px 12px;background:hsl(var(--muted)/.35);margin-bottom:12px}
.trd-box-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--muted-foreground));font-weight:600;margin-bottom:6px}
.trd-pos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
.trd-pos-grid small{display:block;font-size:10.5px;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.05em}
.trd-pos-grid b{font-family:var(--font-mono);font-size:14px}
.trd-err{font-size:11.5px;color:hsl(var(--destructive));margin-top:4px}
.trd-pct-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trd-pct-chips .trd-chip{border-color:hsl(var(--border))}
.trd-pct-chips .input{width:80px;height:26px;font-size:12px}
.trd-pe-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid hsl(var(--border));font-size:12px;flex-wrap:wrap}
.trd-pe-row .input{width:96px;height:28px;font-size:12px}
.trd-live-ok{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:hsl(var(--buy-bg));border:1px solid hsl(var(--buy)/.35);font-size:12.5px;margin:10px 0}
.trd-live-ok b{color:hsl(var(--buy))}
.trd-live-wait{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:hsl(var(--warning-bg));border:1px solid hsl(var(--warning)/.5);font-size:12.5px;margin:10px 0}
.trd-check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid hsl(var(--border));border-radius:10px;cursor:pointer}
.trd-check b{display:block;font-size:13px}.trd-check span{font-size:11.5px;color:hsl(var(--muted-foreground))}
.trd-leglist{display:flex;flex-direction:column;gap:4px}
.trd-legline{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 8px;border:1px solid hsl(var(--border));border-radius:8px;background:hsl(var(--card))}
.trd-legline .mono{margin-left:auto}
.trd-fut-sym{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--muted)/.35);font-weight:600}
.trd-sidebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trd-sidebtn{height:38px;border-radius:8px;border:1px solid hsl(var(--border));font-weight:600;font-size:13px}
.trd-sidebtn.buy.active{background:hsl(var(--buy));color:#fff;border-color:hsl(var(--buy))}
.trd-sidebtn.sell.active{background:hsl(var(--sell));color:#fff;border-color:hsl(var(--sell))}
.trd-preview-table th,.trd-preview-table td{padding:7px 8px;font-size:12px}
/* chain modal */
.trd-chain-dlg{display:flex;flex-direction:column;max-height:88vh}
.trd-chain-head{display:flex;align-items:center;gap:12px;padding:16px 20px 10px;border-bottom:1px solid hsl(var(--border))}
.trd-chain-ico{width:44px;height:44px;border-radius:12px;background:hsl(var(--info-bg));color:hsl(var(--primary));display:grid;place-items:center}
.trd-chain-head .cg-dialog-desc{font-size:13px}
.trd-chain-head .cg-dialog-desc b{color:hsl(var(--foreground))}
.trd-exp-row{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid hsl(var(--border))}
.trd-exp-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
.trd-exp-strip::-webkit-scrollbar{display:none}
.trd-exp{height:34px;padding:0 14px;border-radius:8px;font-family:var(--font-mono);font-weight:600;font-size:13px;background:hsl(var(--muted));color:hsl(var(--foreground));white-space:nowrap;flex-shrink:0}
.trd-exp.active{background:hsl(var(--primary));color:#fff}
.trd-livebtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid hsl(var(--profit)/.5);background:hsl(var(--buy-bg));color:hsl(var(--profit));font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.trd-livebtn.off{border-color:hsl(var(--border));background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.trd-chain-wrap{flex:1;min-height:0;overflow:auto;border-bottom:1px solid hsl(var(--border));max-height:52vh}
.trd-chain{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:760px}
.trd-chain thead th{position:sticky;top:0;background:hsl(var(--card));z-index:2;font-weight:600;color:hsl(var(--muted-foreground));font-size:11.5px;padding:6px 8px;border-bottom:1px solid hsl(var(--border));text-align:center;white-space:nowrap}
.trd-chain thead tr.grp th{font-size:15px;font-family:var(--font-display);font-weight:700;padding:8px;border-bottom:0;top:0}
.trd-chain thead tr.cols th{top:34px}
.trd-chain thead th.calls{color:hsl(var(--profit))}.trd-chain thead th.puts{color:hsl(var(--loss))}
.trd-chain thead th.strk{background:hsl(var(--muted));color:hsl(var(--foreground));font-weight:700;letter-spacing:.06em}
.trd-chain td{padding:7px 8px;border-bottom:1px solid hsl(var(--border));text-align:center;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;position:relative}

    function render() {

      el.innerHTML = '<div class="cg-dialog-body"><div class="text-xs text-muted mb-1">Stop paper trading for this strategy:</div><div class="trd-box"><div class="flex items-center gap-2 flex-wrap"><b>' + esc(s.name) + '</b>' + statusBadge(s) + '<span class="badge badge-success">Live Prices</span></div><div class="flex gap-4 mt-2 text-xs text-muted flex-wrap"><span>Asset: <b class="mono">' + esc(s.asset) + '</b></span><span>Legs: <b class="mono">' + s.legs.length + '</b></span><span>P&amp;L: <b class="mono ' + pnlClass(s.totalPnl) + '" data-pnl>' + smoney(s.totalPnl) + '</b></span></div></div>' +
        (open.length ? '<div class="trd-box-title">Active Legs</div><div class="trd-leglist">' + open.map((l) => '<div class="trd-legline">' + sideBadge(l.side) + (l.type === 'FUTURE' ? '<span class="mono">' + esc(l.symbol) + '</span>' : typeBadge(l.type) + '<b class="mono">' + Number(l.strike).toLocaleString('en-US') + '</b>') + '<span class="text-muted">Qty: ' + l.lots + '</span><span class="mono" data-lp="' + l.id + '">' + money(currentPrice(l, s.asset)) + '</span></div>').join('') + '</div>' : '<div class="empty" style="padding:14px"><b>No active legs</b>All legs are already squared off</div>') +
        (liveOk ? '<div class="trd-live-ok"><span class="text-profit">' + I.check + '</span><div><b>Using Live WebSocket Prices</b><div class="text-xs text-muted">Current market prices will be used for all legs when stopping</div></div></div>' : '<div class="trd-live-wait"><span class="spinner"></span><div><b>Connecting to Live Prices</b><div class="text-xs text-muted">Please wait while we fetch current market prices...</div></div></div>') +
        '<label class="trd-check"><input type="checkbox" class="checkbox" data-arch' + (archive ? ' checked' : '') + (liveOk ? '' : ' disabled') + ' style="margin-top:2px"><div><b>Archive this strategy</b><span>Move to archived strategies. Uncheck to keep it active for future use.</span></div></label><div class="hint mt-2" data-hint>' + (archive ? 'Strategy will be moved to Archived Strategies and marked as closed. All active legs will be squared off at current prices.' : 'Strategy will remain in Draft Strategies but paper trading will be stopped. Legs stay saved so you can activate it again later.') + '</div></div>' +
        '<div class="cg-dialog-foot"><button class="btn btn-outline" data-cg-close>Cancel</button><button class="btn trd-btn-orange" data-go' + (liveOk ? '' : ' disabled') + ' title="' + (liveOk ? 'Stop paper trading' : 'Waiting for live prices...') + '">' + (liveOk ? 'Stop Trading' : 'Connecting...') + '</button></div>';
    }
    el.addEventListener('change', (e) => { if (e.target.hasAttribute('data-arch')) { archive = e.target.checked; el.querySelector('[data-hint]').textContent = archive ? 'Strategy will be moved to Archived Strategies and marked as closed. All active legs will be squared off at current prices.' : 'Strategy will remain in Draft Strategies but paper trading will be stopped. Legs stay saved so you can activate it again later.'; } });
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (!b) return; b.disabled = true; b.textContent = 'Stopping...'; setTimeout(() => { if (archive) { open.forEach((l) => { l.exitPremium = currentPrice(l, s.asset); l.status = 'SQUARED_OFF'; l.closedAt = nowIso(); }); s.status = 'ARCHIVED'; s.closedAt = nowIso(); } else { s.status = 'DRAFT'; s.tradingMode = null; s.startedAt = null; s.legs.forEach((l) => { if (l.status !== 'SQUARED_OFF') { l.price = l.entryPremium != null ? l.entryPremium : l.price; } }); } recalc(s); pushHistory(s); if (S.editing === s) { S.editing = null; AN.strategyId = null; renderBuilder(); } renderAll(); hd.close(); CG.emit('analyse:strategies-changed', s); CG.toast({ title: 'Paper trading stopped', description: archive ? s.name + ' archived · legs squared off at live prices' : s.name + ' moved to Draft Strategies', variant: 'success' }); if (opts.onDone) opts.onDone(); }, 700); });
    render();
    return hd;
  };
  T._renderPaper = renderPaper; T._renderLive = renderLive;
  // ======================================================================
  // INIT / REGISTER
  // ======================================================================
  function moveOrToggle(name) { const target = name === 'chain' ? null : S.panels[name]; if (!S.selfManaged) return; const cont = S.root.querySelector('#analyse-left-panels') || S.root; CG.$$('.lp-panel', cont).forEach((p) => { p.hidden = p.dataset.tab !== name; }); CG.$$('[data-trd-tab]', S.root).forEach((b) => b.classList.toggle('active', b.dataset.trdTab === name)); if (target) target.hidden = false; }
  function placePanels(root) { const holder = document.getElementById('analyse-trading-holder'); const cont = root.querySelector('#analyse-left-panels'); const dest = cont || root; ['strategy', 'paper', 'live'].forEach((k) => { const p = S.panels[k] || (holder && holder.querySelector('.lp-panel[data-tab="' + k + '"]')) || document.querySelector('.trd-panel[data-tab="' + k + '"]'); if (!p) return; S.panels[k] = p; if (p.parentNode !== dest) dest.appendChild(p); }); S.selfManaged = !cont || !!root.hasAttribute('data-trd-fallback'); if (holder && !holder.children.length) holder.remove(); }
  CG.register('/analyse:trading', {
    init(root) {
      S.root = root; seedLive(); M.strategies.forEach(recalc); placePanels(root);
      S.els.builder = document.getElementById('trd-builder'); S.els.templates = document.getElementById('trd-templates'); S.els.paper = document.getElementById('trd-paper'); S.els.live = document.getElementById('trd-live');
      bindBuilder(); bindTemplates(); bindPaper(); bindLive();
      CG.delegate(S.panels.strategy, 'click', '[data-trd-subtab]', (e, t) => T.setSubTab(t.dataset.trdSubtab));
      if (root.hasAttribute('data-trd-fallback')) { CG.delegate(root, 'click', '[data-trd-tab]', (e, t) => CG.emit('analyse:set-tab', t.dataset.trdTab)); }
      CG.on('analyse:set-tab', (name) => { if (S.selfManaged) { moveOrToggle(name); CG.emit('analyse:tab', name); } });
      CG.on('analyse:tab', (name) => { if (name === 'paper') renderPaper(); else if (name === 'live') renderLive(); else if (name === 'strategy') { if (S.subTab === 'templates') renderTemplates(); else renderBuilder(); } });
      /* chain → builder: the workspace toasts 'Leg Added' itself and falls back to pushing the leg when nobody emits legs-changed, so add silently and always emit */
      CG.on('analyse:addLeg', (leg) => { if (!leg) return; const added = T.addLeg(leg, { silent: true }); if (!added) CG.emit('analyse:legs-changed', AN.legs); });
      CG.on('tick', () => { tickBuilder(); M.strategies.forEach((s) => { if (s.status === 'PAPER' || s.status === 'LIVE') recalc(s); }); ['paper', 'live'].forEach((k) => { const el = S.els[k]; if (!el || (S.panels[k] && S.panels[k].hidden)) return; let tot = 0; M.strategies.filter((s) => s.status === (k === 'paper' ? 'PAPER' : 'LIVE')).forEach((s) => { tot += s.totalPnl; const set = (sel, v) => { const n = el.querySelector(sel); if (n) { n.className = n.className.replace(/text-(profit|loss)/g, '').trim() + ' ' + pnlClass(v); const small = n.querySelector('small'); n.textContent = smoney(v); if (small) n.appendChild(small); } }; set('[data-pnl="' + s.id + '"]', s.totalPnl); set('[data-upnl="' + s.id + '"]', s.unrealizedPnl); set('[data-rpnl="' + s.id + '"]', s.realizedPnl); }); const t = el.querySelector('[data-total]'); if (t) { t.textContent = smoney(tot); t.className = 'val ' + pnlClass(tot); } }); });
      /* asset switch: the workspace part may already have set CG.analyse.asset before we run, so compare against the asset the builder legs were built on */
      S.legsAsset = AN.asset;
      CG.on('asset', (sym) => {
        if (!sym || !CG.ASSETS[sym]) return; const cur = S.legsAsset || AN.asset;
        if (sym === cur) { AN.asset = sym; renderBuilder(); renderTemplates(); return; }
        if (!AN.legs.length) { S.legsAsset = sym; AN.asset = sym; renderBuilder(); renderTemplates(); return; }
        if (S.assetPrompt) return; S.assetPrompt = true;
        CG.modal.confirm({ title: 'Switch asset to ' + sym + '?', description: 'Changing the asset will clear the current strategy legs.', confirmText: 'Clear & Switch' }).then((ok) => {
          S.assetPrompt = false;
          if (ok) { S.legsAsset = sym; AN.asset = sym; AN.legs = []; AN.name = ''; S.editing = null; AN.strategyId = null; S.dirty = false; legsChanged(); renderTemplates(); }
          else { ST.asset = cur; CG.saveState(); CG.emit('asset', cur); /* lets the workspace/chrome switch back (they early-return when CG.analyse.asset already matches) */ AN.asset = cur; renderBuilder(); renderTemplates(); }
        });
      });
      const onExpiry = (code) => { if (code && CG.EXPIRIES.includes(code)) { AN.expiry = code; S.tplExpiry = code; if (S.subTab === 'templates') renderTemplates(); } };
      CG.on('expiry', onExpiry); CG.on('analyse:expiry', onExpiry);
      CG.on('currency', () => renderAll()); CG.on('settings', () => renderAll()); CG.on('currency-settings-changed', () => renderAll()); CG.on('analyse:strategies-changed', () => { if (S.subTab === 'templates') renderTemplates(); });
      renderAll();
      if (S.selfManaged) moveOrToggle('strategy');
    },
    show(root) { placePanels(root); M.strategies.forEach(recalc); renderAll(); if (S.selfManaged && ['strategy', 'paper', 'live'].every((k) => S.panels[k].hidden)) moveOrToggle('strategy'); }
  });
  T.render = renderAll; T.refresh = () => { M.strategies.forEach(recalc); renderAll(); };
  T.state = () => ({ analyse: AN, editing: S.editing, dirty: S.dirty, subTab: S.subTab, basket: S.basket });
})();
</script>
